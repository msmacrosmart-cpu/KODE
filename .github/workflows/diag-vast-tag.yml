name: Diagnostico da tag VAST (temporario)
on:
  push:
    paths:
      - '.github/workflows/diag-vast-tag.yml'
jobs:
  medir:
    runs-on: ubuntu-latest
    steps:
      - name: Ver o XML cru e varias tentativas
        run: |
          python3 - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET
          TAG = ('https://vapid-size.com/dEmwF.zYdOGYNKvRZ/GoUG/beLmU9TuDZrUJl/'
                 'koPpTRcX2iNbDMED3/NzDLkpt/N/zFYf0/MsTEcv1sMXwC')
          def aviso(t):
              t = ' '.join(str(t).replace('\r',' ').replace('\n',' ').split())
              print('::notice::' + t[:900])
          for tentativa in range(3):
              for ua in ('SMARTEDTV/VAST', 'Mozilla/5.0 (Linux; Android 9) Chrome/120 Mobile'):
                  try:
                      req = urllib.request.Request(TAG, headers={'User-Agent': ua})
                      xml = urllib.request.urlopen(req, timeout=25).read().decode('utf-8', 'replace')
                  except Exception as erro:
                      aviso('TF4 t%d ua=%s erro=%r' % (tentativa, ua[:12], erro))
                      continue
                  try:
                      raiz = ET.fromstring(xml.strip())
                      tag_raiz = raiz.tag
                      ads = len(list(raiz.iter('Ad')))
                      inline = len(list(raiz.iter('InLine')))
                      media = len(list(raiz.iter('MediaFile')))
                      erro_txt = ' '.join((e.text or '') for e in raiz.iter('Error'))[:200]
                  except Exception as erro:
                      tag_raiz, ads, inline, media, erro_txt = 'NAO-XML', -1, -1, -1, repr(erro)[:120]
                  aviso('TF4 t%d ua=%s bytes=%d raiz=%s ads=%d inline=%d media=%d err=%s' % (
                      tentativa, ua[:12], len(xml), tag_raiz, ads, inline, media, erro_txt))
                  if tentativa == 0:
                      aviso('TF4 cru: ' + xml[:600])
          PY
