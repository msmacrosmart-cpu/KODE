name: Diagnostico da tag VAST (temporario)
on:
  push:
    paths:
      - '.github/workflows/diag-vast-tag.yml'
jobs:
  medir:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir a tag e reportar por anotacao
        run: |
          TAG='https://vapid-size.com/dEmwF.zYdOGYNKvRZ/GoUG/beLmU9TuDZrUJl/koPpTRcX2iNbDMED3/NzDLkpt/N/zFYf0/MsTEcv1sMXwC'
          APP='SMARTEDTV/VAST'
          NAV='Mozilla/5.0 (Linux; Android 9; AFTMM Build/PS7624; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/120.0 Mobile Safari/537.36'
          aviso() { printf '::notice::%s\n' "$(printf '%s' "$*" | tr '\r\n' '  ' | cut -c1-900)"; }
          for par in "app|$APP" "navegador|$NAV"; do
            nome=${par%%|*}; ua=${par#*|}
            codigo=$(curl -sS -L --max-time 25 -A "$ua" -D /tmp/h-$nome.txt -o /tmp/c-$nome.txt -w '%{http_code}' "$TAG" 2>/tmp/e-$nome.txt) || codigo=000
            aviso "TF-$nome http=$codigo bytes=$(wc -c < /tmp/c-$nome.txt 2>/dev/null || echo 0) erro=$(head -c 120 /tmp/e-$nome.txt 2>/dev/null)"
            aviso "TF-$nome tipo=$(grep -i '^content-type' /tmp/h-$nome.txt | tr -d '\r' | cut -c1-90)"
            for marca in '<VAST' 'InLine' 'Wrapper' 'MediaFile' 'VASTAdTagURI' 'VMAP' 'AdTagURI' '<html' '<iframe' 'window.location'; do
              aviso "TF-$nome marca $marca = $(grep -o -i -F "$marca" /tmp/c-$nome.txt 2>/dev/null | wc -l)"
            done
            aviso "TF-$nome inicio: $(head -c 240 /tmp/c-$nome.txt 2>/dev/null)"
            aviso "TF-$nome urls: $(grep -o -E 'https?://[^"'"'"' <>]+' /tmp/c-$nome.txt 2>/dev/null | head -3 | tr '\n' ' ')"
          done
