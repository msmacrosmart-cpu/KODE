name: Diagnostico da tag VAST (temporario)
on:
  push:
    paths:
      - '.github/workflows/diag-vast-tag.yml'
jobs:
  medir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag real + modulo real: escolhe anuncio e abre o criativo
        run: |
          python3 - <<'PY'
          import sys, types, urllib.request, importlib.util
          def aviso(t):
              t = ' '.join(str(t).replace('\r',' ').replace('\n',' ').split())
              print('::notice::' + t[:900])
          xbmc = types.ModuleType('xbmc')
          xbmc.LOGINFO, xbmc.LOGWARNING, xbmc.LOGERROR = 1, 3, 4
          xbmc.getInfoLabel = lambda _s: ''
          xbmc.getCondVisibility = lambda _s: False
          xbmc.executebuiltin = lambda *a, **k: None
          xbmc.log = lambda *a, **k: None
          xbmc.Player = lambda *a, **k: types.SimpleNamespace(
              isPlaying=lambda: False, isPlayingVideo=lambda: False,
              getPlayingFile=lambda: '', getTime=lambda: 0.0, getTotalTime=lambda: 0.0)
          sys.modules['xbmc'] = xbmc
          spec = importlib.util.spec_from_file_location(
              'ads_vast', 'kodi/addons/service.smarted.bootstrap/ads_vast.py')
          vast = importlib.util.module_from_spec(spec); spec.loader.exec_module(vast)
          TAG = vast.VAST_TAG_PADRAO
          aviso('TAG = %s' % TAG)
          dados = vast.baixar(TAG)
          aviso('resposta bytes=%s' % (len(dados) if dados else 0))
          anuncio = vast.escolher_anuncio(dados, 1080)
          if not anuncio:
              aviso('FALHOU: escolher_anuncio=None'); raise SystemExit(1)
          aviso('anuncio url=%s' % anuncio['url'][:110])
          aviso('tipo=%s duracao=%ss skip=%ss impressoes=%d eventos=%s' % (
              anuncio['tipo'], anuncio['duracao'], anuncio['tempo_skip'],
              len(anuncio['impressao']), sorted(k for k,v in anuncio['eventos'].items() if v)))
          try:
              r = urllib.request.Request(anuncio['url'], headers={'User-Agent': 'SMARTEDTV/VAST'})
              with urllib.request.urlopen(r, timeout=30) as resp:
                  cabeca = resp.read(4096)
                  aviso('criativo http=%s tipo=%s bytes_lidos=%d' % (
                      resp.status, resp.headers.get('Content-Type'), len(cabeca)))
          except Exception as e:
              aviso('criativo FALHOU: %r' % (e,)); raise SystemExit(1)
          # prova do caminho de exibicao com player/relogio falsos
          recibo = vast.exibir(tag=TAG, altura_tela=1080,
                               baixar_tag=vast.baixar,
                               dormir=lambda s: None,
                               tocar=lambda url, log=None: print('::notice::PLAYER recebeu ' + url[:100]) or True)
          aviso('recibo: %s' % vast.resumo(recibo))
          PY
