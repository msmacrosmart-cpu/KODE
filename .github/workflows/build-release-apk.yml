# v1.0.48: rodada 21 - skin BINGIE MOD 2.2.3 embarcada como skin padrao, renomeada SMARTEDTV.
# (historico) rodada 14 - cards em grade para as 6 categorias de VOD, filtros de ordenacao, icones das categorias e notificacoes SMARTEDTV.
name: Build SMARTED-TV release APK
on:
  workflow_dispatch:
  push:
    branches: [arena/1a97faf9-kode]
    paths: [.github/workflows/build-release-apk.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Obter APK final anterior (v1.0.22, blocos versionados)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          ids = json.loads(pathlib.Path('.github/private-apk-chunks.json').read_text())
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'base' / 'SMARTED-TV-v1.0.22-arm64.apk'
          with out.open('wb') as fh:
              for sha in ids:
                  p = subprocess.run(['gh', 'api', '-H', 'Accept: application/vnd.github.raw+json',
                                      'repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs/' + sha],
                                     capture_output=True, check=True)
                  data = p.stdout
                  if hashlib.sha1(('blob %d\0' % len(data)).encode() + data).hexdigest() != sha:
                      raise SystemExit('Falha na integridade de um bloco')
                  fh.write(data)
          if hashlib.sha256(out.read_bytes()).hexdigest() != '8b58ee878aa0356a268bfa19bb891b079233370c9fd367d54a9a425bcd6d9b2e':
              raise SystemExit('Hash do APK base não confere')
          print('APK base 1.0.22 reconstituído e conferido:', out.stat().st_size, 'bytes')
          PY
          ls -lh "$RUNNER_TEMP/base/"
      - name: Chave de assinatura (repositório)
        run: |
          cp dropbox/smarted-tv-test.jks "$RUNNER_TEMP/smarted-tv-test.jks"
          test "$(stat -c%s "$RUNNER_TEMP/smarted-tv-test.jks")" = "2730"
          echo "Chave do repositório usada (2730 bytes)."
      - name: Preparar ferramentas de reempacotamento
        run: ./tools/kodi/setup.sh
      - name: Baixar addons extras (skin Bingie Mod)
        run: python3 tools/kodi/fetch-bingie-addons.py "$RUNNER_TEMP/extra"
      - name: Montar candidato sem assinatura (versão + skin.novatv + ponte)
        run: |
          export PYTHONPATH="$HOME/.cache/kode-build/python:$PYTHONPATH"
          python3 tools/kodi/build-release-apk.py --from-version 1.0.22 --to-version 1.0.48 --to-code 2103034 --extra-addons "$RUNNER_TEMP/extra" --default-skin "$RUNNER_TEMP/extra/skin.titan.bingie.mod" "$RUNNER_TEMP/base/SMARTED-TV-v1.0.22-arm64.apk" "$RUNNER_TEMP/unsigned.apk"
          ls -lh "$RUNNER_TEMP/unsigned.apk"

      - name: Verificar integridade de boot (simulação do launcher dex)
        run: |
          python3 tools/kodi/verify-boot-integrity.py "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/base/SMARTED-TV-v1.0.22-arm64.apk"
      - name: Alinhar e assinar (mesma chave da linha 1.0.15+)
        run: |
          set -eo pipefail
          CACHE="$HOME/.cache/kode-build"
          JAVA="$CACHE/python/jdk4py/java-runtime/bin/java"
          SIGNER="$CACHE/tools/apksigner.jar"
          LOG="$RUNNER_TEMP/passo9.log"
          : > "$LOG"
          publicar_log() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              python3 - "$LOG" <<'PYEOF'
          import pathlib, sys
          texto = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          linhas = [l for l in texto.splitlines() if l.strip()]
          if not linhas:
              print("::error::passo 9 falhou sem saida registrada")
          for bloco in range(0, len(linhas), 6):
              print("::error::" + " | ".join(linhas[bloco:bloco + 6])[:900])
          PYEOF
            fi
            exit "$rc"
          }
          trap publicar_log EXIT
          df -h "$RUNNER_TEMP" 2>&1 | tee -a "$LOG"
          python3 tools/kodi/align-apk.py "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk" 2>&1 | tee -a "$LOG"
          df -h "$RUNNER_TEMP" 2>&1 | tee -a "$LOG"
          "$JAVA" -jar "$SIGNER" sign --ks "$RUNNER_TEMP/smarted-tv-test.jks" --ks-pass pass:android --key-pass pass:android --ks-key-alias smarted-tv-test --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk" 2>&1 | tee -a "$LOG"
          "$JAVA" -jar "$SIGNER" verify --verbose --print-certs "$RUNNER_TEMP/signed.apk" 2>&1 | tee -a "$LOG" | tee "$RUNNER_TEMP/verify.txt"
          grep -qi "^Signer #1 certificate SHA-256 digest: 855de171e5560d517db1a69f6aa55562b72c8b66f9cc29dfd55be0a8aa00951a$" "$RUNNER_TEMP/verify.txt" || (echo "certificado inesperado" | tee -a "$LOG"; exit 1)
      - name: Verificar identidade, tamanho e conteúdo
        env:
          PYTHONPATH: /home/runner/.cache/kode-build/python
        run: |
          set -eo pipefail
          LOG="$RUNNER_TEMP/passo10.log"
          : > "$LOG"
          publicar_log() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              python3 - "$LOG" <<'PYEOF'
          import pathlib, sys
          texto = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          linhas = [l for l in texto.splitlines() if l.strip()]
          if not linhas:
              print("::error::passo 10 falhou sem saida registrada")
          for bloco in range(0, len(linhas), 6):
              print("::error::" + " | ".join(linhas[bloco:bloco + 6])[:900])
          PYEOF
            fi
            exit "$rc"
          }
          trap publicar_log EXIT
          python3 - <<'PY' 2>&1 | tee -a "$LOG"
          import hashlib, os, zipfile
          from pathlib import Path
          from pyaxmlparser import APK
          base = Path(os.environ["RUNNER_TEMP"]) / "base/SMARTED-TV-v1.0.22-arm64.apk"
          out = Path(os.environ["RUNNER_TEMP"]) / "signed.apk"
          a = APK(str(out))
          assert (a.package, a.get_app_name(), a.version_name, str(a.version_code)) == ('org.xbmc.kodi', 'SMARTED-TV', '1.0.48', str(int(a.version_code))), (a.package, a.get_app_name(), a.version_name, a.version_code)
          assert int(a.version_code) == 2103034, f"versionCode inesperado: {a.version_code}"
          print(f"Identidade: {a.package} {a.get_app_name()} {a.version_name} ({a.version_code})")
          with zipfile.ZipFile(base) as before, zipfile.ZipFile(out) as after:
              assert after.testzip() is None
              oldlibs = {n for n in before.namelist() if n.startswith('lib/') and n.endswith('.so')}
              newlibs = {n for n in after.namelist() if n.startswith('lib/') and n.endswith('.so')}
              assert oldlibs == newlibs and oldlibs, "Bibliotecas alteradas"
              def digest(z, n):
                  h = hashlib.sha256()
                  with z.open(n) as f:
                      for c in iter(lambda: f.read(1024*1024), b''):
                          h.update(c)
                  return h.digest()
              for n in sorted(oldlibs | {'classes.dex'}):
                  assert digest(before, n) == digest(after, n), f"Código alterado: {n}"
              print(f"Motor preservado: {len(oldlibs)} bibliotecas + classes.dex idênticos")
              # skin.novatv no APK = skin BINGIE MOD 2.2.3 renomeada para SMARTEDTV,
              # e a skin classica do repositorio vai junto como opcao de volta.
              import xml.etree.ElementTree as ET
              SKIN_ID, SKIN_NAME = "skin.novatv", "SMARTEDTV"
              SKIN_VERSION = "2.2.3"
              skin_xml = ET.fromstring(after.read(f'assets/addons/{SKIN_ID}/addon.xml'))
              assert (skin_xml.get('id'), skin_xml.get('name'), skin_xml.get('version')) == (SKIN_ID, SKIN_NAME, SKIN_VERSION), \
                  f"addon.xml da skin padrao inesperado: {skin_xml.get('id')} {skin_xml.get('name')} {skin_xml.get('version')}"
              assert b'id="skin.novatv"' in after.read(f'assets/addons/{SKIN_ID}/addon.xml'), "id novo da skin ausente no addon.xml"
              skin_entries = [n for n in after.namelist() if n.startswith(f'assets/addons/{SKIN_ID}/')]
              assert len(skin_entries) > 500, f"skin padrao incompleta: {len(skin_entries)} arquivos"
              for obrigatorio in ('addon.xml', 'xml/Home.xml', 'xml/Includes.xml', 'resources/icon.png'):
                  assert f'assets/addons/{SKIN_ID}/{obrigatorio}' in after.namelist(), f"skin padrao sem {obrigatorio}"
              classic_xml = ET.fromstring(after.read('assets/addons/skin.smartedtv.classic/addon.xml'))
              assert (classic_xml.get('id'), classic_xml.get('version')) == ('skin.smartedtv.classic', '1.0.17'), \
                  f"skin classica inesperada: {classic_xml.get('id')} {classic_xml.get('version')}"
              for p in sorted(Path('kodi/skin.estilo.personalizado').rglob('*')):
                  if not p.is_file() or '__pycache__' in p.parts or p.suffix in ('.pyc',):
                      continue
                  rel = p.relative_to('kodi/skin.estilo.personalizado').as_posix()
                  if rel == 'addon.xml':
                      continue
                  arc = f'assets/addons/skin.smartedtv.classic/{rel}'
                  assert arc in after.namelist() and after.read(arc) == p.read_bytes(), f"skin classica divergente: {arc}"
              # Addons do repositório (ponte + bootstrap) devem ir byte a byte.
              bridges = [d for d in sorted(Path('kodi/addons').iterdir()) if d.is_dir()]
              assert {d.name for d in bridges} >= {'plugin.video.smarted', 'service.smarted.bootstrap'}, \
                  f"addons do repositório ausentes: {[d.name for d in bridges]}"
              for addon_dir in bridges:
                  for p in sorted(addon_dir.rglob('*')):
                      if not p.is_file() or '__pycache__' in p.parts or p.suffix == '.pyc':
                          continue
                      arc = f'assets/addons/{addon_dir.name}/' + p.relative_to(addon_dir).as_posix()
                      assert arc in after.namelist(), f"entry ausente: {arc}"
                      assert after.read(arc) == p.read_bytes(), f"Divergência addon: {arc}"
              manifest = after.read('assets/system/addon-manifest.xml').decode()
              for addon_id in [SKIN_ID, 'skin.smartedtv.classic'] + [d.name for d in bridges]:
                  assert f'>{addon_id}<' in manifest, f'addon ausente do manifesto: {addon_id}'
              print("Skin padrao SMARTEDTV (Bingie 2.2.3) + skin classica + addons do repositorio conferidos no APK.")
          print(f"Tamanho base: {base.stat().st_size} -> final: {out.stat().st_size}")
          # CICLO DE VIDA: registra o que o manifest do player ja declara
          try:
              import zipfile, re as _re
              with zipfile.ZipFile(out) as z:
                  binm = z.read('AndroidManifest.xml')
              achados = set(m.decode('utf-16-le', 'ignore') for m in _re.findall(
                  rb'(?:[\x20-\x7e]\x00){4,}', binm))
              chaves = sorted(t for t in achados if any(k in t for k in (
                  'configChanges', 'launchMode', 'screenSize', 'orientation',
                  'singleTask', 'resizeableActivity', 'hardwareAccelerated')))
              print('CICLO DE VIDA - manifest:', chaves[:12])
          except Exception as erro:
              print('CICLO DE VIDA - diagnostico indisponivel:', erro)
          print(f"SHA-256 final: {hashlib.sha256(out.read_bytes()).hexdigest()}")
          PY
          ls -lh "$RUNNER_TEMP/signed.apk"
      - name: Publicar release final
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP/signed.apk" "SMARTED-TV-v1.0.48-arm64.apk"
          sha256sum "SMARTED-TV-v1.0.48-arm64.apk" | tee "$RUNNER_TEMP/sha.txt"
          TAG=v1.0.48-smarted-arm64
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "SMARTED-TV-v1.0.48-arm64.apk" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
            echo "Release $TAG atualizada com o APK assinado."
          else
          gh release create v1.0.48-smarted-arm64 "SMARTED-TV-v1.0.48-arm64.apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'SMARTED-TV 1.0.48 ARM64 - skin Bingie (SMARTEDTV)' --notes 'SMARTED-TV 1.0.48 (ARM64, Kodi 21.3, org.xbmc.kodi) - ATUALIZACAO DA LINHA PRINCIPAL com a skin BINGIE MOD 2.2.3 (Titan Bingie mod de AchillesPunks, para Kodi 21/Omega) embarcada no APK e renomeada para SMARTEDTV. Ela ja vem como skin padrao: o app abre direto nela, sem baixar nada no aparelho. Todas as dependencias da skin vao embutidas (script.bingie.helper, script.skinshortcuts, script.skin.helper.service, script.skin.helper.widgets, script.skin.helper.backgrounds, plugin.video.themoviedb.helper, script.module.* e resource.images.*). Tres dependencias opcionais que nao existem no repositorio do autor (plugin.video.youtube, plugin.program.autocompletion e resource.images.studios.coloured) foram liberadas do addon.xml: a skin carrega sem elas, apenas widgets que usam esses addons ficam sem conteudo. A skin SMARTEDTV anterior continua instalada como SMARTEDTV Classica - para voltar a interface antiga: Ajustes > Aparencia > Skin > SMARTEDTV Classica. Motor de carregamento, addons e ajustes do aplicativo seguem iguais aos da 1.0.47.'
          fi
          echo "::notice::Release publicada: https://github.com/$GITHUB_REPOSITORY/releases/download/v1.0.48-smarted-arm64/SMARTED-TV-v1.0.48-arm64.apk"
# Os blocos do APK base ficam em .github/private-apk-chunks.json; a assinatura usa dropbox/smarted-tv-test.jks.
