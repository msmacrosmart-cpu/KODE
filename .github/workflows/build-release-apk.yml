# v1.0.38: rodada 12 - navegacao dos addons corrigida (MyVideoNav), barra com as pastas reais do addon, espacamento das opcoes abaixo do HERO e HERO automatico.
name: Build SMARTED-TV release APK
on:
  workflow_dispatch:
  push:
    branches: [arena/1a97faf9-kode]
    paths: [.github/workflows/build-release-apk.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Obter APK final anterior (v1.0.22, blocos versionados)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          ids = json.loads(pathlib.Path('.github/private-apk-chunks.json').read_text())
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'base' / 'SMARTED-TV-v1.0.22-arm64.apk'
          with out.open('wb') as fh:
              for sha in ids:
                  p = subprocess.run(['gh', 'api', '-H', 'Accept: application/vnd.github.raw+json',
                                      'repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs/' + sha],
                                     capture_output=True, check=True)
                  data = p.stdout
                  if hashlib.sha1(('blob %d\0' % len(data)).encode() + data).hexdigest() != sha:
                      raise SystemExit('Falha na integridade de um bloco')
                  fh.write(data)
          if hashlib.sha256(out.read_bytes()).hexdigest() != '8b58ee878aa0356a268bfa19bb891b079233370c9fd367d54a9a425bcd6d9b2e':
              raise SystemExit('Hash do APK base não confere')
          print('APK base 1.0.22 reconstituído e conferido:', out.stat().st_size, 'bytes')
          PY
          ls -lh "$RUNNER_TEMP/base/"
      - name: Chave de assinatura (repositório)
        run: |
          cp dropbox/smarted-tv-test.jks "$RUNNER_TEMP/smarted-tv-test.jks"
          test "$(stat -c%s "$RUNNER_TEMP/smarted-tv-test.jks")" = "2730"
          echo "Chave do repositório usada (2730 bytes)."
      - name: Preparar ferramentas de reempacotamento
        run: ./tools/kodi/setup.sh
      - name: Montar candidato sem assinatura (versão + skin.novatv + ponte)
        run: |
          export PYTHONPATH="$HOME/.cache/kode-build/python:$PYTHONPATH"
          python3 tools/kodi/build-release-apk.py --from-version 1.0.22 --to-version 1.0.38 --to-code 2103024 "$RUNNER_TEMP/base/SMARTED-TV-v1.0.22-arm64.apk" "$RUNNER_TEMP/unsigned.apk"
          ls -lh "$RUNNER_TEMP/unsigned.apk"

      - name: Verificar integridade de boot (simulação do launcher dex)
        run: |
          python3 tools/kodi/verify-boot-integrity.py "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/base/SMARTED-TV-v1.0.22-arm64.apk"
      - name: Alinhar e assinar (mesma chave da linha 1.0.15+)
        run: |
          set -e
          CACHE="$HOME/.cache/kode-build"
          JAVA="$CACHE/python/jdk4py/java-runtime/bin/java"
          SIGNER="$CACHE/tools/apksigner.jar"
          python3 tools/kodi/align-apk.py "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          "$JAVA" -jar "$SIGNER" sign --ks "$RUNNER_TEMP/smarted-tv-test.jks" --ks-pass pass:android --key-pass pass:android --ks-key-alias smarted-tv-test --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
          "$JAVA" -jar "$SIGNER" verify --verbose --print-certs "$RUNNER_TEMP/signed.apk" | tee "$RUNNER_TEMP/verify.txt"
          grep -qi "^Signer #1 certificate SHA-256 digest: 855de171e5560d517db1a69f6aa55562b72c8b66f9cc29dfd55be0a8aa00951a$" "$RUNNER_TEMP/verify.txt"
      - name: Verificar identidade, tamanho e conteúdo
        env:
          PYTHONPATH: /home/runner/.cache/kode-build/python
        run: |
          python3 - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          from pyaxmlparser import APK
          base = Path(os.environ["RUNNER_TEMP"]) / "base/SMARTED-TV-v1.0.22-arm64.apk"
          out = Path(os.environ["RUNNER_TEMP"]) / "signed.apk"
          a = APK(str(out))
          assert (a.package, a.get_app_name(), a.version_name, str(a.version_code)) == ('org.xbmc.kodi', 'SMARTED-TV', '1.0.38', str(int(a.version_code))), (a.package, a.get_app_name(), a.version_name, a.version_code)
          assert int(a.version_code) == 2103024, f"versionCode inesperado: {a.version_code}"
          print(f"Identidade: {a.package} {a.get_app_name()} {a.version_name} ({a.version_code})")
          with zipfile.ZipFile(base) as before, zipfile.ZipFile(out) as after:
              assert after.testzip() is None
              oldlibs = {n for n in before.namelist() if n.startswith('lib/') and n.endswith('.so')}
              newlibs = {n for n in after.namelist() if n.startswith('lib/') and n.endswith('.so')}
              assert oldlibs == newlibs and oldlibs, "Bibliotecas alteradas"
              def digest(z, n):
                  h = hashlib.sha256()
                  with z.open(n) as f:
                      for c in iter(lambda: f.read(1024*1024), b''):
                          h.update(c)
                  return h.digest()
              for n in sorted(oldlibs | {'classes.dex'}):
                  assert digest(before, n) == digest(after, n), f"Código alterado: {n}"
              print(f"Motor preservado: {len(oldlibs)} bibliotecas + classes.dex idênticos")
              # Skin.novatv no APK deve ser a skin do repositório (SMARTEDTV)
              # com addon.xml reajustado para id=skin.novatv.
              import xml.etree.ElementTree as ET
              SKIN_ID = "skin.novatv"
              SKIN_NAME = "SMARTEDTV"
              import re as _re
              SKIN_VERSION = _re.search(r'SKIN_VERSION\s*=\s*"([^"]+)"',
                                       Path('tools/kodi/build-release-apk.py').read_text(encoding='utf-8')).group(1)
              for p in sorted(Path('kodi/skin.estilo.personalizado').rglob('*')):
                  if not p.is_file() or '__pycache__' in p.parts or p.suffix == '.pyc':
                      continue
                  rel = p.relative_to('kodi/skin.estilo.personalizado').as_posix()
                  arc = f'assets/addons/{SKIN_ID}/{rel}'
                  assert arc in after.namelist(), f"entry ausente: {arc}"
                  data = p.read_bytes()
                  if rel == 'addon.xml':
                      root = ET.fromstring(after.read(arc))
                      assert root.get('id') == SKIN_ID and root.get('name') == SKIN_NAME and root.get('version') == SKIN_VERSION, f"addon.xml skin inesperado: {root.get('id')} {root.get('name')} {root.get('version')}"
                      root2 = ET.fromstring(data)
                      assert root2.get('id') == 'skin.estilo.personalizado'
                      continue
                  assert after.read(arc) == data, f"Divergência: {arc}"
              # Nenhum arquivo base de skin.novatv deve sobrar sem payload do repositório.
              stale = [n for n in after.namelist()
                       if n.startswith(f'assets/addons/{SKIN_ID}/') and n.endswith('addon.xml') is False
                       and n not in {f'assets/addons/{SKIN_ID}/' + p.relative_to('kodi/skin.estilo.personalizado').as_posix()
                                     for p in Path('kodi/skin.estilo.personalizado').rglob('*') if p.is_file()}]
              assert not stale, f"Entradas velhas de skin.novatv sem payload: {stale[:5]}"
              # Addons do repositório (ponte + bootstrap) devem ir byte a byte.
              bridges = [d for d in sorted(Path('kodi/addons').iterdir()) if d.is_dir()]
              assert {d.name for d in bridges} >= {'plugin.video.smarted', 'service.smarted.bootstrap'}, \
                  f"addons do repositório ausentes: {[d.name for d in bridges]}"
              for addon_dir in bridges:
                  for p in sorted(addon_dir.rglob('*')):
                      if not p.is_file() or '__pycache__' in p.parts or p.suffix == '.pyc':
                          continue
                      arc = f'assets/addons/{addon_dir.name}/' + p.relative_to(addon_dir).as_posix()
                      assert arc in after.namelist(), f"entry ausente: {arc}"
                      assert after.read(arc) == p.read_bytes(), f"Divergência addon: {arc}"
              manifest = after.read('assets/system/addon-manifest.xml').decode()
              for addon_id in [SKIN_ID] + [d.name for d in bridges]:
                  assert f'>{addon_id}<' in manifest, f'addon ausente do manifesto: {addon_id}'
              print("Skin.novatv (SMARTEDTV) + addons do repositório no APK idênticos à origem; skin.novatv base totalmente substituída.")
          print(f"Tamanho base: {base.stat().st_size} -> final: {out.stat().st_size}")
          print(f"SHA-256 final: {hashlib.sha256(out.read_bytes()).hexdigest()}")
          PY
          ls -lh "$RUNNER_TEMP/signed.apk"
      - name: Publicar release final
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP/signed.apk" "SMARTED-TV-v1.0.38-arm64.apk"
          sha256sum "SMARTED-TV-v1.0.38-arm64.apk" | tee "$RUNNER_TEMP/sha.txt"
          TAG=v1.0.38-smarted-arm64
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "SMARTED-TV-v1.0.38-arm64.apk" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
            echo "Release $TAG atualizada com o APK assinado."
          else
          gh release create v1.0.38-smarted-arm64 "SMARTED-TV-v1.0.38-arm64.apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'SMARTED-TV 1.0.38 ARM64' --notes 'SMARTED-TV 1.0.38 (ARM64, Kodi 21.3, org.xbmc.kodi). Rodada 12: correcao de raiz na navegacao. (1) A janela de diretorios (MyVideoNav) tinha um <content> vazio herdado de include, o que deixava a tela sem itens - por isso addons de video, YouTube e pastas apareciam vazios ou so com o titulo. O content foi removido, o foco agora vai para a lista de itens e a janela de Programas passou a focar a lista (antes focava uma view invisivel). Todo item e entregue ao Kodi como veio do addon (pasta, video, programa), sem forcar reproducao. (2) A barra superior deixou de ter categorias embutidas na skin: a rota sync-nav descobre o menu raiz REAL do Brazuca Play por Files.GetDirectory (mode 0), publica nome e URL de cada pasta em Skin.String e o botao executa ActivateWindow(Videos,<url real>), com fallback para os favoritos e depois para as pastas conhecidas. (3) Espacamento entre as opcoes do meio da tela (abaixo do HERO) passou de 14 para 38 px, mantendo fonte, cores e textura; a barra de pastas do topo ficou como estava. (4) O HERO usa ate 8 lancamentos reais e alterna automaticamente a cada ~8 s, pausando quando ha foco nos controles do HERO ou midia tocando, com fade de 700 ms na arte. Assistir/Informacoes continuam sobre o filme em destaque. Resto do aplicativo intacto: mesmos icones, busca, ajustes, favoritos do Kodi, reproducao e demais telas.'
          fi
          echo "::notice::Release publicada: https://github.com/$GITHUB_REPOSITORY/releases/download/v1.0.38-smarted-arm64/SMARTED-TV-v1.0.38-arm64.apk"
# Os blocos do APK base ficam em .github/private-apk-chunks.json; a assinatura usa dropbox/smarted-tv-test.jks.
