name: Conferir APK classico publicado (1.0.62 vs 1.0.61)

# Diagnostico sob demanda: baixa as duas releases e confere o APK publicado de
# verdade (nao o que estava no diretorio de build). Mostra sha256, o que mudou
# no ZIP e se as otimizacoes de playback realmente entraram. Nao publica nada.

on:
  workflow_dispatch:
  push:
    branches: [arena/7dedf371-kode]
    paths: [.github/workflows/verificar-classica.yml]

permissions:
  contents: write

jobs:
  conferir:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Baixar as duas releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apks"
          gh release download v1.0.62-classica -R "$GITHUB_REPOSITORY" \
            --pattern 'SMARTED-TV-v1.0.62-arm64.apk' --dir "$RUNNER_TEMP/apks"
          gh release download v1.0.61-classica -R "$GITHUB_REPOSITORY" \
            --pattern 'SMARTED-TV-v1.0.61-arm64.apk' --dir "$RUNNER_TEMP/apks"
          gh release download v1.0.62-classica -R "$GITHUB_REPOSITORY" \
            --pattern 'SMARTEDTV-Anuncios-*.apk' --dir "$RUNNER_TEMP/apks"
          ls -l "$RUNNER_TEMP/apks"
          sha256sum "$RUNNER_TEMP/apks/"*.apk | tee "$RUNNER_TEMP/sha.txt"

      - name: Comparar conteudo
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/comparacao.txt") 2>&1
          python3 -m pip install --quiet 'pyaxmlparser==0.3.31'
          python3 - "$RUNNER_TEMP/apks" "$RUNNER_TEMP/sha.txt" <<'PY'
          import hashlib, re, sys, zipfile
          from pathlib import Path
          from pyaxmlparser import APK

          pasta = Path(sys.argv[1])
          sha_txt = Path(sys.argv[2]).read_text()
          novo = pasta / 'SMARTED-TV-v1.0.62-arm64.apk'
          velho = pasta / 'SMARTED-TV-v1.0.61-arm64.apk'

          def resumo(apk):
              a = APK(str(apk))
              with zipfile.ZipFile(apk) as z:
                  infos = {i.filename: i.file_size for i in z.infolist() if not i.is_dir()}
              return a, infos

          a_novo, i_novo = resumo(novo)
          a_velho, i_velho = resumo(velho)
          print('1.0.62: %d bytes | %s %s | %s' % (novo.stat().st_size, a_novo.version_name,
                                                   a_novo.version_code, a_novo.get_app_name()))
          print('1.0.61: %d bytes | %s %s | %s' % (velho.stat().st_size, a_velho.version_name,
                                                   a_velho.version_code, a_velho.get_app_name()))
          print('pacote do APK do Kodi:', a_novo.package)
          for linha in sha_txt.splitlines():
              if linha.endswith('.apk'):
                  print('sha256 publicado:', linha)

          so_novo = sorted(set(i_novo) - set(i_velho))
          so_velho = sorted(set(i_velho) - set(i_novo))
          mudados = sorted(n for n in set(i_novo) & set(i_velho) if i_novo[n] != i_velho[n])
          print('')
          print('entradas novas (%d): %s' % (len(so_novo), so_novo[:10]))
          print('entradas removidas (%d): %s' % (len(so_velho), so_velho[:10]))
          print('entradas com tamanho diferente (%d):' % len(mudados))
          for n in mudados[:20]:
              print('   %-70s %d -> %d' % (n, i_velho[n], i_novo[n]))

          # --- otimizacoes de playback dentro do APK publicado ---------------
          with zipfile.ZipFile(novo) as z:
              perf = z.read('assets/addons/service.smarted.bootstrap/performance.py').decode()
              serv = z.read('assets/addons/service.smarted.bootstrap/service.py').decode()
              boot = z.read('assets/addons/service.smarted.bootstrap/addon.xml').decode()
              home = z.read('assets/addons/skin.novatv/xml/Home.xml').decode()
              nav = z.read('assets/addons/skin.novatv/xml/MyVideoNav.xml').decode()
              addon = z.read('assets/addons/skin.novatv/addon.xml').decode()

          print('')
          # o addon.xml comeca com <?xml version="1.1"?>: ancora no <addon>
          # o addon.xml comeca com <?xml version="1.1"?>: ancora no elemento <addon>
          def versao_addon(xml):
              return re.search(r'<addon [^>]*version="([^"]+)"', xml).group(1)
          print('bootstrap versao:', versao_addon(boot))
          checagens = [
              ('advancedsettings buffermode 1', '<buffermode>1</buffermode>' in perf),
              ('advancedsettings memorysize 50 MB', '<memorysize>52428800</memorysize>' in perf),
              ('advancedsettings readfactor 20x', '<readfactor>20.0</readfactor>' in perf),
              ('marker v2 do advancedsettings', 'smartedtv-performance-v2' in perf),
              ('setting memorysize 48 MB', "'filecache.memorysize': 48" in perf),
              ('setting readfactor 2000 (20x)', "'filecache.readfactor': 2000" in perf),
              ('sem troca de modo de video', "'videoplayer.adjustrefreshrate': 0" in perf),
              ('nav-check em segundo plano', 'NAV_CHECK_DELAY' in serv),
              ('performance antes do nav-check',
               serv.index('apply_performance()') < serv.index('validar_navegacao_depois_do_boot(')),
          ]
          for nome, ok in checagens:
              print('%-36s %s' % (nome, 'OK' if ok else 'FALTANDO'))
          if not all(ok for _, ok in checagens):
              raise SystemExit('APK publicado sem as otimizacoes de playback')

          # --- ANUNCIOS: ponte no bootstrap embarcado -------------------------
          with zipfile.ZipFile(novo) as z:
              ads = z.read('assets/addons/service.smarted.bootstrap/smart_ads.py').decode()
          checagens_ads = [
              ('app de anuncios referenciado', 'org.smartedtv.ads' in ads),
              ('tela de abertura', 'AppOpenActivity' in ads),
              ('tela de video pre-roll', 'PreRollActivity' in ads),
              ('ponte StartAndroidActivity', "StartAndroidActivity(%s)' % ','.join(campos)" in ads),
              ('gancho xbmc.Player', 'MonitorPreRoll' in ads),
              ('abertura uma vez por instalacao', 'abertura_ja_mostrada' in ads),
              ('intervalo de pre-roll', 'PREROLL_INTERVALO' in ads),
              ('pacote smartedtv.full na ponte', "PACKAGE = 'smartedtv.full'" in ads),
              ('builtin com 9 parametros', "campos = [package or PACKAGE] + [''] * 7 + [atividade]" in ads),
              ('className no ultimo parametro', "StartAndroidActivity(%s)' % ','.join(campos)" in ads),
              ('logs com tag SmartAds', '[SmartAds]' in ads),
          ]
          print('')
          for nome, ok in checagens_ads:
              print('%-36s %s' % (nome, 'OK' if ok else 'FALTANDO'))
          if not all(ok for _, ok in checagens_ads):
              raise SystemExit('APK publicado sem os anuncios')

          anuncios_apk = sorted(pasta.glob('SMARTEDTV-Anuncios-*.apk'))
          if anuncios_apk:
              extra = APK(str(anuncios_apk[0]))
              print('APK de anuncios na release: %s (%d bytes, %s %s)' % (
                  anuncios_apk[0].name, anuncios_apk[0].stat().st_size,
                  extra.version_name, extra.version_code))
              print('pacote do APK de anuncios:', extra.package)
              if extra.package != 'smartedtv.full':
                  raise SystemExit('pacote do APK de anuncios inesperado: %s' % extra.package)
              with zipfile.ZipFile(anuncios_apk[0]) as z:
                  dex_ads = b''.join(z.read(n) for n in z.namelist()
                                     if n.startswith('classes') and n.endswith('.dex'))
              for unidade_teste in ('ca-app-pub-3940256099942544/9257395921',
                                    'ca-app-pub-3940256099942544/1033173712'):
                  print('bloco de teste no APK de anuncios:',
                        unidade_teste, 'OK' if unidade_teste.encode() in dex_ads else 'FALTANDO')
                  if unidade_teste.encode() not in dex_ads:
                      raise SystemExit('APK de anuncios sem o modo de teste')
              print('tag SmartAds no APK de anuncios:',
                    'OK' if b'SmartAds' in dex_ads else 'FALTANDO')
          else:
              raise SystemExit('APK de anuncios AUSENTE na release')

          # --- skin (nao pode ter regredido) ---------------------------------
          print('')
          print('skin.novatv versao:', versao_addon(addon))
          for cid, topo, alt in (('9201', '570', '194'), ('9203', '822', '194')):
              padrao = (r'<control type="list" id="%s"><left>60</left><top>(\d+)</top>'
                        r'<right>60</right><height>(\d+)</height>' % cid)
              m = re.search(padrao, home)
              print('%s: top=%s height=%s (esperado %s/%s)' % (cid, m.group(1) if m else '?',
                                                              m.group(2) if m else '?', topo, alt))
          print('9202 presente:', '<control type="list" id="9202">' in home)
          print('painel escuro CC121212 na lista:', 'CC121212" border="16">pb_rounded.png' in nav)
          print('foco escuro FF1E1E1E na lista:', 'FF1E1E1E" border="16">pb_rounded.png' in nav)
          PY

      - name: Diagnostico quando a conferencia falhar
        if: failure()
        run: |
          set -uo pipefail
          mkdir -p docs
          {
            echo "# Log da conferencia que falhou"
            echo
            echo '```'
            tail -n 80 "$RUNNER_TEMP/comparacao.txt" 2>/dev/null || echo '(sem log)'
            echo '```'
          } > docs/build-log-conferencia.txt
          git config user.name "smarted-bot"
          git config user.email "smarted-bot@users.noreply.github.com"
          git add docs/build-log-conferencia.txt
          git commit -m "ci: log da conferencia que falhou" || true
          git push origin HEAD:arena/7dedf371-kode || true

      - name: Guardar comparacao no repositorio
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/comparacao.txt" docs/comparacao-1.0.62.txt
          git config user.name "SMARTEDTV Build"
          git config user.email "ci@smarted.local"
          git add docs/comparacao-1.0.62.txt
          git commit -m "docs: conferencia do APK 1.0.62 publicado (ponte corrigida + modo de teste)" || echo "sem mudancas"
          git push origin HEAD:${GITHUB_REF_NAME}
