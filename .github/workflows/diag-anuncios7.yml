name: Diagnostico 7 dos anuncios (dexdump das classes)

on:
  push:
    branches: [arena/5c219515-kode]
    paths: [.github/workflows/diag-anuncios7.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Baixar base v22
        run: |
          set -euo pipefail
          mkdir -p build/diag
          gh release download v1.0.87-universal-v22 -R "$GITHUB_REPOSITORY" \
            --pattern SMARTEDTV-universal.apk --dir build/diag --clobber
          mv build/diag/SMARTEDTV-universal.apk build/diag/base.apk
          cd build/diag
          unzip -o -q base.apk 'classes*.dex'
          ls -l classes*.dex
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          echo "TOOLS=$TOOLS" >> "$GITHUB_ENV"
      - name: dexdump das classes de anuncio
        run: |
          set +e
          cd build/diag
          for dex in classes*.dex; do
            "$TOOLS/dexdump" -d "$dex" > "dump-$dex.txt" 2>/dev/null
          done
          ls -l dump-*.txt | head
          python3 - <<'PY'
          import glob, re
          alvos = ('PreRollActivity', 'AppOpenActivity', 'AdTela', 'SmartAds')
          blocos = {}
          for caminho in glob.glob('dump-*.txt'):
              classe = None
              with open(caminho, errors='replace') as f:
                  for linha in f:
                      m = re.search(r"Class descriptor\s*:\s*'(L[^']+)'", linha)
                      if m:
                          classe = m.group(1)
                          continue
                      if classe and any(a in classe for a in alvos):
                          blocos.setdefault(classe.split('/')[-1].rstrip(';'), []).append(linha.rstrip())
          print('::notice::CLASSES ENCONTRADAS => ' + ', '.join(sorted(blocos)))
          for nome, linhas in blocos.items():
              texto = '\n'.join(linhas)
              strings = re.findall(r'\|[0-9a-f]{4}: const-string(?:/jumbo)? v\d+, "(.*?)"', texto)
              strings = [s for s in strings if s]
              metodos = re.findall(r'name\s*:\s*\'([^\']+)\'', texto)
              print('::notice::%s STRINGS => %s' % (nome, ' | '.join(dict.fromkeys(strings))[:900]))
              # extras/parametros do intent
              extras = [s for s in dict.fromkeys(strings) if re.search(r'unidade|unit|tipo|extra|ads|vip|premio|reward|banner', s, re.I)]
              print('::notice::%s RELEVANTES => %s' % (nome, ' | '.join(extras)[:900]))
              invokes = re.findall(r'invoke-[a-z/-]+ \{[^}]*\}, (L[^;]+;\.[^(]+)', texto)
              ads = [i for i in dict.fromkeys(invokes) if 'ads' in i.lower() or 'Ad' in i]
              print('::notice::%s CHAMADAS ADS => %s' % (nome, ' | '.join(ads)[:900]))
              print('::notice::%s METODOS => %d' % (nome, len(set(metodos))))
          PY
      - name: Guardar dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dump-ads-${{ github.run_id }}
          path: build/diag/dump-*.txt
          if-no-files-found: warn
