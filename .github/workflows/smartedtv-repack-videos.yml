name: SMARTEDTV repackage video screen

on:
  push:
    branches: [arena/28b146c9-kode]

permissions:
  contents: write

jobs:
  repackage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 1. Download base APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base"
          gh release download v1.0.83-tela-inicial-v9 -R "$GITHUB_REPOSITORY" \
            --pattern "SMARTEDTV-atual-com-tela-inicial-v9.apk" --dir "$RUNNER_TEMP/base"
          APK_FILE=$(find "$RUNNER_TEMP/base" -name '*.apk' | head -1)
          echo "APK base: $APK_FILE"
          echo "BASE_APK_PATH=$APK_FILE" >> "$GITHUB_ENV"

      - name: 2. Inject video screen changes
        run: |
          set -euo pipefail
          python3 tools/kodi/injetar-videos.py \
            --apk "$BASE_APK_PATH" \
            --saida "$RUNNER_TEMP/bruto.apk"
          ls -lh "$RUNNER_TEMP/bruto.apk"

      - name: 3. Copy bruto to alinhado (skip align)
        run: |
          cp "$RUNNER_TEMP/bruto.apk" "$RUNNER_TEMP/alinhado.apk"
          ls -lh "$RUNNER_TEMP/alinhado.apk"

      - name: 4. Instalar Android SDK build-tools (apksigner, zipalign)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" || true
          if [ -f tools.zip ]; then
            unzip -q tools.zip -d latest || true
            mv latest/cmdline-tools latest/cmdline-tools-bin 2>/dev/null || true
            mv latest/cmdline-tools-bin latest/cmdline-tools 2>/dev/null || true
          fi
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "build-tools;33.0.1" >/dev/null 2>&1 || true
          which apksigner || echo "apksigner nao encontrado via sdkmanager"
          which zipalign || echo "zipalign nao encontrado via sdkmanager"
          ls "$ANDROID_SDK_ROOT/build-tools/" 2>/dev/null || true
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: 5. Sign APK
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | head -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner nao encontrado"
            exit 1
          fi
          "$APKSIGNER" sign \
            --ks dropbox/smarted-tv-test.jks \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias smarted-tv-test \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$RUNNER_TEMP/assinado.apk" "$RUNNER_TEMP/alinhado.apk"
          ls -lh "$RUNNER_TEMP/assinado.apk"

      - name: 6. Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/assinado.apk" "SMARTEDTV-21.4.1-arm64-v8a.apk"
          sha256sum "SMARTEDTV-21.4.1-arm64-v8a.apk" > "SMARTEDTV-21.4.1-arm64-v8a.apk.sha256"
          TAG_SAIDA="smartedtv-videos-21.4.1-arm64"
          if gh release view "$TAG_SAIDA" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_SAIDA" "SMARTEDTV-21.4.1-arm64-v8a.apk" "SMARTEDTV-21.4.1-arm64-v8a.apk.sha256" -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG_SAIDA" \
              "SMARTEDTV-21.4.1-arm64-v8a.apk" \
              "SMARTEDTV-21.4.1-arm64-v8a.apk.sha256" \
              -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "SMARTEDTV 21.4.1 (arm64-v8a) - Video Screen"
          fi

      - name: 7. Save artifact
        run: |
          ls -lh SMARTEDTV-21.4.1-arm64-v8a.apk SMARTEDTV-21.4.1-arm64-v8a.apk.sha256
