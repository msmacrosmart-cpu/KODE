name: SMARTEDTV repackage video screen

on:
  push:
    branches: [arena/28b146c9-kode]

permissions:
  contents: write

jobs:
  repackage:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Executar reempacotamento da tela VIDEOS
        run: |
          bash tools/kodi/build-repackage-video.sh
