name: SMARTEDTV repackage video screen

on:
  push:
    branches: [arena/28b146c9-kode]

permissions:
  contents: write

jobs:
  repackage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 1. Download base APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base"
          gh release download v1.0.83-tela-inicial-v9 -R "$GITHUB_REPOSITORY" \
            --pattern "SMARTEDTV-atual-com-tela-inicial-v9.apk" --dir "$RUNNER_TEMP/base"
          APK_FILE=$(find "$RUNNER_TEMP/base" -name '*.apk' | head -1)
          echo "APK base: $APK_FILE"
          echo "BASE_APK_PATH=$APK_FILE" >> "$GITHUB_ENV"

      - name: 2. Inject video screen changes
        run: |
          set -euo pipefail
          python3 tools/kodi/injetar-videos.py \
            --apk "$BASE_APK_PATH" \
            --saida "$RUNNER_TEMP/bruto.apk"
          ls -lh "$RUNNER_TEMP/bruto.apk"
