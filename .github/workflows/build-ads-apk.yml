name: "Build SMARTEDTV Ads (AdMob nativo)"

# Compila o app de anuncios (smartedtv.full) que o Kodi abre por
# StartAndroidActivity(): App Open + video pre-roll, sempre em landscape.
#
# A partir da 1.0.4 ele tambem e o INSTALADOR leve: ao abrir pelo icone,
# verifica se o app principal (org.xbmc.kodi) esta instalado e, se nao estiver,
# baixa o APK indicado em android/smarted-ads/apk-url.txt e abre a instalacao.
# O APK sai assinado com a MESMA chave da linha SMARTED-TV (sem isso o Android
# nao aceitaria atualizar o app de anuncios depois).

on:
  workflow_dispatch:
  push:
    branches: [arena/7dedf371-kode]
    paths:
      - '.github/workflows/build-ads-apk.yml'
      - 'android/smarted-ads/**'

permissions:
  contents: write

env:
  VERSAO_ADS: "1.0.4"
  CODIGO_ADS: "5"
  ARQUIVO_ADS: SMARTEDTV-Anuncios-1.0.4.apk
  TAG_ADS: v1.0.4-ads
  # MODO DE TESTE do AdMob (blocos de teste do Google = sempre preenchem).
  # Trocar para "false" quando a homologacao terminar.
  ADS_TESTE: "true"
  CERT_SHA256: 855de171e5560d517db1a69f6aa55562b72c8b66f9cc29dfd55be0a8aa00951a

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 0. Pacote do app (android/smarted-ads/app-id.txt)
        run: |
          set -euo pipefail
          PACOTE="$(cat android/smarted-ads/app-id.txt | tr -d '[:space:]')"
          echo "ADS_APP_ID=$PACOTE" >> "$GITHUB_ENV"
          echo "::notice::applicationId do app de anuncios: $PACOTE"
          if [ "$PACOTE" = "org.xbmc.kodi" ]; then
            echo "::error::org.xbmc.kodi e o pacote do Kodi: o Android nao aceita dois apps com o mesmo pacote"
            exit 1
          fi

      - name: 0b. APK principal a distribuir (android/smarted-ads/apk-url.txt)
        run: |
          set -euo pipefail
          ARQ=android/smarted-ads/apk-url.txt
          URL="$(grep -E '^url=' "$ARQ" | head -1 | cut -d= -f2- | tr -d '[:space:]')"
          CODIGO="$(grep -E '^codigo=' "$ARQ" | head -1 | cut -d= -f2- | tr -d '[:space:]')"
          echo "APK_URL=$URL" >> "$GITHUB_ENV"
          echo "APK_CODIGO=$CODIGO" >> "$GITHUB_ENV"
          echo "::notice::APK principal: $URL (versionCode minimo $CODIGO)"
          case "$URL" in
            https://*.apk) ;;
            *) echo "::error::apk-url.txt precisa de um link https de .apk (achei '$URL')"; exit 1 ;;
          esac
          if [ -z "$CODIGO" ] || [ "$CODIGO" -le 0 ] 2>/dev/null; then
            echo "::error::apk-url.txt precisa de codigo= (versionCode minimo)"; exit 1
          fi
          # a release do APK tem que existir (senao o instalador baixa 404)
          RESTO="${URL#*/releases/download/}"
          TAG_KODI="${RESTO%%/*}"
          ARQUIVO_KODI="$(basename "$URL")"
          echo "::notice::confiro o anexo $ARQUIVO_KODI na release $TAG_KODI"
          GH_TOKEN="$GITHUB_TOKEN" gh release view "$TAG_KODI" --json assets \
            -q '.assets[].name' | grep -qx "$ARQUIVO_KODI" \
            || { echo "::error::$TAG_KODI nao tem o anexo $ARQUIVO_KODI"; exit 1; }
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: 1. Java 17 + Android SDK + Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 2. Android SDK (platform 34 + build-tools)
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" "platform-tools" | tail -3

      - name: 3. Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 4. Conferir os IDs do AdMob no codigo
        run: gradle -p android/smarted-ads :app:checkAdMob -PadmobCheck --no-daemon --console=plain

      - name: 4b. Conferir a logica do instalador (fontes)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          base = Path('android/smarted-ads/app/src/main/java/org/smartedtv/ads')
          codigo = {n: (base / (n + '.java')).read_text() for n in
                    ('BoasVindasActivity', 'Instalador', 'Kodi', 'LauncherActivity')}
          manifesto = Path('android/smarted-ads/app/src/main/AndroidManifest.xml').read_text()
          obrigatorio = [
              ('instalador usa DownloadManager', 'DownloadManager' in codigo['Instalador']),
              ('destino na pasta privada do app',
               'setDestinationInExternalFilesDir' in codigo['Instalador']),
              ('instala por content:// (FileProvider)',
               'FileProvider.getUriForFile' in codigo['Instalador']),
              ('tipo APK no intent',
               'application/vnd.android.package-archive' in codigo['Instalador']),
              ('libera leitura do URI',
               'FLAG_GRANT_READ_URI_PERMISSION' in codigo['Instalador']),
              ('checa permissao de instalar', 'canRequestPackageInstalls' in codigo['Instalador']),
              ('checa o pacote do Kodi', 'PACOTE = "org.xbmc.kodi"' in codigo['Kodi']),
              ('abertura automatica do download', 'baixarSozinho' in codigo['BoasVindasActivity']),
              ('barra de progresso', 'ProgressBar' in codigo['BoasVindasActivity']),
              ('so o data da ponte vai para anuncio',
               'startsWith(URI_ADS)' in codigo['LauncherActivity']),
              ('icone do app cai no instalador',
               'BoasVindasActivity.class' in codigo['LauncherActivity']),
              ('REQUEST_INSTALL_PACKAGES no manifesto',
               'REQUEST_INSTALL_PACKAGES' in manifesto),
              ('FileProvider declarado', 'androidx.core.content.FileProvider' in manifesto),
              ('path do FileProvider', '@xml/file_paths' in manifesto),
              ('visibilidade do pacote do Kodi', 'android:name="org.xbmc.kodi"' in manifesto),
          ]
          for nome, ok in obrigatorio:
              print('%-40s %s' % (nome, 'OK' if ok else 'FALTANDO'))
          if not all(ok for _, ok in obrigatorio):
              raise SystemExit('instalador incompleto')
          PY

      - name: 5. Compilar o APK (release, sem assinatura)
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/gradle.log") 2>&1
          gradle -p android/smarted-ads assembleRelease --no-daemon --console=plain \
            -PadsVersionName="$VERSAO_ADS" -PadsVersionCode="$CODIGO_ADS" \
            -PadsAppId="$ADS_APP_ID" -PadsTeste="$ADS_TESTE" \
            -PapkUrl="$APK_URL" -PapkCodigo="$APK_CODIGO"
          mkdir -p "$RUNNER_TEMP/ads"
          cp android/smarted-ads/app/build/outputs/apk/release/app-release-unsigned.apk \
             "$RUNNER_TEMP/ads/unsigned.apk"
          ls -l "$RUNNER_TEMP/ads"

      - name: 6. Alinhar e assinar com a chave da linha
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME}"
          BT="$SDK/build-tools/34.0.0"
          cp dropbox/smarted-tv-test.jks "$RUNNER_TEMP/ads/smarted-tv-test.jks"
          test "$(stat -c%s "$RUNNER_TEMP/ads/smarted-tv-test.jks")" = "2730"
          "$BT/zipalign" -p -f 4 "$RUNNER_TEMP/ads/unsigned.apk" "$RUNNER_TEMP/ads/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/ads/smarted-tv-test.jks" --ks-pass pass:android \
            --key-pass pass:android --ks-key-alias smarted-tv-test \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$RUNNER_TEMP/ads/$ARQUIVO_ADS" "$RUNNER_TEMP/ads/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/ads/$ARQUIVO_ADS" \
            | tee "$RUNNER_TEMP/ads/verify.txt"
          grep -qi "^Signer #1 certificate SHA-256 digest: $CERT_SHA256$" \
            "$RUNNER_TEMP/ads/verify.txt" || (echo "certificado inesperado"; exit 1)

      - name: 7. Conferir o APK final (AdMob, landscape, SDK)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/ads/check.log") 2>&1
          python3 -m pip install --quiet 'pyaxmlparser==0.3.31'
          python3 - "$RUNNER_TEMP/ads/$ARQUIVO_ADS" <<'PY'
          import os, sys, zipfile
          from pyaxmlparser import APK

          apk_path = sys.argv[1]
          apk = APK(apk_path)
          print('pacote:', apk.package)
          print('versao:', apk.version_name, apk.version_code)
          esperado = os.environ['ADS_APP_ID']
          print('pacote esperado:', esperado)
          assert apk.package == esperado, 'pacote %r != %r' % (apk.package, esperado)

          with zipfile.ZipFile(apk_path) as z:
              nomes = z.namelist()
              manifesto = z.read('AndroidManifest.xml')
              dex = b''.join(z.read(n) for n in nomes if n.startswith('classes') and n.endswith('.dex'))

          def contem(blob, texto):
              # o string pool do AXML alterna UTF-8 e UTF-16 conforme o build
              return (texto.encode('utf-8') in blob) or (texto.encode('utf-16-le') in blob)

          app_id = 'ca-app-pub-2066014755407744~5076693043'
          assert contem(manifesto, app_id), 'APPLICATION_ID do AdMob fora do manifesto'
          print('APPLICATION_ID no manifesto: OK', app_id)

          for unidade in ('ca-app-pub-2066014755407744/4214378379',
                          'ca-app-pub-2066014755407744/3572039686'):
              assert contem(dex, unidade), 'bloco %s nao esta no dex' % unidade
              print('bloco no dex:', unidade, 'OK')

          for activity in ('AppOpenActivity', 'PreRollActivity', 'LauncherActivity'):
              assert contem(manifesto, activity), '%s fora do manifesto' % activity
              print('activity no manifesto:', activity, 'OK')
          # screenOrientation e atributo de ENUM do AXML (vale o inteiro 6 =
          # sensorLandscape, nao o texto). Quem le o APK compilado e o aapt2.
          import os, re, subprocess
          aapt2 = os.path.join(os.environ['ANDROID_HOME'], 'build-tools', '34.0.0', 'aapt2')
          arvore = subprocess.run(
              [aapt2, 'dump', 'xmltree', '--file', 'AndroidManifest.xml', apk_path],
              capture_output=True, text=True, check=True).stdout
          valores = []
          linhas_orient = 0
          for linha in arvore.splitlines():
              if 'screenOrientation' not in linha:
                  continue
              linhas_orient += 1
              if 'sensorLandscape' in linha:      # aapt2 as vezes imprime o nome
                  valores.append(6)
                  continue
              print('   orientation:', linha.strip()[:120])
              pedaco = linha.rsplit('=', 1)[-1].strip()   # '=0x6', '=6' ou o nome
              if pedaco.lower().startswith('0x'):
                  valores.append(int(pedaco, 16))
              elif pedaco.isdigit():
                  valores.append(int(pedaco))
          print('screenOrientation no APK:', valores,
                '(linhas: %d)' % linhas_orient)
          if len(valores) < 3:
              print('--- trecho do manifesto compilado ---')
              print(arvore[:4000])
              raise SystemExit('esperava screenOrientation nas 3 activities; achei %r' % valores)
          for valor in valores:
              if valor != 6:   # ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                  raise SystemExit('orientacao diferente de sensorLandscape (6): %r' % valor)
          print('sensorLandscape (enum 6) nas %d activities: OK' % len(valores))

          # e o APPLICATION_ID tem que estar no <application> compilado
          if app_id not in arvore:
              raise SystemExit('APPLICATION_ID nao aparece no manifesto via aapt2')
          print('APPLICATION_ID via aapt2: OK')

          # modo de teste + logs de diagnostico tem que estar no APK
          teste = os.environ.get('ADS_TESTE', 'true') == 'true'
          if teste:
              for unidade_teste in ('ca-app-pub-3940256099942544/9257395921',
                                    'ca-app-pub-3940256099942544/1033173712'):
                  assert unidade_teste.encode() in dex, \
                      'bloco de TESTE %s nao esta no dex' % unidade_teste
              print('modo de TESTE ligado: blocos do Google no dex OK')
          assert b'SmartAds' in dex, 'tag de log SmartAds ausente no dex'
          print('tag de log SmartAds: OK')

          # --- INSTALADOR (launcher leve que baixa o APK principal) ----------
          url_apk = os.environ['APK_URL']
          assert contem(dex, url_apk), 'link do APK principal fora do dex'
          print('link do APK principal no dex:', url_apk)
          assert contem(manifesto, 'REQUEST_INSTALL_PACKAGES'), \
              'sem permissao REQUEST_INSTALL_PACKAGES'
          assert contem(manifesto, 'androidx.core.content.FileProvider'), 'sem FileProvider'
          assert contem(manifesto, 'BoasVindasActivity'), 'sem a tela de boas-vindas'
          print('manifesto do instalador: OK (permissao + FileProvider + BoasVindas)')
          for pedaco in ('DownloadManager', 'SMARTED-TV.apk'):
              assert contem(dex, pedaco), '%s fora do dex' % pedaco
          print('logica de download no dex: OK')
          tamanho_mb = os.path.getsize(apk_path) / 1048576.0
          print('tamanho do APK de anuncios: %.1f MB' % tamanho_mb)
          assert tamanho_mb < 10, 'o app de anuncios passou de 10 MB (%.1f MB)' % tamanho_mb

          # o SDK do AdMob tem que ter entrado de verdade
          assert any(n.startswith('classes') for n in nomes), 'sem dex'
          print('classes.dex: %d bytes' % len(dex))
          print('entradas no APK:', len(nomes))
          PY

      - name: 8. Guardar o APK como artefato (opcional)
        # o que importa e a release (passo 9); o artefato e so conveniencia
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: smartedtv-anuncios
          path: ${{ runner.temp }}/ads/*.apk
          if-no-files-found: error

      - name: 9. Publicar/atualizar a release dos anuncios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum "$RUNNER_TEMP/ads/$ARQUIVO_ADS" \
            | sed "s#$RUNNER_TEMP/ads/##" > "$RUNNER_TEMP/ads/SMARTEDTV-Anuncios.sha256"
          NOTAS="$RUNNER_TEMP/ads/notas.md"
          {
            echo "# SMARTEDTV Anuncios $VERSAO_ADS (AdMob nativo)"
            echo
            echo "App Android leve que (1) exibe os anuncios do AdMob em cima do Kodi"
            echo "SMARTEDTV e (2) e o INSTALADOR do app principal."
            echo
            echo "## Instalacao"
            echo
            echo "1. Instale **SMARTEDTV-Anuncios-$VERSAO_ADS.apk** (e o primeiro app)."
            echo "2. Abra o icone: se o SMARTEDTV ainda nao estiver no aparelho, ele baixa"
            echo "   o APK principal e abre a tela de instalacao do Android."
            echo "3. Autorize 'instalar apps desconhecidos' quando o Android pedir."
            echo
            echo "APK principal configurado: \`$APK_URL\` (versionCode minimo \`$APK_CODIGO\`)."
            echo
            echo "## Anuncios"
            echo
            echo "| Tela | Bloco AdMob | Quando aparece |"
            echo "|---|---|---|"
            echo "| Abertura | \`ca-app-pub-2066014755407744/4214378379\` | uma vez, logo depois da Home carregar |"
            echo "| Video pre-roll | \`ca-app-pub-2066014755407744/3572039686\` | ao dar play em canal, filme ou serie |"
            echo
            echo "APPLICATION_ID: \`ca-app-pub-2066014755407744~5076693043\`"
            echo
            echo "Ambas as telas forcam \`sensorLandscape\` (horizontal) e se fecham sozinhas"
            echo "em 20 s se o anuncio nao carregar: nunca travam a TV."
            echo
            echo "Assinado com a mesma chave da linha SMARTED-TV (certificado"
            echo "\`$CERT_SHA256\`)."
          } > "$NOTAS"
          if gh release view "$TAG_ADS" >/dev/null 2>&1; then
            gh release edit "$TAG_ADS" --title "SMARTEDTV Anuncios $VERSAO_ADS (AdMob)" --notes-file "$NOTAS"
          else
            gh release create "$TAG_ADS" --title "SMARTEDTV Anuncios $VERSAO_ADS (AdMob)" \
              --notes-file "$NOTAS" --target "$GITHUB_SHA"
          fi
          # limpa um anexo com nome errado de tentativa anterior
          gh release delete-asset "$TAG_ADS" entrega.apk --yes >/dev/null 2>&1 || true
          gh release delete-asset "$TAG_ADS" sha256.txt --yes >/dev/null 2>&1 || true
          gh release upload "$TAG_ADS" \
            "$RUNNER_TEMP/ads/$ARQUIVO_ADS" \
            "$RUNNER_TEMP/ads/SMARTEDTV-Anuncios.sha256" --clobber
          gh release view "$TAG_ADS" --json assets -q '.assets[] | "\(.name) \(.size) bytes"'

      - name: 10. Diagnostico quando qualquer passo falhar
        if: failure()
        run: |
          set -uo pipefail
          mkdir -p docs
          {
            echo "# Log do build dos anuncios (falhou)"
            echo
            echo '## arquivos gerados'
            echo '```'
            ls -l "$RUNNER_TEMP/ads" 2>/dev/null || echo '(sem pasta)'
            echo '```'
            echo '## compilacao (gradle)'
            echo '```'
            tail -n 150 "$RUNNER_TEMP/gradle.log" 2>/dev/null || echo '(sem log do gradle)'
            echo '```'
            echo
            echo '## conferencia'
            echo '```'
            tail -n 80 "$RUNNER_TEMP/ads/check.log" 2>/dev/null || echo '(sem log da conferencia)'
            echo '```'
          } > docs/build-log-ads.txt
          git config user.name "smarted-bot"
          git config user.email "smarted-bot@users.noreply.github.com"
          git add docs/build-log-ads.txt
          git commit -m "ci: log do build dos anuncios" || true
          git push origin HEAD:arena/7dedf371-kode || true
