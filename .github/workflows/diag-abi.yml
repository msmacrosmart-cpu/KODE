name: diag-abi
# TEMPORARIO: compara as libs arm64 do APK SMARTEDTV com o Kodi 21.3 oficial
# e lista as libs armv7 que precisam entrar para o APK rodar em 32 e 64 bits.
on:
  push:
    branches: [arena/39a14845-kode]
    paths: [.github/workflows/diag-abi.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  abi:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/39a14845-kode
      - name: Baixar SMARTEDTV v15 e Kodi 21.3 arm64/armv7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          set -uo pipefail
          mkdir -p build
          gh release download v1.0.85-tela-inicial-v15 \
            --pattern 'SMARTEDTV-atual-com-tela-inicial-v15.apk' --dir build
          : > build/download.log
          for url in \
            'https://mirrors.kodi.tv/releases/android/arm/kodi-21.3-Omega-armeabi-v7a.apk' \
            'https://mirrors.kodi.tv/releases/android/arm/kodi-21.3-Omega-armeabi-v7a.apk?https=1' \
            'https://mirrors.kodi.tv/releases/android/arm64-v8a/kodi-21.3-Omega-arm64-v8a.apk'; do
            echo "== $url" >> build/download.log
            if curl -L --fail --retry 2 --max-time 300 -o build/baixado.apk "$url" >>build/download.log 2>&1; then
              echo "OK $url" >> build/download.log
              case "$url" in
                *armeabi-v7a*) mv build/baixado.apk build/kodi-armv7.apk ;;
                *) mv build/baixado.apk build/kodi-arm64.apk ;;
              esac
            else
              echo "FALHOU $url ($?)" >> build/download.log
            fi
          done
          ls -lh build
          cat build/download.log
      - name: Comparar libs e classes
        run: |
          set +e
          {
            echo "== SMARTEDTV v15"
            unzip -l build/SMARTEDTV-atual-com-tela-inicial-v15.apk | awk '$4 ~ /^classes.*\.dex$/ {print "dex:",$4,$1}'
            unzip -l build/SMARTEDTV-atual-com-tela-inicial-v15.apk | awk '$4 ~ /^lib\/arm64-v8a\// {print $4,$1}' | sort > build/base64.txt
            echo "libs arm64 no SMARTEDTV: $(wc -l < build/base64.txt)"
            sed -n '1,8p' build/base64.txt
            echo
            echo "== Kodi oficial armv7"
            unzip -l build/kodi-armv7.apk | awk '$4 ~ /^lib\/armeabi-v7a\// {print $4,$1}' | sort > build/v7.txt
            echo "libs armv7 no Kodi: $(wc -l < build/v7.txt)"
            sed -n '1,8p' build/v7.txt
            echo
            echo "== nomes arm64 (SMARTEDTV) x nomes armv7 (Kodi oficial)"
            sed 's#^lib/arm64-v8a/#lib/ABI/#' build/base64.txt | awk '{print $1}' | sort > build/nomes64.txt
            sed 's#^lib/armeabi-v7a/#lib/ABI/#' build/v7.txt | awk '{print $1}' | sort > build/nomesv7.txt
            echo "-- só no SMARTEDTV (arm64):"; comm -23 build/nomes64.txt build/nomesv7.txt
            echo "-- só no Kodi armv7:"; comm -13 build/nomes64.txt build/nomesv7.txt
            echo
            echo "== libkodi.so: strings de classe/JNI"
            unzip -p build/SMARTEDTV-atual-com-tela-inicial-v15.apk lib/arm64-v8a/libkodi.so > build/kodi64.so
            unzip -p build/kodi-armv7.apk lib/armeabi-v7a/libkodi.so > build/kodiv7.so
            ls -l build/kodi64.so build/kodiv7.so
            for f in build/kodi64.so build/kodiv7.so; do
              echo "-- $f"
              strings -a "$f" 2>/dev/null | grep -E 'org/xbmc|smartedtv|kodi/Main' | sort -u | head -20
            done
            echo
            echo "== classes*.dex: nomes de classe"
            for dex in $(unzip -Z1 build/SMARTEDTV-atual-com-tela-inicial-v15.apk | grep -E '^classes.*\.dex$'); do
              echo "-- $dex"
              unzip -p build/SMARTEDTV-atual-com-tela-inicial-v15.apk "$dex" > build/um.dex
              strings -a build/um.dex 2>/dev/null | grep -E 'org/xbmc|smartedtv/full|smartedtv' | sort -u | head -20
            done
          } > docs/abi-merge-info2.txt 2>&1
          cat docs/abi-merge-info2.txt
          test -s docs/abi-merge-info2.txt
      - name: Commitar relatorio
        run: |
          set -euo pipefail
          git config user.name 'diag-abi'
          git config user.email 'diag-abi@users.noreply.github.com'
          git add docs/abi-merge-info2.txt
          git diff --cached --quiet || git commit -m "diag: nomes de libs e classes JNI do APK x Kodi armv7"
          git push origin HEAD:arena/39a14845-kode
