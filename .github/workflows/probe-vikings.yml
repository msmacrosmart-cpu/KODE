name: Sonda Vikings Repo (diagnostico)

# Diagnóstico manual: confere se as URLs candidatas do Vikings Repo respondem
# e o que existe dentro do zip do repositório. Não publica APK: grava o
# resultado em .github/vikings-probe.txt (commit nesta mesma branch).
on:
  workflow_dispatch:
  push:
    branches: [arena/7dedf371-kode]
    paths: [.github/workflows/probe-vikings.yml]

permissions:
  contents: write

jobs:
  sonda:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Sondar URLs
        run: |
          mkdir -p /tmp/sonda
          for url in \
            https://vkodi.net/repo/repository.vikings.zip \
            https://vkodi.net/repo/ \
            https://vkodi.net/repo/addons.xml \
            https://vkodi.net/repo/zips/ ; do
            echo "=== $url" >> /tmp/sonda/report.txt
            curl -sSL --max-time 25 -o /dev/null -w 'http=%{http_code} bytes=%{size_download} final=%{url_effective}\n' "$url" >> /tmp/sonda/report.txt 2>&1 || echo "FALHOU" >> /tmp/sonda/report.txt
          done
      - name: Baixar e inspecionar o zip do repositorio
        run: |
          curl -sSL --max-time 60 -o /tmp/sonda/repo.zip https://vkodi.net/repo/repository.vikings.zip || true
          ls -l /tmp/sonda/repo.zip >> /tmp/sonda/report.txt 2>&1 || true
          python3 - <<'PY' >> /tmp/sonda/report.txt 2>&1
          import zipfile, pathlib, hashlib
          p = pathlib.Path('/tmp/sonda/repo.zip')
          if not p.exists() or p.stat().st_size == 0:
              print('zip nao baixado')
          else:
              print('sha256', hashlib.sha256(p.read_bytes()).hexdigest(), p.stat().st_size, 'bytes')
              with zipfile.ZipFile(p) as z:
                  for n in z.namelist()[:40]:
                      print('  ', n)
                  for n in [x for x in z.namelist() if x.endswith('addon.xml')][:3]:
                      print('----', n)
                      print(z.read(n).decode('utf-8', 'replace')[:2000])
          PY
      - name: Listar addons.xml do repositorio
        run: |
          curl -sSL --max-time 30 https://vkodi.net/repo/addons.xml -o /tmp/sonda/addons.xml || true
          ls -l /tmp/sonda/addons.xml >> /tmp/sonda/report.txt 2>&1 || true
          grep -o 'id="[^"]*"' /tmp/sonda/addons.xml 2>/dev/null | sort -u | head -80 >> /tmp/sonda/report.txt || true
      - name: Ver o que o Brazuca Play instalado por esse repo declara
        run: |
          curl -sSL --max-time 60 -o /tmp/sonda/repo-brazuca.zip https://vkodi.net/repo/zips/plugin.video.BrazucaPlay.Matrix/plugin.video.BrazucaPlay.Matrix-2.1.4.zip || true
          ls -l /tmp/sonda/repo-brazuca.zip >> /tmp/sonda/report.txt 2>&1 || true
      - name: Publicar resultado (commit nesta branch)
        run: |
          cp /tmp/sonda/report.txt .github/vikings-probe.txt
          git config user.name "SMARTEDTV Build"
          git config user.email "ci@smarted.local"
          git add .github/vikings-probe.txt
          git commit -m "ci: resultado da sonda do Vikings Repo" || echo "sem mudancas"
          git push origin HEAD:${GITHUB_REF_NAME}
