name: Sonda Vikings Repo (diagnostico)

# Diagnóstico manual: confere se as URLs candidatas do Vikings Repo respondem
# e o que existe dentro do zip do repositório. Não publica APK: grava o
# resultado em .github/vikings-probe.txt (commit nesta mesma branch).
on:
  workflow_dispatch:
  push:
    branches: [arena/7dedf371-kode]
    paths: [.github/workflows/probe-vikings.yml]

permissions:
  contents: write

jobs:
  sonda:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Sondar URLs do repositorio
        run: |
          python3 tools/kodi/probe-vikings.py /tmp/vikings-probe.txt || echo "sonda falhou"
          wc -l /tmp/vikings-probe.txt
      - name: Publicar resultado (commit nesta branch)
        if: always()
        run: |
          test -s /tmp/vikings-probe.txt || echo "(sonda nao gerou relatorio)" > /tmp/vikings-probe.txt
          cp /tmp/vikings-probe.txt .github/vikings-probe.txt
          git config user.name "SMARTEDTV Build"
          git config user.email "ci@smarted.local"
          git add .github/vikings-probe.txt
          git commit -m "ci: resultado da sonda do Vikings Repo" || echo "sem mudancas"
          git push origin HEAD:${GITHUB_REF_NAME}
