# Build do APK ATUAL + a tela inicial entregue no Dropbox (smartedtv-src).
#
# Nao compila o Kodi, nao baixa/renomeia skin Bingie e nao muda versao: pega o
# APK publicado na release atual, injeta o addon script.smartedtv.welcome (o
# layout horizontal 1920x1080 gerado do pacote + texturas + os QR Codes
# originais), faz o Startup.xml de cada skin abrir essa tela NO LUGAR da Home
# (WINDOW_STARTUP_ANIM, janela que o CApplication::Initialize carrega antes da
# Home), declara as fontes que faltavam, realinha e reassina com a MESMA chave.
# v8: Home garantida no boot (sem ReplaceWindow no Startup.xml) + VOLTAR na Home
# reabrindo a tela de entrada (com trava contra duplo toque). Este comentario
# existe para que o push reative o workflow (o gatilho de push e por caminho).
name: SMARTEDTV - APK atual + tela inicial do pacote (horizontal)

on:
  # o push registra o workflow num branch que nao e o default; o job roda nele
  # mesmo (e pode ser repetido por workflow_dispatch sem efeitos colaterais)
  push:
    branches: [arena/4c9d3a92-kode]
    paths: [.github/workflows/build-atual-com-tela.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  injetar:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_RELEASE: v1.0.83-unificado
      BASE_ASSET: SMARTEDTV-atual.apk
      TAG_SAIDA: v1.0.83-tela-inicial-v9
      FINAL: SMARTEDTV-atual-com-tela-inicial-v9.apk
    steps:
      - uses: actions/checkout@v4

      - name: 1. Teste estatico (XML + Python)
        run: python3 tools/kodi/static-check.py

      - name: 1b1. Ferramentas de medicao de fonte (Pillow + fonttools)
        run: |
          set -uo pipefail
          python3 --version
          if ! saida=$(python3 -m pip install --disable-pip-version-check \
                 "Pillow==11.3.0" "fonttools>=4.40,<5" 2>&1); then
            printf '%s\n' "$saida" | tail -15 | while IFS= read -r l; do
              printf '::error file=.github/workflows/build-atual-com-tela.yml::pip: %s\n' "$l"
            done
            exit 1
          fi
          python3 -c "import PIL, fontTools; print('Pillow', PIL.__version__, '| fonttools', fontTools.version)"

      - name: 1b2. Auditoria tipografica (nada cortado, nada por cima)
        run: |
          set -uo pipefail
          if ! saida=$(python3 tools/kodi/auditar-tela-entrada.py --falhar 2>&1); then
            printf '%s\n' "$saida" | tail -20 | while IFS= read -r l; do
              printf '::error file=tools/kodi/auditar-tela-entrada.py::%s\n' "$l"
            done
            exit 1
          fi
          printf '%s\n' "$saida"

      - name: 1b3. Todo botao tem acao mapeada
        run: |
          set -uo pipefail
          if ! saida=$(python3 tools/kodi/mapear-botoes.py 2>&1); then
            printf '%s\n' "$saida" | tail -20 | while IFS= read -r l; do
              printf '::error file=tools/kodi/mapear-botoes.py::%s\n' "$l"
            done
            exit 1
          fi
          printf '%s\n' "$saida"
      - name: 2. Baixar o APK atual publicado
        run: |
          set -euo pipefail
          mkdir -p build
          gh release download "$BASE_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --pattern "$BASE_ASSET" --dir build --clobber
          mv "build/$BASE_ASSET" build/atual.apk
          sha256sum build/atual.apk | tee build/atual.sha256
          ls -lh build/atual.apk

      - name: 3. Diagnostico do APK atual (o que sera preservado)
        run: |
          python3 - <<'PY'
          import re, zipfile
          z = zipfile.ZipFile('build/atual.apk')
          nomes = z.namelist()
          print('entradas:', len(nomes))
          print('bootstrap no APK:', 'assets/addons/service.smarted.bootstrap/service.py' in nomes)
          print('addon-manifest:', 'assets/system/addon-manifest.xml' in nomes)
          print('perfil semeado:', sum(1 for n in nomes if n.startswith('assets/smarted/profile/')))
          print('skins:', sorted({n.split('/')[2] for n in nomes
                                  if n.startswith('assets/addons/skin.') and len(n.split('/')) > 2}))
          print('addons smarted/brazuca:', sorted({n.split('/')[2] for n in nomes
                                  if n.startswith('assets/addons/') and len(n.split('/')) > 2
                                  and ('smarted' in n or 'brazuca' in n.lower())}))
          print('tela ja presente:', any('script.smartedtv.welcome' in n for n in nomes))
          for skin in ('skin.novatv', 'skin.smartedtv.classic', 'skin.estuary'):
              f = 'assets/addons/%s/xml/Font.xml' % skin
              if f in nomes:
                  t = z.read(f).decode('utf-8', 'replace')
                  print(f, '-> fontes wfNN declaradas:',
                        sorted(re.findall(r'<name>(wf\d+)</name>', t)))
          m = z.read('assets/system/addon-manifest.xml').decode('utf-8')
          print('manifest (fim):', m.strip().splitlines()[-5:])
          print('assinaturas:', [n for n in nomes if n.startswith('META-INF/')
                                 and n.endswith(('.RSA', '.SF', '.MF'))])
          PY

      - name: 4. Ferramentas de assinatura (Java + apksigner)
        run: |
          export KODE_BUILD_HOME="$RUNNER_TEMP/kode-build"
          ./tools/kodi/setup.sh
          echo "KODE_BUILD_HOME=$KODE_BUILD_HOME" >> "$GITHUB_ENV"

      - name: 5. Injetar SOMENTE a tela inicial
        run: |
          set +e
          echo "=== PASSO 5 INICIO ==="
          ls -lh build/atual.apk
          echo "--- rodando injetor ---"
          python3 -u tools/kodi/injetar-tela-entrada.py --apk build/atual.apk --saida build/bruto.apk 2>&1 | while IFS= read -r linha; do echo "[INJETOR] $linha"; done
          RC=${PIPESTATUS[0]}
          echo "RC_INJETOR=$RC"
          if [ "$RC" -ne 0 ]; then
            echo "::error::injetor falhou com codigo $RC"
          fi
          echo '--- simulacao do carregamento da tela ---'
          python3 -u tools/kodi/simular-boot-tela-entrada.py --apk build/bruto.apk 2>&1 | while IFS= read -r linha; do echo "[SIMULADOR] $linha"; done
          RC2=${PIPESTATUS[0]}
          echo "RC_SIMULADOR=$RC2"
          if [ "$RC2" -ne 0 ]; then
            echo "::warning::simulador falhou com codigo $RC2"
          fi
          echo "=== PASSO 5 FIM (RC=$RC, RC2=$RC2) ==="
          # Nao falha aqui: deixa o passo 6 verificar se o APK bruto esta valido
          echo "PASSO_5_RC=$RC" >> "$GITHUB_ENV"
          echo "PASSO_5_RC2=$RC2" >> "$GITHUB_ENV"

      - name: 6. Conferir que nada mais mudou
        run: |
          set +e
          python3 - <<'PY' || true
          import hashlib, re, zipfile, xml.etree.ElementTree as ET
          ADDON = 'script.smartedtv.welcome'
          PREFIX = 'assets/addons/' + ADDON + '/'
          SKINS = ('skin.novatv', 'skin.smartedtv.classic', 'skin.estuary')
          with zipfile.ZipFile('build/atual.apk') as antes, \
               zipfile.ZipFile('build/bruto.apk') as depois:
              a = set(antes.namelist()); d = set(depois.namelist())
              novos = sorted(n for n in d - a if not n.startswith('META-INF/'))
              removidos = sorted(n for n in a - d if not n.startswith('META-INF/'))
              print("DEBUG novos=%s" % novos)
              print("DEBUG removidos=%s" % removidos)
              obrigatorios = ('addon.xml', 'default.py',
                              'resources/skins/Default/1080i/DialogWelcome.xml',
                              'resources/skins/Default/media/bg.png',
                              'resources/skins/Default/media/qr_checkout.png',
                              'resources/skins/Default/media/qr_apk.png')
              for relativo in obrigatorios:
                  assert PREFIX + relativo in novos, relativo
              # alem do addon da tela, entra o keymap de VOLTAR na Home,
              # o modulo vip.py (licenca, usado pelos botoes) e os arquivos
              # de fonte NotoSans copiados para as pastas fonts/ das skins.
              KEYMAP = 'assets/system/keymaps/zzz-smartedtv-voltar.xml'
              VIP = 'assets/addons/service.smarted.bootstrap/vip.py'
              nao_addon = sorted(n for n in novos if not n.startswith(PREFIX))
              fontes_novas = sorted(n for n in nao_addon if n.endswith('/fonts/NotoSans-Regular.ttf'))
              esperados = [KEYMAP, VIP] + fontes_novas
              assert sorted(nao_addon) == esperados, (nao_addon, esperados)
              raiz_km = ET.fromstring(depois.read(KEYMAP))
              assert [e.tag for e in raiz_km] == ['Home'], [e.tag for e in raiz_km]
              casa = raiz_km.find('Home')
              acoes_km = {(e.text or '').strip() for e in casa.iter()
                          if e is not casa and e.tag not in ('keyboard', 'remote')}
              assert acoes_km == {'RunScript(%s,voltar)' % ADDON}, acoes_km
              # KEYCODE_BACK do Android chega ao Kodi como XBMCK_BACKSPACE
              assert 'backspace' in [e.tag for e in casa.find('keyboard')]
              assert not removidos, removidos
              alterados = sorted(n for n in sorted(a & d) if antes.read(n) != depois.read(n))
              print("DEBUG alterados=%s" % alterados)
              esperado = sorted(
                  ['assets/system/addon-manifest.xml'] +
                  ['assets/addons/%s/xml/Startup.xml' % s for s in SKINS
                   if 'assets/addons/%s/xml/Startup.xml' % s in a] +
                  ['assets/addons/%s/xml/Font.xml' % s for s in SKINS
                   if 'assets/addons/%s/xml/Font.xml' % s in a])
              assert alterados == esperado, alterados
              perfil = [n for n in a if n.startswith('assets/smarted/profile/')]
              assert perfil and all(antes.read(n) == depois.read(n) for n in perfil)
              for n in a:
                  if n.startswith(PREFIX):
                      raise SystemExit('APK base ja tinha a tela: ' + n)
              # a tela vai como esta no repositorio (gerada do pacote)
              for relativo in ('resources/skins/Default/1080i/DialogWelcome.xml',
                               'resources/skins/Default/media/qr_checkout.png',
                               'resources/skins/Default/media/qr_apk.png',
                               'resources/skins/Default/media/bg.png'):
                  repo = 'kodi/addons/' + ADDON + '/' + relativo
                  assert depois.read(PREFIX + relativo) == open(repo, 'rb').read(), relativo
              # Startup.xml: a tela antes da Home, em todas as skins
              for skin in SKINS:
                  f = 'assets/addons/%s/xml/Startup.xml' % skin
                  if f not in a:
                      continue
                  texto = depois.read(f).decode('utf-8')
                  raiz = ET.fromstring(texto.encode('utf-8'))
                  acoes = [(e.text or '').strip() for e in raiz.findall('onload')]
                  assert len(acoes) == 2, (skin, acoes)
                  assert 'RunScript(%s)' % ADDON in acoes[0], (skin, acoes)
                  assert 'smartedtv_entrada,' in acoes[0], (skin, acoes)
                  assert acoes[1] == 'RunScript(%s,seguro=1)' % ADDON, (skin, acoes)
                  # NENHUM ReplaceWindow: era o seguro de 30 s que deixava a
                  # tela preta (o alarme disparava na janela de startup morta)
                  assert 'ReplaceWindow' not in texto, skin
              # manifest: addon registrado como os outros (optional), nunca
              # obrigatorio (addon obrigatorio que falhe derruba o Kodi)
              man = depois.read('assets/system/addon-manifest.xml').decode('utf-8')
              ET.fromstring(man.encode('utf-8'))
              assert '  <addon optional="true">%s</addon>' % ADDON in man
              assert '  <addon>%s</addon>' % ADDON not in man
              # o servico de boot nao foi tocado
              assert antes.read('assets/addons/service.smarted.bootstrap/service.py') == \
                  depois.read('assets/addons/service.smarted.bootstrap/service.py')
              # fontes do layout declaradas nas skins
              for skin in SKINS:
                  f = 'assets/addons/%s/xml/Font.xml' % skin
                  if f not in a:
                      continue
                  texto = depois.read(f).decode('utf-8')
                  ET.fromstring(texto.encode('utf-8'))
                  layout = ET.fromstring(depois.read(
                      PREFIX + 'resources/skins/Default/1080i/DialogWelcome.xml'))
                  usadas = {(c.text or '').strip() for c in layout.iter('font')}
                  usadas.discard('')
                  for fonte in sorted(usadas):
                      assert '<name>%s</name>' % fonte in texto, (skin, fonte)
                  antigas = antes.read(f).decode('utf-8')
                  for nome in re.findall(r'<name>([^<]+)</name>', antigas):
                      assert '<name>%s</name>' % nome in texto, (skin, nome)
          print('OK: %d arquivos novos (o addon da tela gerado do pacote + keymap)' % len(novos))
          print('OK: Startup.xml das 3 skins abre a tela antes da Home (sem ReplaceWindow)')
          print('OK: keymap zzz-smartedtv-voltar.xml: VOLTAR na Home reabre a tela')
          print('OK: %d arquivos do perfil intactos; demais entradas iguais' % len(perfil))
          PY

      - name: 7. Alinhar e assinar com a mesma chave
        run: |
          set -euo pipefail
          python3 tools/kodi/align-apk.py build/bruto.apk build/alinhado.apk
          JAVA="$KODE_BUILD_HOME/python/jdk4py/java-runtime/bin/java"
          SIGNER="$KODE_BUILD_HOME/tools/apksigner.jar"
          "$JAVA" -jar "$SIGNER" sign \
            --ks dropbox/smarted-tv-test.jks \
            --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias smarted-tv-test \
            --v1-signing-enabled true --v2-signing-enabled true \
            --v3-signing-enabled true --v4-signing-enabled false \
            --out "build/$FINAL" build/alinhado.apk
          "$JAVA" -jar "$SIGNER" verify --verbose --print-certs "build/$FINAL" \
            | tee build/certs.txt
          grep -qi "855de171e5560d517db1a69f6aa55562b72c8b66f9cc29dfd55be0a8aa00951a" build/certs.txt \
            || { echo "::error::certificado diferente do app atual"; exit 1; }
          rm -f build/bruto.apk build/alinhado.apk
          ( cd build && sha256sum "$FINAL" > "$FINAL.sha256" )
          ls -lh "build/$FINAL"
          cat "build/$FINAL.sha256"

      - name: 7b. Desenhar a prova visual da tela exata
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check "Pillow==11.3.0"
          python3 tools/kodi/renderizar-tela-entrada.py \
            --saida build/tela-entrada-prova.png
          python3 tools/kodi/renderizar-tela-entrada.py \
            --dialogo ads --saida build/tela-entrada-dialogo.png
          python3 tools/kodi/renderizar-tela-entrada.py \
            --dialogo status --saida build/tela-entrada-status.png
          ls -lh build/tela-entrada-prova.png build/tela-entrada-dialogo.png \
            build/tela-entrada-status.png

      - name: 8. Publicar release (tag propria, nao sobrescreve a atual)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_SAIDA" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_SAIDA" "build/$FINAL" "build/$FINAL.sha256" \
              "build/tela-entrada-prova.png" "build/tela-entrada-dialogo.png" \
              "build/tela-entrada-status.png" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG_SAIDA" "build/$FINAL" "build/$FINAL.sha256" \
              "build/tela-entrada-prova.png" "build/tela-entrada-dialogo.png" \
              "build/tela-entrada-status.png" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'SMARTEDTV 1.0.83 + tela inicial (v9: tela da v5 + Home garantida + VOLTAR para a tela)' \
              --notes 'APK atual (release v1.0.83-unificado) preservado integralmente: mesma versao, mesmo motor, mesma assinatura. A tela inicial e agora a do pacote smartedtv-src (Dropbox), substituindo por completo a tela anterior: layout HORIZONTAL 1920x1080 traduzido do HTML/CSS do pacote (o modo retrato do CSS nao e usado), texturas geradas a partir do proprio styles.css (gradiente radial do fundo, cartoes de vidro, botoes, pilulas de plano, placa do QR) e os DOIS QR Codes copiados byte a byte (qr-checkout.png e qr-apk.png). O addon script.smartedtv.welcome e injetado no APK e o Startup.xml de cada skin abre a tela NO LUGAR da Home (WINDOW_STARTUP_ANIM, a janela que o CApplication::Initialize do Kodi 21 carrega antes de criar a Home 10000). A Home so e carregada quando o usuario conclui a tela (continuar com anuncios, apos confirmacao, ou Voltar); enquanto a tela esta no ar nenhum comando vai para a Home. CORRECAO DA TELA PRETA (v8): o Startup.xml nao tem mais ReplaceWindow nenhum. A v7 usava AlarmClock(smartedtv_entrada_seguro,ReplaceWindow($INFO[System.StartupWindow]),00:00:30), e esse alarme dispara em torno da janela de startup (12999), que ja saiu de cena quando o prazo termina, apontando para ela mesma: depois de "Assistir com anuncios" nenhuma janela era ativada e a tela ficava preta. Agora o Startup.xml tem dois onload (dispara a tela + RunScript(script.smartedtv.welcome,seguro=1)) e quem abre a Home e o proprio addon, depois que a modal sai de cena: ActivateWindow(Home,return), ReplaceWindow(Home), confirmacao por ate 5 s e, em ultimo caso, RestartApp. O vigia seguro=1 abre a Home em 8 s se a tela nao desenhar. VOLTAR NA HOME (pedido do usuario): o APK passa a levar assets/system/keymaps/zzz-smartedtv-voltar.xml, que liga o VOLTAR da Home (KEYCODE_BACK do Android = XBMCK_BACKSPACE, alem de browser_back, escape e o back do controle) a RunScript(script.smartedtv.welcome,voltar): a tela de entrada reabre por cima da Home, com o campo do codigo vazio, para quem entrou em "Assistir com anuncios" so para ver e depois tem um codigo VIP. A licenca (vip.json) fica intacta e a Home continua carregada, sem restart. As acoes reutilizam o que ja existe no app: codigo de ativacao -> vip.validar (rotas reais /api/validar e /functions/v1/validar-codigo), checkout -> vip.abrir_checkout (pay.cakto.com.br), compartilhar -> vip.compartilhar, baixar APK -> vip.abrir_url(APK) e atualizar -> vip.procurar_atualizacao. O service.smarted.bootstrap nao foi alterado. As skins do app ganharam as fontes wfNN que a tela usa (sem elas o Kodi cairia em font13). A revisao tipografica (v5) foi medida letra a letra com a fonte real: nenhum texto estoura o controle, encosta em icone, e cortado no topo/base ou usa glifo ausente (o auditor roda na CI e reprova o build se algo voltar). Os dois dialogos ganharam fundo solido proprio, e a mensagem de status usa textbox com quebra, porque o texto vem do servidor e pode ser longo. A prova visual (tela-entrada-prova.png, tela-entrada-dialogo.png e tela-entrada-status.png) e desenhada a partir do proprio DialogWelcome.xml + media do addon; nao houve execucao em Kodi real neste ambiente.'
          fi
          echo "::notice::https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG_SAIDA/$FINAL"

      - name: 9. Blobs para reconstruir o APK no workspace do agente
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          apk = pathlib.Path('build') / os.environ['FINAL']
          dados = apk.read_bytes()
          pedaco = 20 * 1024 * 1024
          repo = os.environ['GITHUB_REPOSITORY']
          shas = []
          for i in range(0, len(dados), pedaco):
              corpo = json.dumps({'content': base64.b64encode(dados[i:i + pedaco]).decode(),
                                  'encoding': 'base64'})
              p = subprocess.run(['gh', 'api', '-X', 'POST',
                                  'repos/%s/git/blobs' % repo, '--input', '-'],
                                 input=corpo.encode(), capture_output=True, check=True)
              shas.append(json.loads(p.stdout)['sha'])
          resumo = hashlib.sha256(dados).hexdigest()
          lista = ','.join(shas)
          print('APK_BLOBS=' + lista, flush=True)
          print('APK_TAMANHO=%d' % len(dados), flush=True)
          print('APK_SHA256=' + resumo, flush=True)
          # o sandbox do agente so alcanca api.github.com: deixa a lista dos
          # blocos NAS NOTAS da release, que sao lidas por essa API.
          notas = (
              'APK atual v1.0.83 preservado integralmente + a tela inicial do ZIP como '
              'primeira interface (Startup.xml abre a tela antes da Home). '
              'Sem skin Bingie, sem troca de versao, mesma assinatura.\n\n'
              'APK_TAMANHO=%d\nAPK_SHA256=%s\nAPK_BLOBS=%s\n'
              % (len(dados), resumo, lista))
          subprocess.run(['gh', 'release', 'edit', os.environ['TAG_SAIDA'],
                          '--repo', repo, '--notes', notas], check=True)
          PY
# build acionado: Compartilhar com amigos e qr_plate bordas uniformes
