name: SMARTEDTV - build tela VÍDEOS (arm64)

# Compila o Kodi 21.3-Omega do código-fonte com a identidade SMARTEDTV E as
# modificações da tela VÍDEOS (MyVideos.xml, plugin.video.smarted com as 5
# ações externas, service.smarted.bootstrap), publica o APK assinado numa
# Release do repositório.
#
# Disparado por workflow_dispatch ou push na branch arena/28b146c9-kode.
#
# Receita idêntica ao smartedtv-build-source.yml (que já compilou com sucesso
# neste mesmo tipo de runner), com as etapas extras:
#   - copia kodi/skin.novatv/     -> addons/skin.novatv/     no fonte do Kodi
#   - copia kodi/addons/plugin.video.smarted/ -> addons/plugin.video.smarted/
#   - copia kodi/addons/service.smarted.bootstrap/ -> addons/service.smarted.bootstrap/
#   - registra esses 3 addons no system/addon-manifest.xml e cmake/installdata/common/addons.txt

on:
  workflow_dispatch:
  push:
    branches: [arena/28b146c9-kode]
    paths:
      - .github/workflows/smartedtv-build-videos.yml
      - smartedtv/**
      - kodi/**

permissions:
  contents: write

concurrency:
  group: smartedtv-videos-${{ github.ref }}
  cancel-in-progress: false

env:
  KODI_TAG: 21.3-Omega
  KODI_COMMIT: a3a448d26b8d560a65655dab2cd122994dc4e146

jobs:
  arm64:
    name: Kodi 21.3-Omega -> SMARTEDTV com tela VÍDEOS arm64-v8a
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: 1. Libertar espaço em disco
        run: |
          echo "== antes =="; df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo apt-get clean
          docker image prune -af 2>/dev/null || true
          echo "== depois =="; df -h /

      - name: 2. JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3. Dependências de sistema
        run: |
          set -uo pipefail
          sudo apt-get update -o Acquire::Retries=5 -qq 2>/dev/null || true
          sudo apt-get install -y -qq --no-install-recommends \
            autoconf automake bison build-essential curl flex gawk git gperf \
            lib32stdc++6 lib32z1 libcurl4-openssl-dev unzip zip zlib1g-dev \
            libtool pkg-config cmake 2>/dev/null || true
          missing=""
          for t in cmake make git curl unzip python3 autoconf automake libtoolize pkg-config gperf bison flex; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          [ -z "$missing" ] || { echo "::error::faltando:$missing"; exit 1; }
          echo "ok: ferramentas presentes"
          python3 -m pip install --quiet --break-system-packages 'Pillow==11.3.0' \
            || python3 -m pip install --quiet --user 'Pillow==11.3.0'
          python3 -c 'import PIL,sys;print("Pillow",PIL.__version__,"em",sys.executable)'

      - name: 4. SDK/NDK do Kodi 21.3
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-34' 'build-tools;33.0.1' 'ndk;21.4.7075529'
          test -d "$ANDROID_HOME/ndk/21.4.7075529"
          echo "ok: SDK 34, build-tools 33.0.1, NDK 21.4.7075529"

      - name: 5. Identidade visual SMARTEDTV (artes oficiais)
        run: |
          python3 smartedtv/tools/make-brand-assets.py
          test -f smartedtv/out/media/splash.jpg
          ls smartedtv/out/media | head -6

      - name: 6. Código-fonte do Kodi 21.3-Omega + identidade
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$KODI_TAG" https://github.com/xbmc/xbmc.git "$RUNNER_TEMP/kodi"
          test "$(git -C "$RUNNER_TEMP/kodi" rev-parse HEAD)" = "$KODI_COMMIT"
          echo "commit ok: $KODI_COMMIT"

          # pt-BR oficial (o Kodi só embarca en_gb)
          git clone --depth 1 -b omega https://github.com/xbmc/repo-resources.git "$RUNNER_TEMP/res"
          mkdir -p "$RUNNER_TEMP/lang"
          cp -r "$RUNNER_TEMP/res/resource.language.pt_br" "$RUNNER_TEMP/lang/"

          # Skin Bingie Mod + dependências
          python3 tools/kodi/fetch-bingie-addons.py "$RUNNER_TEMP/bingie"

          python3 smartedtv/tools/patch-source.py "$RUNNER_TEMP/kodi" \
            --brand-dir smartedtv/out \
            --language-addon "$RUNNER_TEMP/lang/resource.language.pt_br" \
            --bingie-dir "$RUNNER_TEMP/bingie"
          grep -q 'app_name\">SMARTEDTV<' "$RUNNER_TEMP/kodi/tools/android/packaging/xbmc/strings.xml.in"
          grep -q '^APP_NAME Kodi' "$RUNNER_TEMP/kodi/version.txt"
          grep -q '^APP_PACKAGE org.xbmc.kodi' "$RUNNER_TEMP/kodi/version.txt"
          echo "identidade + paleta + Bingie padrão aplicados"

      # -----------------------------------------------------------------------
      # ETAPAS EXTRAS: incorporar skin.novatv, plugin.video.smarted e
      # service.smarted.bootstrap do repositório KODE no fonte do Kodi.
      # -----------------------------------------------------------------------
      - name: 6b. Copiar skin.novatv para o fonte do Kodi
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/kodi/addons/skin.novatv"
          rm -rf "$DEST"
          cp -r "$GITHUB_WORKSPACE/kodi/skin.novatv" "$DEST"
          # remove caches de bytecode se houver
          find "$DEST" -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null || true
          echo "skin.novatv copiada: $(find "$DEST" -type f | wc -l) arquivos"
          test -f "$DEST/addon.xml"
          test -f "$DEST/xml/MyVideos.xml"
          echo "MyVideos.xml presente: $(test -f "$DEST/xml/MyVideos.xml" && echo SIM || echo NAO)"

      - name: 6c. Copiar plugin.video.smarted para o fonte do Kodi
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/kodi/addons/plugin.video.smarted"
          rm -rf "$DEST"
          cp -r "$GITHUB_WORKSPACE/kodi/addons/plugin.video.smarted" "$DEST"
          find "$DEST" -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null || true
          echo "plugin.video.smarted copiado: $(find "$DEST" -type f | wc -l) arquivos"
          test -f "$DEST/addon.xml"
          test -f "$DEST/default.py"
          echo "default.py com rota actions: $(grep -c \"action=open_url\|action=enter_code\|action=show_qr\|action=share_link\|action=check_update\|action=download_apk\" "$DEST/default.py" || echo 0)"

      - name: 6d. Copiar service.smarted.bootstrap para o fonte do Kodi
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/kodi/addons/service.smarted.bootstrap"
          rm -rf "$DEST"
          cp -r "$GITHUB_WORKSPACE/kodi/addons/service.smarted.bootstrap" "$DEST"
          find "$DEST" -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null || true
          echo "service.smarted.bootstrap copiado: $(find "$DEST" -type f | wc -l) arquivos"
          test -f "$DEST/addon.xml"
          test -f "$DEST/service.py"

      - name: 6e. Registrar addons no addon-manifest e addons.txt
        run: |
          set -euo pipefail
          KODI="$RUNNER_TEMP/kodi"
          MANIFEST="$KODI/system/addon-manifest.xml"
          ADDONS_TXT="$KODI/cmake/installdata/common/addons.txt"
          python3 -c '
import sys
manifest_path = sys.argv[1]
addons_txt_path = sys.argv[2]
addons = ["skin.novatv", "plugin.video.smarted", "service.smarted.bootstrap"]

# --- addon-manifest.xml ---
with open(manifest_path, encoding="utf-8") as f:
    text = f.read()
for addon in addons:
    tag = "  <addon>" + addon + "</addon>"
    if tag not in text:
        anchor = "  <addon>skin.estuary</addon>"
        if anchor in text:
            text = text.replace(anchor, anchor + "\n" + tag, 1)
        else:
            text = text.replace("</addons>", tag + "\n</addons>", 1)
        print("  ok manifest: " + addon + " registrado")
    else:
        print("  -- manifest: " + addon + " já presente")
with open(manifest_path, "w", encoding="utf-8") as f:
    f.write(text)

# --- addons.txt ---
with open(addons_txt_path, encoding="utf-8") as f:
    lines = f.readlines()
for addon in addons:
    entry = "addons/" + addon + "/*"
    if not any(entry in line for line in lines):
        insert_at = None
        for i, line in enumerate(lines):
            if line.startswith("addons/skin.estuary/"):
                insert_at = i
                break
        if insert_at is not None:
            lines.insert(insert_at, entry + "\n")
        else:
            lines.append(entry + "\n")
        print("  ok addons.txt: " + entry + " adicionado")
    else:
        print("  -- addons.txt: " + entry + " já presente")
with open(addons_txt_path, "w", encoding="utf-8") as f:
    f.writelines(lines)

print("--- addon-manifest.xml (últimas linhas) ---")
with open(manifest_path, encoding="utf-8") as f:
    print("".join(f.readlines()[-10:]))
print("--- addons.txt (entradas skin/addon) ---")
with open(addons_txt_path, encoding="utf-8") as f:
    for line in f:
        if "addons/skin" in line or "addons/plugin.video.smarted" in line or "addons/service.smarted.bootstrap" in line:
            print(line.rstrip())
' "$MANIFEST" "$ADDONS_TXT"

      - name: 7a. Cache das dependências
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/xbmc-depends
          key: depends-${{ env.KODI_TAG }}-ndk${{ env.NDK_VERSION }}-${{ runner.os }}-v1

      - name: 7b. Compilar dependências Android (só se não houver cache)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kodi/tools/depends"
          ./bootstrap
          ./configure --with-tarballs="$RUNNER_TEMP/tarballs" --host=aarch64-linux-android \
            --with-sdk-path="$ANDROID_HOME" --with-ndk-path="$ANDROID_HOME/ndk/21.4.7075529" \
            --prefix="$RUNNER_TEMP/xbmc-depends"
          make -j2
          echo "livre após dependências: $(df -h --output=avail / | tail -1)"

      - name: 7c. Conferir dependências
        run: |
          set -euo pipefail
          test -d "$RUNNER_TEMP/xbmc-depends" || { echo "::error::prefixo de dependências ausente"; exit 1; }
          echo "cache hit: ${{ steps.cache-deps.outputs.cache-hit }}"
          test -d "$RUNNER_TEMP/xbmc-depends/lib" || { echo "::error::falta lib no prefixo"; exit 1; }
          ls "$RUNNER_TEMP/xbmc-depends/lib" | grep -q '\.so\|\.a' || \
            { echo "::error::prefixo sem bibliotecas compiladas"; exit 1; }
          echo "libs: $(ls "$RUNNER_TEMP/xbmc-depends/lib" | wc -l) entradas"

      - name: 8. Compilar o Kodi para Android
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kodi-build"
          make -C "$RUNNER_TEMP/kodi/tools/depends/target/cmakebuildsys" \
            BUILD_DIR="$RUNNER_TEMP/kodi-build"
          make -C "$RUNNER_TEMP/kodi-build" -j2
          echo "livre após o Kodi: $(df -h --output=avail / | tail -1)"

      - name: 9. Empacotar e assinar o APK
        env:
          KODI_ANDROID_STORE_FILE: ${{ github.workspace }}/dropbox/smarted-tv-test.jks
          KODI_ANDROID_STORE_PASSWORD: android
          KODI_ANDROID_KEY_ALIAS: smarted-tv-test
          KODI_ANDROID_KEY_PASSWORD: android
        run: |
          set -euo pipefail
          make -C "$RUNNER_TEMP/kodi-build" apk
          OUT="$GITHUB_WORKSPACE/smartedtv/out-apk"
          mkdir -p "$OUT"
          APK=$(find "$RUNNER_TEMP/kodi-build" "$RUNNER_TEMP/kodi" -type f -name '*.apk' \
                | grep -v 'unaligned\|unsigned\|intermediate' | head -1)
          [ -n "$APK" ] || { echo "::error::nenhum APK gerado"; exit 1; }
          echo "APK: $APK"
          FINAL="$OUT/SMARTEDTV-21.4.0-arm64-v8a.apk"
          cp "$APK" "$FINAL"
          ( cd "$OUT" && sha256sum "$(basename "$FINAL")" > "$(basename "$FINAL").sha256" )
          ls -la "$OUT"
          cat "$OUT"/*.sha256

      - name: 10. Verificar o APK (informativo)
        continue-on-error: true
        run: |
          set +e
          python3 -m pip install --quiet --break-system-packages pyaxmlparser==0.3.31
          mkdir -p smartedtv/out-apk
          python3 smartedtv/tools/verify-apk.py smartedtv/out-apk/SMARTEDTV-21.4.0-arm64-v8a.apk \
            2>&1 | tee smartedtv/out-apk/verificacao.txt
          cat smartedtv/out-apk/verificacao.txt
          exit 0

      - name: 10b. Guardar relatório da verificação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartedtv-verificacao-videos
          path: smartedtv/out-apk/verificacao.txt
          retention-days: 30
          if-no-files-found: warn

      - name: 11. Guardar APK nos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: smartedtv-apk-arm64-videos
          path: |
            smartedtv/out-apk/*.apk
            smartedtv/out-apk/*.sha256
          retention-days: 30
          if-no-files-found: error

      - name: 12. Publicar Release com o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/smartedtv/out-apk"
          APK="$OUT/SMARTEDTV-21.4.0-arm64-v8a.apk"
          SHA="$APK.sha256"
          TAG="smartedtv-videos-21.4.0-arm64"
          NOTES="SMARTEDTV 21.4.0 — tela VÍDEOS com 5 ações externas do Android.

          - Base: Kodi 21.3-Omega (commit $KODI_COMMIT)
          - Application ID: org.xbmc.kodi (preservado)
          - ABI: arm64-v8a (Android 5+)
          - Assinatura: chave de teste smarted-tv-test (NAO atualiza o Kodi oficial)
          - Skin Nova TV personalizada com tela VÍDEOS (MyVideos.xml)
          - plugin.video.smarted com ações: open_url (Cakto VIP), enter_code,
            show_qr (QR Code), share_link (ACTION_SEND), check_update,
            download_apk
          - service.smarted.bootstrap incluído
          - SHA-256 no arquivo .sha256 anexado"

          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SHA" -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" "$SHA" -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "SMARTEDTV 21.4.0 (arm64-v8a) — Tela VÍDEOS" --notes "$NOTES"
          fi
          echo "::notice::https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
