name: Diagnostico no emulador de projetor
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diag-projetor.yml'
      - 'smartedtv/release/projetor-smoke.sh'
      - 'tools/kodi/analisar-kodi-log.py'
      - 'tools/kodi/publicar-log-inteiro.sh'
      # (comentario para re-disparar quando so a release muda)
permissions:
  contents: write
  actions: read
jobs:
  projetor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Esperar a release desta versao publicar antes de baixar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # o build do APK leva ~6 min: esperar ate 15 min pela release
          for tentativa in $(seq 1 45); do
            if gh release view v1.0.140-universal -R msmacrosmart-cpu/KODE >/dev/null 2>&1; then
              echo "::notice::release v1.0.140-universal disponivel"; exit 0
            fi
            sleep 20
          done
          echo '::error::release v1.0.140-universal nao existe'; exit 1
      - name: Baixar o APK publicado (1.0.140) para provar a correcao
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/universal
          # a release aparece antes de o asset terminar de subir (~287 MB):
          # tentar ate 15 min e conferir o tamanho antes de seguir
          baixou=0
          for tentativa in $(seq 1 30); do
            if gh release download v1.0.140-universal -R msmacrosmart-cpu/KODE \
                 --pattern SMARTEDTV-universal.apk \
                 --output build/universal/SMARTEDTV-universal.apk --clobber 2>/dev/null; then
              tamanho=$(stat -c %s build/universal/SMARTEDTV-universal.apk 2>/dev/null || echo 0)
              if [ "$tamanho" -gt 200000000 ]; then baixou=1; break; fi
              echo "asset incompleto ($tamanho bytes); nova tentativa"
            fi
            sleep 30
          done
          [ "$baixou" = 1 ] || { echo '::error::nao foi possivel baixar o APK 1.0.140 completo'; exit 1; }
          ls -l build/universal
      - name: Habilitar aceleracao
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Projetor Android TV (leanback, sem toque) com o APK 1.0.140
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: 10.1in WXGA (Tablet)
          disk-size: 4096M
          emulator-boot-timeout: 420
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
            -camera-back none -prop ro.build.characteristics=tv
            -prop ro.hardware.type.television=true
          disable-animations: true
          script: |
            set +e
            bash smartedtv/release/projetor-smoke.sh
            rc=$?
            # trecho do traceback, linha por linha, para leitura exata
            awk 'NR>=330 && NR<=380' build/universal/kodi.log > build/universal/traceback.txt 2>/dev/null || true
            bash tools/kodi/publicar-diag.sh build/universal/traceback.txt || true
            bash tools/kodi/publicar-diag.sh build/universal/resumo-log.txt || true
            bash tools/kodi/publicar-log-inteiro.sh build/universal/kodi.log || true
            bash tools/kodi/publicar-diag.sh build/universal/diag-aparelho.txt || true
            exit $rc
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publicar o resultado do projetor no commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          . kodi/addons/service.smarted.bootstrap/smarted_release.py
          arquivo=build/universal/resumo-log.txt
          [ -s "$arquivo" ] || { echo '::notice::sem resumo para publicar'; exit 0; }
          corpo=$(printf 'Projetor (AVD leanback, APK %s) - run %s\n\n```\n%s\n```\n' \
            "$VERSION_NAME" "$GITHUB_RUN_ID" "$(tail -c 50000 "$arquivo")")
          python3 - "$corpo" <<'PY'
          import json, os, subprocess, sys
          corpo = sys.argv[1]
          proc = subprocess.run(['gh', 'api', '-X', 'POST',
                                 'repos/%s/commits/%s/comments' % (os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']),
                                 '--input', '-'],
                                input=json.dumps({'body': corpo}), text=True,
                                capture_output=True)
          print('::notice::comentario publicado' if proc.returncode == 0
                else '::error::publicacao falhou: ' + (proc.stderr or '')[-300:])
          PY
      - name: Guardar kodi.log e capturas
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: projetor-${{ github.run_id }}
          path: |
            build/universal/kodi.log
            build/universal/kodi-anterior.log
            build/universal/addons-no-aparelho.txt
            build/universal/projetor-home.png
            build/universal/diag-aparelho.txt
            build/universal/resumo-log.txt
            build/universal/logcat.txt
          if-no-files-found: warn
