name: Inspecionar compilação teclado Android
on:
  push:
    branches: [arena/03cbbc5b-kode]
    paths: [.github/workflows/inspect-keyboard-build.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  compare:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kodi-teclado-compilacao-intermediaria
          run-id: 42775900278
          github-token: ${{ github.token }}
          path: candidate
      - name: Baixar APK publicado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.15-smarted-test -R "$GITHUB_REPOSITORY" --pattern 'SMARTED-TV-v1.0.15-arm64-teste.apk' --dir previous
          echo '1cb892b1103a3a42a2ed846825c93ae7075cccf9260b7b451d61c1b23ea827e0  previous/SMARTED-TV-v1.0.15-arm64-teste.apk' | sha256sum -c -
      - name: Comparar pacote, versão, bibliotecas e recursos
        run: |
          python3 -m pip install --quiet pyaxmlparser
          python3 - <<'PY' >compare.txt 2>&1
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import sha256
          from pyaxmlparser import APK
          old = next(Path('previous').glob('*.apk'))
          candidates = list(Path('candidate').rglob('*.apk'))
          print('Candidatos encontrados:', [str(x) for x in candidates])
          for path in candidates:
              print('Candidato:', path.name, 'bytes=', path.stat().st_size, 'sha256=', sha256(path.read_bytes()).hexdigest())
          matches = [p for p in candidates if p.name == 'kodiapp-arm64-v8a-debug.apk']
          assert len(matches) == 1, 'APK ARM64 esperado não encontrado'
          new = matches[0]
          for label, path in [('ANTERIOR', old), ('INTERMEDIÁRIO', new)]:
              p = APK(str(path))
              print(label, 'arquivo=', path.name, 'bytes=', path.stat().st_size,
                    'sha256=', sha256(path.read_bytes()).hexdigest(),
                    'pacote=', p.package, 'versão=', p.version_name, 'versionCode=', p.version_code,
                    'minSdk=', p.get_min_sdk_version(), 'targetSdk=', p.get_target_sdk_version())
          with ZipFile(old) as a, ZipFile(new) as b:
              aa, bb = set(a.namelist()), set(b.namelist())
              only_a, only_b = sorted(aa - bb), sorted(bb - aa)
              changed = sorted(x for x in aa & bb if not x.endswith('/') and sha256(a.read(x)).digest() != sha256(b.read(x)).digest())
              print('Arquivos apenas no anterior:', len(only_a), 'exemplos:', only_a[:3])
              print('Arquivos apenas no intermediário:', len(only_b), 'exemplos:', only_b[:3])
              print('Arquivos diferentes no mesmo caminho:', len(changed), 'exemplos:', changed[:3])
              old_libs = {x for x in aa if x.startswith('lib/') and x.endswith('.so')}
              new_libs = {x for x in bb if x.startswith('lib/') and x.endswith('.so')}
              print('Bibliotecas:', len(old_libs), 'antigas,', len(new_libs), 'novas; somente antigas:', sorted(old_libs - new_libs), '; somente novas:', sorted(new_libs - old_libs))
              for n in ['classes.dex', 'lib/arm64-v8a/libkodi.so', 'system/settings/android.xml', 'assets/system/settings/android.xml']:
                  print(n, 'anterior=', n in aa, 'intermediário=', n in bb)
              lib = 'lib/arm64-v8a/libkodi.so'
              assert lib in bb
              Path('candidate-libkodi.so').write_bytes(b.read(lib))
              for name in ['libc++_shared.so', 'libshairplay.so']:
                  path = 'lib/arm64-v8a/' + name
                  Path('old-' + name).write_bytes(a.read(path))
                  Path('new-' + name).write_bytes(b.read(path))
              Path('old-classes.dex').write_bytes(a.read('classes.dex'))
              Path('new-classes.dex').write_bytes(b.read('classes.dex'))
              for label, z in [('antigo', a), ('novo', b)]:
                  dexfiles = sorted(x for x in z.namelist() if x.startswith('classes') and x.endswith('.dex'))
                  print('DEX', label, ':', dexfiles, 'classe XBMCNativeKeyboard presente em:', [x for x in dexfiles if b'XBMCNativeKeyboard' in z.read(x)])
              Path('old-android.xml').write_bytes(a.read('assets/system/settings/android.xml'))
              Path('new-android.xml').write_bytes(b.read('assets/system/settings/android.xml'))
          PY
          readelf -d candidate-libkodi.so | grep NEEDED >>compare.txt || true
          for lib in 'libc++_shared.so' 'libshairplay.so'; do
            nm -D --undefined-only candidate-libkodi.so | awk '{print $NF}' | sort -u >undef.txt
            nm -D --defined-only "new-$lib" | awk '{print $NF}' | sort -u >new-syms.txt
            nm -D --defined-only "old-$lib" | awk '{print $NF}' | sort -u >old-syms.txt
            comm -12 undef.txt new-syms.txt | comm -23 - old-syms.txt >missing.txt
            echo "Símbolos usados pelo Kodi que estão em $lib novo mas faltam no antigo: $(wc -l < missing.txt)" >>compare.txt
            head -15 missing.txt >>compare.txt
          done
          echo 'Diferença de configuração Android:' >>compare.txt
          diff -u old-android.xml new-android.xml >>compare.txt || true
          DEXDUMP=$(find "$ANDROID_HOME/build-tools" -name dexdump -type f | sort -V | tail -1)
          if [ -n "$DEXDUMP" ]; then
            "$DEXDUMP" -f old-classes.dex | sed -n "s/.*Class descriptor  : '\(.*\)'/\1/p" | sort -u >old-classes.txt
            "$DEXDUMP" -f new-classes.dex | sed -n "s/.*Class descriptor  : '\(.*\)'/\1/p" | sort -u >new-classes.txt
            echo "Classes removidas do dex novo: $(comm -23 old-classes.txt new-classes.txt | wc -l)" >>compare.txt
            comm -23 old-classes.txt new-classes.txt | head -15 >>compare.txt
            echo "Classes adicionadas no dex novo: $(comm -13 old-classes.txt new-classes.txt | wc -l)" >>compare.txt
            comm -13 old-classes.txt new-classes.txt | head -15 >>compare.txt
          else echo 'dexdump ausente' >>compare.txt; fi
      - name: Exibir diagnóstico acessível
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('compare.txt')
          text = p.read_text(errors='replace') if p.exists() else 'Arquivo de diagnóstico não criado.'
          text = text[-60000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice title=Diagnóstico de compatibilidade::' + text)
          PY
