name: "Conferir o APK unificado (artifact, sem recompilar)"

# Este workflow NÃO compila nada: ele pega o APK já gerado (artifact do build do
# monólito) e roda a verificação completa. Serve para iterar a verificação em
# ~1 minuto em vez de esperar 2 h de build a cada ajuste de checagem.

on:
  push:
    branches: [arena/7dedf371-kode]
    paths:
      - .github/workflows/check-apk.yml
      - smartedtv/tools/verify-monolito-apk.py
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: check-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  PACOTE: smartedtv.full
  BASE_MANIFESTO_SHA256: 1447de816a44ecc11c42c2c315cf20e61c9baa037e914a13293711cf152d1ede
  VERSAO: "1.0.80"
  CODIGO: "2103066"

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 1. Achar o artifact mais recente do build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p apk
          ACHOU=""
          # varre os últimos runs do workflow do monólito atrás de um artifact
          for RUN in $(gh api "/repos/${{ github.repository }}/actions/workflows/build-monolith.yml/runs?per_page=10" \
                       --jq '.workflow_runs[] | "\(.id)"' 2>/dev/null); do
            echo "-- run $RUN"
            NOME=$(gh api "/repos/${{ github.repository }}/actions/runs/$RUN/artifacts" \
                    --jq '.artifacts[] | select(.name|startswith("apk-unificado")) | .name' 2>/dev/null | head -1)
            [ -n "$NOME" ] || { echo "   sem artifact"; continue; }
            echo "   artifact: $NOME"
            # só interessa o artifact DESTA versão: reconferir um APK antigo com
            # o verificador novo gerava relatório falso (tudo "FALHA")
            if [ "$NOME" != "apk-unificado-$VERSAO" ]; then
              echo "   artifact de outra versão ($NOME), ignorado"
              continue
            fi
            if gh run download "$RUN" -n "$NOME" -D apk 2>/dev/null; then
              ACHOU="$RUN"; echo "RUN_ID=$RUN" >> "$GITHUB_ENV"
              break
            fi
            echo "   download falhou"
          done
          if [ -z "$ACHOU" ]; then
            echo "::error::nenhum artifact de APK encontrado nos ultimos runs"
            ls -R apk || true
            exit 1
          fi
          find apk -type f | head -20
          APK=$(find apk -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::artifact sem APK"; exit 1; }
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: 2. Verificar o APK (relatório completo)
        run: |
          set -o pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT2=$(ls -d "$SDK"/build-tools/*/ 2>/dev/null | sort -V | tail -1)aapt2
          echo "aapt2: $AAPT2"
          # stdout E stderr no relatorio: um traceback tambem precisa aparecer
          set +e
          python3 smartedtv/tools/verify-monolito-apk.py "$APK" \
            --aapt2 "$AAPT2" \
            --pacote "$PACOTE" --versao "$VERSAO" --codigo "$CODIGO" \
            --manifesto-base-sha "$BASE_MANIFESTO_SHA256" \
            --relatorio "$RUNNER_TEMP/verificacao.txt" > "$RUNNER_TEMP/saida.txt" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/saida.txt"
          if [ ! -s "$RUNNER_TEMP/verificacao.txt" ]; then
            cp "$RUNNER_TEMP/saida.txt" "$RUNNER_TEMP/verificacao.txt"
          fi
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "sha256: $SHA"
          {
            echo "# Verificação do APK único — $VERSAO"
            echo
            echo "artifact do run $RUN_ID (conferência sem recompilar)"
            echo
            echo '```'
            echo "sha256: $SHA"
            echo "tamanho: $(stat -c%s "$APK") bytes"
            echo '```'
            echo
            echo '```'
            cat "$RUNNER_TEMP/verificacao.txt" 2>/dev/null || echo '(relatorio vazio)'
            echo '```'
          } > docs/verificacao-apk.txt
          git config user.name "smarted-bot"
          git config user.email "smarted-bot@users.noreply.github.com"
          git add -f docs/verificacao-apk.txt
          git commit -m "ci: conferencia do APK $VERSAO pelo artifact (run $RUN_ID)" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true

          if [ "$RC" -ne 0 ]; then
            echo "::error::conferencia reprovou o APK do run $RUN_ID"
            exit "$RC"
          fi

          # conferência limpa: publica a release, se ela ainda não existir
          # (o build pode ter morrido num passo anterior só por causa da
          #  própria conferência — o APK já está pronto e assinado)
          TAG="v${VERSAO}-unificado"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG já existe; nada a publicar"
            exit 0
          fi
          APK_NOME="SMARTEDTV-${VERSAO}-unificado-arm64-v8a.apk"
          cp "$APK" "$APK_NOME"
          sha256sum "$APK_NOME" > "$APK_NOME.sha256"
          {
            echo "# SMARTEDTV $VERSAO — APK ÚNICO (arm64-v8a)"
            echo
            echo "Um arquivo só, pacote \`$PACOTE\`: player completo, anúncios do AdMob"
            echo "dentro do app, catálogo e a base da linha clássica restaurada"
            echo "(perfil semeado com skin, menus e Brazuca Play configurado)."
            echo
            echo "## Splash"
            echo
            echo "Barra de progresso branca, sem textos, logo widescreen centralizada."
            echo
            echo "## Instalação"
            echo
            echo "Instale este APK. Pacote \`$PACOTE\` — convive com o \`org.xbmc.kodi\` antigo."
            echo "Na primeira abertura o app instala o perfil da base e abre a skin SMARTEDTV."
            echo
            echo "Verificação automática do APK (aapt2 + dex + assets): 0 falhas."
            echo "sha256 e tamanho estão no arquivo .sha256 ao lado do APK."
          } > notas.md
          gh release create "$TAG" --title "SMARTEDTV $VERSAO (APK unico, arm64)" \
            --notes-file notas.md --target "$GITHUB_SHA"
          gh release upload "$TAG" "$APK_NOME" "$APK_NOME.sha256"
          gh release view "$TAG" --json assets -q '.assets[] | "\(.name) \(.size) bytes"'
        env:
          GH_TOKEN: ${{ github.token }}
