name: Testar candidato de teclado em emulador
on:
  push:
    branches: [arena/03cbbc5b-kode]
    paths: [.github/workflows/test-keyboard-emulator.yml]
permissions:
  actions: read
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smarted-teclado-nao-assinado
          run-id: 42785178774
          github-token: ${{ github.token }}
          path: candidate
      - name: Habilitar aceleração do emulador
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Assinar somente para o emulador isolado
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.jks" -alias debug -dname 'CN=Temporary Debug' -keyalg RSA -keysize 2048 -validity 2 -storepass android -keypass android
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/debug.jks" --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/debug.apk" candidate/aligned.apk
      - name: Inicializar e examinar o aplicativo
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
          disable-animations: true
          script: |
            set -e
            echo "::notice title=ABI do emulador::$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"
            adb install -g "$RUNNER_TEMP/debug.apk"
            adb logcat -c
            adb shell appops set org.xbmc.kodi MANAGE_EXTERNAL_STORAGE allow || true
            printf '%s\n' '<keymap><global><keyboard><f4>ActivateWindow(addonbrowser,addons://search/,return)</f4></keyboard></global></keymap>' > "$RUNNER_TEMP/test-keymap.xml"
            adb root || true
            adb wait-for-device
            adb shell mkdir -p /sdcard/Android/data/org.xbmc.kodi/files/.kodi/userdata/keymaps > "$RUNNER_TEMP/adb-mkdir.txt" 2>&1 || true
            adb push "$RUNNER_TEMP/test-keymap.xml" /sdcard/Android/data/org.xbmc.kodi/files/.kodi/userdata/keymaps/test-keymap.xml > "$RUNNER_TEMP/adb-push.txt" 2>&1 || true
            UID_APP=$(adb shell cmd package list packages -U org.xbmc.kodi | sed -n 's/.*uid:\([0-9]*\).*/\1/p' | head -1 | tr -d '\r')
            echo "::notice title=UID do aplicativo::${UID_APP:-não encontrado}"
            if [ -n "$UID_APP" ]; then adb shell chown -R "$UID_APP:$UID_APP" /data/media/0/Android/data/org.xbmc.kodi/files/.kodi > "$RUNNER_TEMP/chown.txt" 2>&1 || true; fi
            adb shell chmod -R a+rX /data/media/0/Android/data/org.xbmc.kodi/files/.kodi >> "$RUNNER_TEMP/adb-push.txt" 2>&1 || true
            adb shell su "$UID_APP" -c 'cat /sdcard/Android/data/org.xbmc.kodi/files/.kodi/userdata/keymaps/test-keymap.xml' > "$RUNNER_TEMP/keymap-access.txt" 2>&1 || true
            python3 -c "import os; from pathlib import Path; d=Path(os.environ['RUNNER_TEMP']); t=(d/'adb-mkdir.txt').read_text()+(d/'adb-push.txt').read_text()+(d/'keymap-access.txt').read_text(); print('::notice title=Preparação do atalho::'+t.replace('%','%25').replace('\\n','%0A'))"
            adb shell am start -n org.xbmc.kodi/.Splash
            sleep 30
            adb shell input keyevent 66
            sleep 120
            adb logcat -d -v brief > "$RUNNER_TEMP/logcat.txt"
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' | tr '\n' ' ' | sed 's/^/::notice title=Janela em foco::/'
            adb exec-out screencap -p > "$RUNNER_TEMP/screen.png"
            tesseract "$RUNNER_TEMP/screen.png" stdout 2>/dev/null > "$RUNNER_TEMP/screen.txt" || true
            python3 -c "import os; from pathlib import Path; t=(Path(os.environ['RUNNER_TEMP'])/'screen.txt').read_text(errors='replace'); print('::notice title=Texto na tela::'+t[-2000:].replace('%','%25').replace('\\n','%0A'))"
            grep -E -i 'org.xbmc.kodi|kodi|FATAL EXCEPTION|UnsatisfiedLinkError|NoClassDefFoundError|native bridge' "$RUNNER_TEMP/logcat.txt" | head -35 > "$RUNNER_TEMP/kodi-log.txt" || true
            python3 -c "import os; from pathlib import Path; t=(Path(os.environ['RUNNER_TEMP'])/'kodi-log.txt').read_text(errors='replace'); print('::notice title=Log Kodi::'+t[-3500:].replace('%','%25').replace('\\n','%0A'))"
            adb shell ps -A | grep -i kodi | tr '\n' ' ' | sed 's/^/::notice title=Processos Kodi::/' || true
            adb shell input keyevent 134
            sleep 15
            adb exec-out screencap -p > "$RUNNER_TEMP/search.png"
            tesseract "$RUNNER_TEMP/search.png" stdout 2>/dev/null > "$RUNNER_TEMP/search.txt" || true
            python3 -c "import os; from pathlib import Path; t=(Path(os.environ['RUNNER_TEMP'])/'search.txt').read_text(errors='replace'); print('::notice title=Tela após busca::'+t[-2000:].replace('%','%25').replace('\n','%0A'))"
            adb shell uiautomator dump /sdcard/window.xml >/dev/null || true
            adb shell cat /sdcard/window.xml > "$RUNNER_TEMP/window.xml" || true
            python3 -c "import os; from pathlib import Path; t=(Path(os.environ['RUNNER_TEMP'])/'window.xml').read_text(errors='replace'); print('::notice title=Hierarquia de entrada::'+t[-3500:].replace('%','%25').replace('\n','%0A'))"
            adb shell 'find /sdcard/Android/data/org.xbmc.kodi/files /data/user/0/org.xbmc.kodi/files -iname kodi.log -o -iname test-keymap.xml 2>/dev/null' > "$RUNNER_TEMP/paths.txt" || true
            python3 -c "import os; from pathlib import Path; t=(Path(os.environ['RUNNER_TEMP'])/'paths.txt').read_text(errors='replace'); print('::notice title=Caminhos Kodi::'+t.replace('%','%25').replace('\\n','%0A'))"
            adb shell cat /sdcard/Android/data/org.xbmc.kodi/files/.kodi/temp/kodi.log > "$RUNNER_TEMP/kodi-native.log" 2>/dev/null || true
            grep -Ei 'keymap|userdata|key.?board|special://|error|search' "$RUNNER_TEMP/kodi-native.log" | tail -35 > "$RUNNER_TEMP/native-filter.txt" || true
            python3 -c "import os; from pathlib import Path; t=(Path(os.environ['RUNNER_TEMP'])/'native-filter.txt').read_text(errors='replace'); print('::notice title=Log interno do Kodi::'+t[-3500:].replace('%','%25').replace('\\n','%0A'))"
            adb logcat -d -v brief | grep -E 'XBMCNativeKeyboard|FATAL EXCEPTION|UnsatisfiedLinkError|NoClassDefFoundError' | tail -25 > "$RUNNER_TEMP/keyboard-log.txt" || true
            python3 -c "import os; from pathlib import Path; t=(Path(os.environ['RUNNER_TEMP'])/'keyboard-log.txt').read_text(errors='replace'); print('::notice title=Log do teclado::'+t[-3500:].replace('%','%25').replace('\n','%0A'))"
            grep -E -i 'FATAL EXCEPTION|UnsatisfiedLinkError|NoClassDefFoundError|AndroidRuntime|XBMCNativeKeyboard' "$RUNNER_TEMP/logcat.txt" | tail -20 > "$RUNNER_TEMP/errors.txt" || true
            python3 -c "import os; from pathlib import Path; p=Path(os.environ['RUNNER_TEMP'])/'errors.txt'; t=p.read_text(errors='replace') or 'Nenhuma falha JNI/Java encontrada no log filtrado.'; print('::notice title=Log filtrado::'+t[-3500:].replace('%','%25').replace('\\n','%0A'))"
            grep -q "XBMCNativeKeyboard.show" "$RUNNER_TEMP/keyboard-log.txt"
            grep -q "android.widget.EditText" "$RUNNER_TEMP/window.xml"
      - name: Diagnóstico do emulador
        if: failure()
        run: echo '::notice title=Diagnóstico::O emulador não validou o aplicativo. Verifique ABI, inicialização e logs antes de criar uma atualização.'
