name: Diagnostico 9 (laudo das classes de anuncio no repo)

on:
  push:
    branches: [arena/5c219515-kode]
    paths: [.github/workflows/diag-anuncios9.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspecionar:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Baixar base v22 e desmontar
        run: |
          set -euo pipefail
          mkdir -p build/diag
          gh release download v1.0.87-universal-v22 -R "$GITHUB_REPOSITORY" \
            --pattern SMARTEDTV-universal.apk --dir build/diag --clobber
          mv build/diag/SMARTEDTV-universal.apk build/diag/base.apk
          cd build/diag
          unzip -o -q base.apk 'classes*.dex'
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          echo "TOOLS=$TOOLS" >> "$GITHUB_ENV"
          for dex in classes*.dex; do
            "$TOOLS/dexdump" -d "$dex" > "dump-$dex.txt" || true
          done
          ls -l dump-*.txt
      - name: Gerar laudo
        run: |
          set +e
          cd build/diag
          python3 - <<'PY'
          import glob, os, re
          alvos = ('Lsmartedtv/full/AdTela;', 'Lsmartedtv/full/PreRollActivity;',
                   'Lsmartedtv/full/AppOpenActivity;', 'Lsmartedtv/full/SmartAds;',
                   'Lsmartedtv/full/PreRollActivity$1;', 'Lsmartedtv/full/AppOpenActivity$1;')
          por_classe = {}
          for caminho in glob.glob('dump-*.txt'):
              atual = None
              for linha in open(caminho, errors='replace'):
                  m = re.search(r"Class descriptor\s*:\s*'(L[^']+)'", linha)
                  if m:
                      atual = m.group(1)
                      continue
                  if atual in alvos:
                      por_classe.setdefault(atual, []).append(linha.rstrip())
          saida = []
          for classe in sorted(por_classe):
              linhas = por_classe[classe]
              texto = '\n'.join(linhas)
              nome = classe.split('/')[-1].rstrip(';')
              if '$' in nome:
                  continue
              saida.append('=' * 70)
              saida.append('CLASSE %s (%d linhas de dump)' % (nome, len(linhas)))
              strs = [s for s in dict.fromkeys(re.findall(r'const-string(?:/jumbo)? v\d+, "(.*?)"', texto)) if s]
              saida.append('-- STRINGS (%d) --' % len(strs))
              saida.extend('  ' + s for s in strs)
              saida.append('-- CHAMADAS getStringExtra/getExtra/getInt --')
              for chamada in dict.fromkeys(re.findall(r'invoke-[a-z/]+\s+\{[^}]*\},\s+(Landroid/content/Intent;[^)\n]*)', texto)):
                  saida.append('  ' + chamada)
              saida.append('-- CHAMADAS DO SDK --')
              for chamada in dict.fromkeys(re.findall(r'invoke-[a-z/]+\s+\{[^}]*\},\s+(Lcom/google/android/gms/ads[^;]*;\.[A-Za-z0-9_$<>]+)', texto)):
                  saida.append('  ' + chamada)
              saida.append('-- CAMPOS/CONSTANTES --')
              for campo in dict.fromkeys(re.findall(r'(?:sget-object|iget(?:-object|-boolean)?) v\d+, v\d+, (L[^;]+;->\w+:\S+)', texto)):
                  saida.append('  ' + campo)
              saida.append('')
          os.makedirs('../../docs', exist_ok=True)
          open('../../docs/diag-ads-java.txt', 'w').write('\n'.join(saida))
          print('linhas do laudo:', len(saida))
          PY
          wc -l ../../docs/diag-ads-java.txt
      - name: Publicar laudo no repositorio
        run: |
          set -euo pipefail
          git config user.name 'SMARTEDTV Build'
          git config user.email 'ci@smarted.local'
          git add docs/diag-ads-java.txt
          git commit -m 'diag: laudo das classes Java de anuncio (extras e unidades)' || echo 'sem mudanca'
          git push
