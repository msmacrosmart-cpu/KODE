name: Build APK (SmartED-TV)

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Criar GitHub Release com o APK'
        type: boolean
        default: false
      version_name:
        description: 'Versão (ex: 1.0.2). Vazio = usa a tag ou o run number'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  COMPILE_SDK: '35'
  BUILD_TOOLS: '35.0.0'
  GRADLE_VERSION: '8.10.2'
  # minSdk usado na assinatura (precisa bater com app/build.gradle.kts)
  MIN_SDK: '21'

jobs:
  build:
    name: Assemble Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─── AMBIENTE ───────────────────────────────────────────────────
      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: true

      - name: Ambiente via script do repo (instala tudo que faltar)
        run: |
          chmod +x tools/scripts/*.sh gradlew
          bash tools/scripts/setup-android-env.sh --no-sudo

      # ─── CHAVE DE ASSINATURA (uma só para debug e release) ──────────
      # Garante que a assinatura seja sempre a mesma:
      #  • v1 (JAR) habilitada → instala em Android 4.4–6 / TV Boxes antigas
      #  • v2 + v3 habilitadas → Android 7+
      - name: Gerar keystore e chave de assinatura
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "[+] Usando keystore dos secrets"
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release-keystore.jks
          else
            echo "[+] Gerando keystore (RSA 2048, validade 30 anos)"
            keytool -genkeypair \
              -keystore release-keystore.jks \
              -alias smartedtv \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass smartedtv123 -keypass smartedtv123 \
              -dname "CN=SmartED-TV, OU=SmartED, O=SmartED-TV, L=Sao Paulo, S=SP, C=BR"
          fi
          keytool -list -v -keystore release-keystore.jks -storepass smartedtv123 | grep -E "Alias|Valid|Signature algorithm|SHA256" || true

      - name: Checagem do ambiente
        run: |
          java -version
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --version
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      # ─── TESTES DE UNIDADE (JVM) ────────────────────────────────────
      - name: Testes de unidade (classificador + parsers + zip/addon)
        run: |
          # Relatório HTML/XML legível (não só a saída do console)
          set -o pipefail
          gradle --no-daemon --console=plain test --continue 2>&1 | tee /tmp/test.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::group::Falhas de teste"
            for f in $(find app/build/test-results -name "TEST-*.xml"); do
              echo "--- $f"
              grep -oE '<testcase name="[^"]*"|<failure[^>]*message="[^"]*"' "$f" || true
            done
            echo "::endgroup::"
            exit 1
          fi

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 30

      # ─── BUILD ──────────────────────────────────────────────────────
      # Usa o Gradle do runner (não depende do gradle-wrapper.jar do repo).
      - name: Build APK (release universal + ABI + debug de teste)
        env:
          VERSION_NAME: ${{ github.event.inputs.version_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: release-keystore.jks
          KEYSTORE_PASSWORD: smartedtv123
          KEY_ALIAS: smartedtv
          KEY_PASSWORD: smartedtv123
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain \
            assembleRelease assembleDebug 2>&1 | tee /tmp/build.log

      - name: Publicar log do build (só em falha, para diagnóstico)
        if: failure()
        run: |
          set -e
          {
            grep -E "^e: |error:|FAILED|What went wrong" /tmp/build.log 2>/dev/null | head -100
          } > ci-build.log || true
          # detalhes dos testes: XMLs do JUnit (message = erro esperado vs obtido)
          find app/build/test-results -name "*.xml" -print 2>/dev/null | while read -r x; do
            echo "### $x"
            grep -hoE 'testcase name="[^"]*"|<failure[^>]*message="[^"]*"' "$x" 2>/dev/null | head -80
          done >> ci-build.log || true
          if [ ! -s ci-build.log ]; then
            { tail -c 60000 /tmp/test.log 2>/dev/null; tail -c 60000 /tmp/build.log 2>/dev/null; } > ci-build.log || true
          fi
          git config user.name  "SmartED CI"
          git config user.email "ci@smarted.local"
          git add -f ci-build.log
          git commit -m "ci: log do build (diagnóstico) [skip ci]" || true
          # branch por execução (nunca conflita) + branch fixa para conveniência
          git push -f origin "HEAD:refs/heads/ci-log-${GITHUB_RUN_ID}" || true
          git push -f origin "HEAD:refs/heads/ci-logs" || true

      # ─── ASSINATURA EXPLÍCITA + VERIFICAÇÃO ─────────────────────────
      - name: Limpar log de diagnóstico (build passou)
        run: |
          rm -f ci-build.log
          git rm --cached -q ci-build.log 2>/dev/null || true
          git config user.name  "SmartED CI"
          git config user.email "ci@smarted.local"
          git commit -m "ci: build OK, remove log de diagnóstico [skip ci]" >/dev/null 2>&1 || true
          git push origin "HEAD:${GITHUB_REF_NAME}" >/dev/null 2>&1 || true

      - name: Assinar (v1+v2+v3), verificar e renomear APKs
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "[+] build-tools: $BT"

          VERSION="${{ github.event.inputs.version_name }}"
          if [ -z "$VERSION" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then VERSION="${GITHUB_REF#refs/tags/v}"; else VERSION="build-${{ github.run_number }}"; fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          mkdir -p dist
          sign_one() {  # $1=apk de entrada  $2=nome de saída
            local in="$1" out="dist/$2"
            "$BT"/zipalign -f -p 4 "$in" /tmp/aligned.apk
            "$BT"/apksigner sign \
              --ks release-keystore.jks --ks-key-alias smartedtv \
              --ks-pass pass:smartedtv123 --key-pass pass:smartedtv123 \
              --min-sdk-version "$MIN_SDK" \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --out "$out" /tmp/aligned.apk
            echo "── $out"
            "$BT"/apksigner verify --verbose --print-certs "$out" | sed 's/^/    /'
            ("$BT"/aapt2 dump badging "$out" 2>/dev/null || "$BT"/aapt dump badging "$out" 2>/dev/null || true) | grep -E "^(package|sdkVersion|targetSdkVersion|native-code)" | sed 's/^/    /' || true
          }

          REL=app/build/outputs/apk/release
          # APK universal (instala em qualquer aparelho, recomendado)
          sign_one "$REL/app-universal-release.apk" "SmartED-TV-$VERSION-universal.apk"
          # Variantes por ABI (menores, para TV Box antigas com pouco armazenamento)
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            if [ -f "$REL/app-$abi-release.apk" ]; then
              sign_one "$REL/app-$abi-release.apk" "SmartED-TV-$VERSION-$abi.apk"
            fi
          done
          # Debug (mesma chave) — útil para testar quando o release não instala
          for dbg in app/build/outputs/apk/debug/app-universal-debug.apk app/build/outputs/apk/debug/app-debug.apk; do
            if [ -f "$dbg" ]; then
              cp "$dbg" "dist/SmartED-TV-$VERSION-debug.apk"
              break
            fi
          done

          # Corpo da release
          UNI="dist/SmartED-TV-$VERSION-universal.apk"
          {
            echo "APK do **SmartED-TV** (Android TV / TV Box) — versão \`$VERSION\` (versionCode ${{ github.run_number }})."
            echo
            echo "### 📥 Qual arquivo baixar?"
            echo "| Arquivo | Quando usar |"
            echo "|---|---|"
            echo "| \`SmartED-TV-$VERSION-universal.apk\` | **Recomendado** — instala em qualquer TV Box/celular |"
            echo "| \`SmartED-TV-$VERSION-armeabi-v7a.apk\` | TV Box 32 bits (mais leve) |"
            echo "| \`SmartED-TV-$VERSION-arm64-v8a.apk\` | TV Box/celular 64 bits (mais leve) |"
            echo "| \`SmartED-TV-$VERSION-debug.apk\` | Teste, se o release der \"pacote inválido\" |"
            echo
            echo "### 🔎 Verificação"
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Package | \`com.smarted.tv\` |"
            echo "| Tamanho (universal) | $(du -h "$UNI" | cut -f1) |"
            echo "| SHA-256 (universal) | \`$(sha256sum "$UNI" | cut -d' ' -f1)\` |"
            echo "| minSdk / targetSdk | $MIN_SDK / 34 |"
            echo "| Assinatura | v1 (JAR) + v2 + v3 |"
            echo
            echo '```'
            { "$BT"/aapt2 dump badging "$UNI" 2>/dev/null || "$BT"/aapt dump badging "$UNI" 2>/dev/null; } | grep -E "^(package|sdkVersion|targetSdkVersion|launchable-activity|native-code)" || true
            echo '```'
            echo
            echo "**Instalar:** \`adb install -r SmartED-TV-$VERSION-universal.apk\`"
          } > release-body.md

          ls -lh dist/*.apk
          cat release-body.md

      - name: Upload APKs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SmartED-TV-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      # ─── RELEASE ────────────────────────────────────────────────────
      - name: Criar / atualizar GitHub Release
        # Publica release quando: push de tag v*  OU  execução manual com create_release=true
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (github.event.inputs.version_name != '' && format('v{0}', github.event.inputs.version_name) || format('v{0}', github.run_number)) }}
          name: SmartED-TV ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (github.event.inputs.version_name != '' && format('v{0}', github.event.inputs.version_name) || format('build {0}', github.run_number)) }}
          files: 'dist/*.apk'
          generate_release_notes: true
          make_latest: true
          body_path: release-body.md
