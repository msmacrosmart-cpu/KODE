name: Build APK (SmartED-TV)

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Criar GitHub Release com o APK'
        type: boolean
        default: true
      version_name:
        description: 'Versão (ex: 1.0.1). Vazio = usa o run number'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Android SDK pré-instalado no runner do GitHub Actions
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  COMPILE_SDK: '35'
  BUILD_TOOLS: '35.0.0'
  GRADLE_VERSION: '8.10.2'

jobs:
  build:
    name: Assemble Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─── AMBIENTE ───────────────────────────────────────────────────
      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: true

      - name: Ambiente via script do repo (instala tudo que faltar)
        run: |
          chmod +x tools/scripts/*.sh gradlew
          bash tools/scripts/setup-android-env.sh --no-sudo

      - name: Checagem do ambiente
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          command -v gradle && gradle --version
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      # ─── BUILD ──────────────────────────────────────────────────────
      # Usa o Gradle do runner (já instalado acima) — não depende do
      # gradle-wrapper.jar, evitando falha de wrapper corrompido.
      - name: Build release APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain assembleRelease 2>&1 | tee /tmp/build.log

      - name: Publicar log do build (só em falha, para diagnóstico)
        if: failure()
        run: |
          set -e
          cp /tmp/build.log ci-build.log || true
          git config user.name  "SmartED CI"
          git config user.email "ci@smarted.local"
          git add -f ci-build.log
          git commit -m "ci: log do build (diagnóstico) [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true

      # ─── ASSINATURA ─────────────────────────────────────────────────
      - name: Assinatura (apksigner) e verificação
        run: |
          set -euo pipefail
          OUT=app/build/outputs/apk/release
          APK=$OUT/app-release.apk
          UNSIGNED=$OUT/app-release-unsigned.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "[+] build-tools: $BT"

          if [ ! -f "$APK" ] && [ -f "$UNSIGNED" ]; then
            echo "[+] Assinando APK manualmente (zipalign + apksigner)"
            keytool -genkeypair -keystore release-keystore.jks -alias smartedtv \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass smartedtv123 -keypass smartedtv123 \
              -dname "CN=SmartED-TV, OU=SmartED, O=SmartED-TV, L=Sao Paulo, S=SP, C=BR"
            "$BT"/zipalign -f -p 4 "$UNSIGNED" "$APK"
            "$BT"/apksigner sign --ks release-keystore.jks --ks-key-alias smartedtv \
              --ks-pass pass:smartedtv123 --key-pass pass:smartedtv123 \
              --in "$APK" --out "$APK.signed"
            mv "$APK.signed" "$APK"
          fi

          test -f "$APK"
          "$BT"/apksigner verify --print-certs "$APK" || true

          VERSION="${{ github.event.inputs.version_name }}"
          [ -z "$VERSION" ] && VERSION="build-${{ github.run_number }}"
          cp "$APK" "SmartED-TV-$VERSION.apk"
          echo "APK_NAME=SmartED-TV-$VERSION.apk" >> "$GITHUB_ENV"
          ls -lh *.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SmartED-TV-apk
          path: '*.apk'
          if-no-files-found: error
          retention-days: 90

      # ─── RELEASE ────────────────────────────────────────────────────
      - name: Criar / atualizar GitHub Release
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release != 'false')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', github.run_number) }}
          name: SmartED-TV ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build {0}', github.run_number) }}
          files: '*.apk'
          generate_release_notes: true
          make_latest: true
          body: |
            APK de release do **SmartED-TV** (Android TV / TV Box).

            **Download direto:** clique no arquivo `.apk` em **Assets** abaixo.

            Instalação no dispositivo:
            ```
            adb install -r SmartED-TV-*.apk
            ```
