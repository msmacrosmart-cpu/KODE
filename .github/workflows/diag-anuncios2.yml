name: Diagnostico 2 dos anuncios

on:
  push:
    branches: [arena/5c219515-kode]
    paths: [.github/workflows/diag-anuncios2.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Baixar base v22
        run: |
          set -euo pipefail
          mkdir -p build/diag
          gh release download v1.0.87-universal-v22 -R "$GITHUB_REPOSITORY" \
            --pattern SMARTEDTV-universal.apk --dir build/diag --clobber
          mv build/diag/SMARTEDTV-universal.apk build/diag/base.apk
      - name: Manifesto, metadata e classes de anuncio
        run: |
          set -euo pipefail
          cd build/diag
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$TOOLS/aapt" dump xmltree base.apk --file AndroidManifest.xml > manifest.txt
          unzip -o -q base.apk 'classes*.dex'
          cat classes*.dex > todos.dex
          n() { local linha; linha=$(printf '%s' "$1" | tr -d '\r' | cut -c1-900); [ -n "$linha" ] && echo "::notice::DIAG2 $linha"; }
          n "APPID-LINHA: $(grep -A2 'gms.ads.APPLICATION_ID' manifest.txt | tr '\n' ' ' | tr -s ' ')"
          n "ACTIVITIES: $(grep -oE 'smartedtv\.full\.[A-Za-z]*Ad[A-Za-z]*|smartedtv\.full\.(PreRoll|AppOpen)[A-Za-z]*' manifest.txt | sort -u | tr '\n' ' ')"
          n "TESTE-IDS: $(strings -n 6 todos.dex | grep -c '3940256099942544')"
          n "CLASSE-ADTELA: $(strings -n 5 todos.dex | grep -cE 'AdTela')"
          n "CLASSE-LICENCA: $(strings -n 5 todos.dex | grep -cE 'Lsmartedtv/full/Licenca;')"
          n "MSG-ADS: $(strings -n 8 todos.dex | grep -Ei 'anuncio|AdMob|interstic' | grep -vE '^L' | head -12 | tr '\n' '|')"
          n "ARQ-ADS: $(strings -n 6 todos.dex | grep -Ei '(ads|anuncio)[a-z_.-]*\.(txt|json|cfg)' | sort -u | head -8 | tr '\n' ' ')"
          n "GMS-VERSAO: $(strings -n 6 todos.dex | grep -oE 'com\.google\.android\.gms\.ads@[0-9.]+' | sort -u | head -3 | tr '\n' ' ')"
          n "UNIDADES: $(strings -n 6 todos.dex | grep -oE 'ca-app-pub-[0-9]+/[0-9]+' | sort -u | tr '\n' ' ')"
      - name: Guardar laudo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag2-${{ github.run_id }}
          path: build/diag/*.txt
          if-no-files-found: warn
