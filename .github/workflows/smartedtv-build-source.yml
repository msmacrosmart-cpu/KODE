name: SMARTEDTV - compilar do código-fonte (arm64)

# Compila o Kodi 21.3-Omega do código-fonte para Android arm64-v8a, aplica a
# identidade SMARTEDTV (versão.txt + strings + mídia oficiais) e publica o APK.
#
# Este é o build "de verdade": `make apk` compila libkodi.so e empacota tudo com
# Gradle. O tempo típico é ~65 min em ubuntu-22.04 (medido no run 42775900278,
# que compilou o mesmo Kodi 21.3 com um patch de teclado).

on:
  workflow_dispatch:
    inputs:
      publicar_release:
        description: 'Publicar o APK como release (precisa da chave do repositório)'
        type: boolean
        default: false
  push:
    branches: [arena/2e3d223d-kode]
    paths:
      - .github/workflows/smartedtv-build-source.yml
      - smartedtv/**

permissions:
  contents: write

concurrency:
  group: smartedtv-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  arm64:
    name: Kodi 21.3-Omega -> SMARTEDTV arm64-v8a
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: 1. JDK 17 (mesmo do build de referência)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 2. Libertar espaço em disco
        # O runner padrão já vem com ~63 GB de 73 GB ocupados (imagens do SDK
        # pré-instalado, .NET, Haskell, Docker, etc.). As dependências do Kodi
        # consomem ~8 GB e a árvore de build mais ~6 GB — sem esta limpeza o
        # runner chega a 98% e o build falha por falta de espaço.
        run: |
          echo "== antes =="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2[5-9]* \
            /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/system-images \
            /usr/share/swift /opt/microsoft /opt/google/chrome \
            /usr/lib/firefox* /opt/az 2>/dev/null || true
          sudo apt-get clean
          docker image prune -af 2>/dev/null || true
          echo "== depois =="; df -h /

      - name: 3. Dependências de sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake bison build-essential curl flex \
            gawk git gperf lib32stdc++6 lib32z1 lib32z1-dev libcurl4-openssl-dev unzip \
            zip zlib1g-dev libtool pkg-config cmake

      - name: 4. SDK/NDK exatos do Kodi 21.3
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-34' 'build-tools;33.0.1' 'ndk;21.4.7075529'
          echo "ndk: $(ls "$ANDROID_SDK_ROOT/ndk")"

      - name: 5. Artefatos de identidade a partir das artes oficiais
        run: |
          python3 -m pip install --quiet --disable-pip-version-check 'Pillow==11.3.0' \
            'pyaxmlparser==0.3.31'
          python3 smartedtv/tools/make-brand-assets.py
          ls -l smartedtv/out/media | head

      - name: 6. Idioma pt-BR oficial (repo-resources) para embarcar
        run: |
          set -euo pipefail
          mkdir -p smartedtv/build/lang
          curl -fsSL -o /tmp/res.zip \
            https://codeload.github.com/xbmc/repo-resources/zip/refs/heads/omega
          unzip -q /tmp/res.zip -d /tmp/res
          cp -a /tmp/res/repo-resources-omega/resource.language.pt_br smartedtv/build/lang/
          grep -c 'msgid' smartedtv/build/lang/resource.language.pt_br/resources/strings.po

      - name: 7. Kodi 21.3-Omega + identidade SMARTEDTV
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 21.3-Omega https://github.com/xbmc/xbmc.git \
            smartedtv/build/kodi-21.3-Omega
          cd smartedtv/build/kodi-21.3-Omega
          test "$(git rev-parse HEAD)" = 'a3a448d26b8d560a65655dab2cd122994dc4e146'
          cd -
          python3 smartedtv/tools/patch-source.py smartedtv/build/kodi-21.3-Omega \
            --brand-dir smartedtv/out \
            --language-addon smartedtv/build/lang/resource.language.pt_br

      - name: 8. Dependências Android (tools/depends)
        run: ./smartedtv/tools/build-apk.sh
        env:
          JOBS: 4
          SKIP_BRAND: '1'      # passo 6 já aplicou a identidade
          KODI_SRC: ${{ github.workspace }}/smartedtv/build/kodi-21.3-Omega

      - name: 9. Guardar APK e relatório
        uses: actions/upload-artifact@v4
        with:
          name: smartedtv-apk-arm64
          path: |
            smartedtv/build/out/*.apk
            smartedtv/build/out/*.sha256
            smartedtv/build/out/build-report.txt
            smartedtv/build/env-report.txt
          retention-days: 14
          if-no-files-found: error

      - name: 10. Publicar release com o APK
        # Publica sempre que o build der certo. Este é o mesmo método já usado
        # pelos workflows de release deste repositório (gh release create), e é
        # o que permite baixar o APK direto pelo GitHub, sem intermediários.
        # Para desativar numa execução manual, use publicar_release=false.
        if: github.event_name == 'push' || inputs.publicar_release != false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=$(ls smartedtv/build/out/*.apk | head -1)
          SHA=$(ls smartedtv/build/out/*.sha256 | head -1)
          VER=$(python3 - <<'EOF'
          import re, pathlib
          t = pathlib.Path('smartedtv/build/out/build-report.txt').read_text() \
              if pathlib.Path('smartedtv/build/out/build-report.txt').exists() else ''
          m = re.search(r'vers[aã]o:\s*(\d+\.\d+\.\d+)', t, re.I)
          print(m.group(1) if m else '21.4.0')
          EOF
          )
          TAG="smartedtv-v${VER}-arm64"
          NOTES="SMARTEDTV ${VER} — APK compilado do código-fonte do Kodi 21.3-Omega (commit a3a448d2).

          - ABI: arm64-v8a (Android 5+)
          - Application ID: org.xbmc.kodi (preservado)
          - Assinatura: chave de teste smarted-tv-test (NÃO atualiza o Kodi oficial)
          - Sem add-ons de conteúdo, sem skin Nova TV, sem perfil pré-configurado
          - SHA-256 no arquivo .sha256 anexado

          Documentação: smartedtv/DOCUMENTACAO/ (integridade, testes, ambiente)."
          echo "::notice::publicando release $TAG com $(basename "$APK")"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SHA" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" "$SHA" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SMARTEDTV ${VER} (arm64-v8a)" \
              --notes "$NOTES"
          fi
          echo "::notice::link: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
