name: Diagnostico 8 dos anuncios (strings do AdTela)

on:
  push:
    branches: [arena/5c219515-kode]
    paths: [.github/workflows/diag-anuncios8.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Baixar base v22 e desmontar
        run: |
          set -euo pipefail
          mkdir -p build/diag
          gh release download v1.0.87-universal-v22 -R "$GITHUB_REPOSITORY" \
            --pattern SMARTEDTV-universal.apk --dir build/diag --clobber
          mv build/diag/SMARTEDTV-universal.apk build/diag/base.apk
          cd build/diag
          unzip -o -q base.apk 'classes*.dex'
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          echo "TOOLS=$TOOLS" >> "$GITHUB_ENV"
          for dex in classes*.dex; do
            "$TOOLS/dexdump" -d "$dex" > "dump-$dex.txt" || true
          done
      - name: Strings e chamadas de cada classe de anuncio
        run: |
          set +e
          cd build/diag
          python3 - <<'PY'
          import glob, re
          alvos = ('Lsmartedtv/full/AdTela;', 'Lsmartedtv/full/PreRollActivity;',
                   'Lsmartedtv/full/AppOpenActivity;', 'Lsmartedtv/full/SmartAds;')
          por_classe = {}
          for caminho in glob.glob('dump-*.txt'):
              atual = None
              for linha in open(caminho, errors='replace'):
                  m = re.search(r"Class descriptor\s*:\s*'(L[^']+)'", linha)
                  if m:
                      atual = m.group(1)
                      continue
                  if atual in alvos:
                      por_classe.setdefault(atual, []).append(linha.rstrip())
          def n(t, v):
              v = re.sub(r'\s+', ' ', str(v)).strip()
              if v:
                  print('::notice::%s => %s' % (t, v[:880]))
          for classe, linhas in por_classe.items():
              texto = '\n'.join(linhas)
              nome = classe.split('/')[-1].rstrip(';')
              strs = re.findall(r'const-string(?:/jumbo)? v\d+, "(.*?)"', texto)
              strs = [s for s in dict.fromkeys(strs) if s]
              n(nome + ' N-STRINGS', len(strs))
              n(nome + ' STRINGS', ' | '.join(strs[:70]))
              # extras e unit ids
              n(nome + ' EXTRAS', ' | '.join(s for s in strs if re.search(r'extra|tipo|chave|unit|unidade|ads|vip|premio|reward|abertura|video|banner|teste|debug|diag', s, re.I))[:700])
              # chamadas ao SDK
              chamadas = re.findall(r'invoke-[a-z/]+\s+\{[^}]*\},\s+(Lcom/google/android/gms/ads[^;]*;\.[A-Za-z0-9_$<>]+)', texto)
              n(nome + ' SDK', ' | '.join(dict.fromkeys(chamadas))[:800])
              campos = re.findall(r'iget(?:-object|-boolean|-wide)? v\d+, v\d+, Lsmartedtv/full/[A-Za-z0-9_$]+;->(\w+):', texto)
              n(nome + ' CAMPOS', ' | '.join(dict.fromkeys(campos))[:500])
          PY
      - name: Guardar dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dump8-${{ github.run_id }}
          path: build/diag/dump-*.txt
          if-no-files-found: warn
