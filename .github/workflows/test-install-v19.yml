name: Testar instalacao do APK v19
on:
  push:
    branches: [arena/39a14845-kode]
    paths: [.github/workflows/test-install-v19.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  instalar:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Baixar APK universal v2
        run: |
          set -euo pipefail
          mkdir -p apk
          gh release download v1.0.89-instalacao-v19 \
            --pattern 'SMARTEDTV-atual-v19-instalacao-v2.apk' --dir apk --clobber
          mv apk/SMARTEDTV-atual-v19-instalacao-v2.apk apk/v19-v2.apk
          ls -lh apk/v19-v2.apk
          sha256sum apk/v19-v2.apk
      - name: Emulador Android 11 ARM64 e instalacao
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27
          target: google_apis
          arch: arm64-v8a
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 1800
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -memory 2048
          script: |
            adb install -r apk/v19-v2.apk
            adb shell pm path smartedtv.full
