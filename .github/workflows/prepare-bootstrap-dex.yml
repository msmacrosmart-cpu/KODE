name: Compilar bootstrap Android
on:
  push:
    branches: [arena/03cbbc5b-kode]
    paths: [.github/workflows/prepare-bootstrap-dex.yml]
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compilar somente código Java, sem backup ou chave
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/classes" "$RUNNER_TEMP/dex"
          SDK_JAR=$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          javac -source 8 -target 8 -classpath "$SDK_JAR" -d "$RUNNER_TEMP/classes" tools/android/src/org/smartedtv/bootstrap/*.java
          "$TOOLS/d8" --min-api 21 --lib "$SDK_JAR" --output "$RUNNER_TEMP/dex" $(find "$RUNNER_TEMP/classes" -name '*.class')
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          data=(pathlib.Path(os.environ['RUNNER_TEMP'])/'dex/classes.dex').read_bytes()
          body=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
          proc=subprocess.run(['gh','api','--method','POST','repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs','--input','-','--jq','.sha'], input=body, capture_output=True, check=True)
          print('::notice::BOOTSTRAP_DEX_BLOB='+proc.stdout.decode().strip())
          print('::notice::BOOTSTRAP_DEX_SHA256='+hashlib.sha256(data).hexdigest())
          PY
