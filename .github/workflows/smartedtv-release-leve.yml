name: SMARTEDTV - APK leve (Bingie + Estuary monocromatico)

# Reempacotamento RAPIDO, sem compilar o Kodi do codigo-fonte.
#
# Base: o APK 21.4.0 que ja foi compilado do codigo-fonte e publicado em
#       releases/tag/smartedtv-v21.4.0-arm64 (Kodi 21.3-Omega, commit a3a448d2).
#       Ele e baixado como insumo e NAO e alterado: libkodi.so, classes.dex,
#       AndroidManifest e todo o resto continuam byte a byte.
#
# O que muda neste build:
#   1. skin.titan.bingie.mod (Bingie Mod 2.2.3 + 15 dependencias) entra em
#      assets/addons/ e vira a skin padrao em assets/system/addon-manifest.xml
#      e no userdata inicial.
#   2. Essa mesma skin recebe a paleta preto/branco/cinza (colors/defaults.xml).
#   3. skin.estuary continua embarcada, tambem monocromatica: e a rede de
#      seguranca do Kodi (Application.cpp carrega o <default> se a skin
#      configurada falhar) e a alternativa em Ajustes > Aparencia > Skin.
#   4. versionName/versionCode sobem para 21.4.1 / 2104001, permitindo atualizar
#      por cima do 21.4.0 (mesma chave de assinatura).
#
# Tempo tipico: 4-8 min (o anterior deste tipo levava ~3 min).

on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'versionName novo (mesmo numero de caracteres do anterior)'
        type: string
        default: '21.4.1'
      codigo:
        description: 'versionCode novo'
        type: number
        default: 2104001
  push:
    branches: [arena/2e3d223d-kode]
    paths:
      - .github/workflows/smartedtv-release-leve.yml
      - tools/kodi/recolor-skin.py
      - tools/kodi/repack-skins.py
      - tools/kodi/diag-base.py

permissions:
  contents: write

concurrency:
  group: smartedtv-leve-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reempacotar:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      BASE_TAG: smartedtv-v21.4.0-arm64
      BASE_APK: SMARTEDTV-21.4.0-arm64-v8a.apk
      NOVA_VERSAO: ${{ inputs.versao || '21.4.1' }}
      NOVO_CODIGO: ${{ inputs.codigo || 2104001 }}
      TAG_SAIDA: smartedtv-v21.4.1-arm64-bingie
    steps:
      - uses: actions/checkout@v4

      - name: 1. Base compilada do codigo-fonte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base"
          gh release download "$BASE_TAG" -R "$GITHUB_REPOSITORY" \
            --pattern "$BASE_APK" --dir "$RUNNER_TEMP/base"
          cd "$RUNNER_TEMP/base"
          # integridade: o .sha256 publicado junto do APK
          gh release download "$BASE_TAG" -R "$GITHUB_REPOSITORY" \
            --pattern '*.sha256' --dir "$RUNNER_TEMP/base"
          sha256sum -c ./*.sha256
          ls -lh

      - name: 2. Ferramentas de reempacotamento
        run: ./tools/kodi/setup.sh

      - name: "3. Skins: Bingie + suas dependencias"
        run: |
          set -euo pipefail
          python3 tools/kodi/fetch-bingie-addons.py "$RUNNER_TEMP/extra"
          echo "--- addons ---"
          ls "$RUNNER_TEMP/extra"

      - name: "4. Paleta preto/branco/cinza (validacao do script)"
        run: |
          set -euo pipefail
          # A recoloracao efetiva acontece dentro do repack-skins.py, que trata
          # a Bingie e o Estuary do APK de uma vez. Aqui so confirmamos que o
          # script roda e que a paleta nao deixa cor saturada numa copia.
          cp -r "$RUNNER_TEMP/extra/skin.titan.bingie.mod" "$RUNNER_TEMP/paleta-teste"
          python3 tools/kodi/recolor-skin.py "$RUNNER_TEMP/paleta-teste" --skin bingie --report

      - name: 5. Montar o APK (Bingie + Estuary monocromaticos)
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/repack.log"
          {
            echo "== diagnostico da base =="
            python3 tools/kodi/diag-base.py "$RUNNER_TEMP/base/$BASE_APK"
          } 2>&1 | tee -a "$LOG"
          {
            python3 tools/kodi/repack-skins.py \
              "$RUNNER_TEMP/base/$BASE_APK" "$RUNNER_TEMP/novo.apk" \
              --bingie "$RUNNER_TEMP/extra" \
              --de-version 21.4.0 --para-version "$NOVA_VERSAO" \
              --de-code 2104000 --para-code "$NOVO_CODIGO"
          } 2>&1 | tee -a "$LOG"
          ls -lh "$RUNNER_TEMP/novo.apk"

      - name: 5b. Publicar log do repack (sempre)
        if: always()
        run: |
          LOG="$RUNNER_TEMP/repack.log"
          if [ -s "$LOG" ]; then
            # as annotations sao o unico canal de texto que a API entrega
            python3 - "$LOG" <<'PY'
          import pathlib, sys
          linhas = [l.rstrip() for l in pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines() if l.strip()]
          for i in range(0, len(linhas), 4):
              print('::error::' + ' | '.join(linhas[i:i+4])[:900])
          PY
          else
            echo "::warning::log do repack vazio (o passo 5 nem iniciou)"
          fi

      - name: 5c. Guardar log do repack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repack-log
          path: ${{ runner.temp }}/repack.log
          retention-days: 7
          if-no-files-found: warn

      - name: 6. Alinhar e assinar com a chave do projeto
        run: |
          set -eo pipefail
          CACHE="$HOME/.cache/kode-build"
          JAVA="$CACHE/python/jdk4py/java-runtime/bin/java"
          SIGNER="$CACHE/tools/apksigner.jar"
          python3 tools/kodi/align-apk.py "$RUNNER_TEMP/novo.apk" "$RUNNER_TEMP/alinhado.apk"
          "$JAVA" -jar "$SIGNER" sign \
            --ks dropbox/smarted-tv-test.jks --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias smarted-tv-test \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$RUNNER_TEMP/assinado.apk" "$RUNNER_TEMP/alinhado.apk"
          "$JAVA" -jar "$SIGNER" verify --verbose --print-certs "$RUNNER_TEMP/assinado.apk" \
            | tee "$RUNNER_TEMP/verify.txt"
          grep -qi "certificate SHA-256 digest: 855de171e5560d517db1a69f6aa55562b72c8b66f9cc29dfd55be0a8aa00951a" \
            "$RUNNER_TEMP/verify.txt" || { echo "::error::certificado inesperado"; exit 1; }

      - name: 7. Conferir o resultado
        env:
          PYTHONPATH: /home/runner/.cache/kode-build/python
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/conferencia.log"
          python3 tools/kodi/conferir-apk.py \
            "$RUNNER_TEMP/assinado.apk" \
            "$RUNNER_TEMP/base/$BASE_APK" \
            "$NOVA_VERSAO" "$NOVO_CODIGO" 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            python3 - "$LOG" <<'PY'
          import pathlib, sys
          linhas = [l.rstrip() for l in pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines() if l.strip()]
          for i in range(0, len(linhas), 3):
              print('::error::' + ' | '.join(linhas[i:i+3])[:900])
          PY
          fi
          exit "$rc"

      - name: 7b. Guardar log da conferencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conferencia-log
          path: ${{ runner.temp }}/conferencia.log
          retention-days: 7
          if-no-files-found: warn

      - name: 8. Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/assinado.apk" "SMARTEDTV-${NOVA_VERSAO}-arm64-v8a.apk"
          sha256sum "SMARTEDTV-${NOVA_VERSAO}-arm64-v8a.apk" > "SMARTEDTV-${NOVA_VERSAO}-arm64-v8a.apk.sha256"
          cat "SMARTEDTV-${NOVA_VERSAO}-arm64-v8a.apk.sha256"
          NOTES="SMARTEDTV ${NOVA_VERSAO} — Bingie Mod como skin padrao e Estuary monocromatico.

          Base: Kodi 21.3-Omega compilado do codigo-fonte (release ${BASE_TAG}).
          Esta versao apenas reempacota: libkodi.so e classes.dex nao mudam.

          - Skin padrao: Bingie Mod 2.2.3 (+15 dependencias), em preto/branco/cinza
          - Alternativa: Estuary original, tambem em preto/branco/cinza
          - Application ID: org.xbmc.kodi (preservado)
          - Assinatura: smarted-tv-test (atualiza o 21.4.0; nao atualiza Kodi oficial)
          - Sem Brazuka Play, sem skin Nova TV, sem perfil pre-configurado
          - SHA-256 no arquivo .sha256"
          if gh release view "$TAG_SAIDA" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_SAIDA" "SMARTEDTV-${NOVA_VERSAO}-arm64-v8a.apk" \
              "SMARTEDTV-${NOVA_VERSAO}-arm64-v8a.apk.sha256" -R "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG_SAIDA" -R "$GITHUB_REPOSITORY" --notes "$NOTES"
          else
            gh release create "$TAG_SAIDA" \
              "SMARTEDTV-${NOVA_VERSAO}-arm64-v8a.apk" \
              "SMARTEDTV-${NOVA_VERSAO}-arm64-v8a.apk.sha256" \
              -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "SMARTEDTV ${NOVA_VERSAO} (arm64-v8a) — Bingie padrao, preto/branco/cinza" \
              --notes "$NOTES"
          fi
          echo "::notice::https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG_SAIDA"

      - name: 9. Guardar artefato
        uses: actions/upload-artifact@v4
        with:
          name: smartedtv-apk-bingie
          path: |
            SMARTEDTV-*-arm64-v8a.apk
            SMARTEDTV-*.sha256
          retention-days: 30
          if-no-files-found: error
