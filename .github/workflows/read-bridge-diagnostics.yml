name: Examinar diagnóstico sintético da ponte
on:
  workflow_dispatch:
  push:
    branches: [arena/03cbbc5b-kode]
    paths: [.github/workflows/read-bridge-diagnostics.yml]
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: public-brazuka-diagnostics
          run-id: 42838311565
          github-token: ${{ github.token }}
          path: diagnostics
      - name: Examinar exclusivamente o perfil sintético
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for name in ('kodi-logcat.txt', 'logcat.txt'):
              p = Path('diagnostics') / name
              if not p.exists(): continue
              relevant = [line for line in p.read_text(errors='replace').splitlines()
                  if re.search(r'SMARTED_TEST|plugin.video.smarted|BrazucaPlay|python|ERROR|exception|Keyboard|search-series|MyVideoNav', line, re.I)]
              text = '\n'.join(relevant[-80:])[-20000:] or '(none)'
              print('::notice title=' + name + '::' + text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY

      - name: Ler captura sintética do teclado
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
          for image in screen; do
            if [ -s "diagnostics/$image.png" ]; then
              tesseract "diagnostics/$image.png" stdout 2>/dev/null > /tmp/ocr.txt || true
              IMAGE="$image" python3 - <<'PY'
          import os
          from pathlib import Path
          text = Path('/tmp/ocr.txt').read_text(errors='replace')
          print('::notice title=Screen ' + os.environ['IMAGE'] + '::' + text.replace('%','%25').replace('\n','%0A'))
          PY
            fi
          done

      - name: Examinar controles sintéticos
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path('diagnostics/search-window.xml')
          if p.exists():
              root = ET.parse(p).getroot()
              lines = [str({k:n.get(k) for k in ('class','resource-id','text','bounds','focused')}) for n in root.iter('node') if n.get('class') in ('android.widget.EditText','android.widget.Button')]
              print('::notice title=Native controls::' + '%0A'.join(lines).replace('%','%25').replace('%250A','%0A'))
          PY
      - name: Recuperar captura pública do emulador
        run: |
          python3 -m pip install --quiet 'Pillow==11.3.0'
          python3 - <<'PY'
          import base64, io
          from pathlib import Path
          from PIL import Image
          path = Path('diagnostics/screen.png')
          if path.exists():
              image = Image.open(path).convert('RGB')
              image.thumbnail((1280, 720))
              image = image.quantize(colors=48)
              buf = io.BytesIO(); image.save(buf, 'PNG', optimize=True)
              data = base64.b64encode(buf.getvalue()).decode()
              print('::notice title=Screen parts::' + str((len(data)+2999)//3000))
              for index, start in enumerate(range(0, len(data), 3000)):
                  print('::notice title=Screen part ' + str(index) + '::' + data[start:start+3000])
          PY
