name: Diag dex do perfil
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/diag-dex-perfil.yml']
jobs:
  ver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Comparar o APK real com o saneado (tamanho, compressao, dex)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          aviso() { printf '::notice::%s\n' "$(printf '%s' "$*" | tr '\r\n' '  ' | cut -c1-900)"; }
          mkdir -p /tmp/apk && cd /tmp/apk
          gh release download v1.0.141-universal -R msmacrosmart-cpu/KODE -p SMARTEDTV-universal.apk -O a.apk
          cd "$GITHUB_WORKSPACE"
          python3 tools/kodi/sanear-perfil-embarcado.py /tmp/apk/a.apk /tmp/apk/b.apk > /tmp/sanea.txt 2>&1 || true
          python3 tools/kodi/sanear-perfil-embarcado.py --reparar-dex /tmp/apk/b.apk /tmp/apk/c.apk > /tmp/repara.txt 2>&1 || true
          tail -2 /tmp/repara.txt | while read -r l; do aviso "reparar: $l"; done
          python3 - <<'PY'
          import zipfile
          def resumo(caminho):
              with zipfile.ZipFile(caminho) as z:
                  info = z.infolist()
              total = sum(i.compress_size for i in info)
              tipos = {}
              for i in info:
                  tipos[i.compress_type] = tipos.get(i.compress_type, 0) + 1
              return len(info), sum(i.file_size for i in info), total, tipos, {i.filename: i for i in info}
          for tag, caminho in (('a publicado', '/tmp/apk/a.apk'), ('b saneado', '/tmp/apk/b.apk'),
                               ('c reparado', '/tmp/apk/c.apk')):
              n, bruto, comp, tipos, _ = resumo(caminho)
              print('::notice::%s: %d entradas, %d bytes brutos, %d comprimidos, compress_type=%s'
                    % (tag, n, bruto, comp, tipos))
          _, _, _, _, a = resumo('/tmp/apk/a.apk')
          _, _, _, _, b = resumo('/tmp/apk/b.apk')
          mudou = [n for n in b if n in a and (a[n].compress_type != b[n].compress_type)]
          print('::notice::entradas com compressao diferente: %s' % (', '.join(mudou[:10]) or 'nenhuma'))
          faltando = sorted(set(a) - set(b))
          print('::notice::entradas que sairam: %d (ex.: %s)' % (len(faltando), ', '.join(faltando[:3])))
          # os .so e o dex tem de continuar como estavam
          for nome in ('lib/arm64-v8a/libkodi.so', 'classes.dex', 'classes4.dex', 'resources.arsc'):
              if nome in a and nome in b:
                  print('::notice::%s: antes tipo=%d tam=%d | depois tipo=%d tam=%d'
                        % (nome, a[nome].compress_type, a[nome].file_size,
                           b[nome].compress_type, b[nome].file_size))
              else:
                  print('::notice::%s: ausente em %s' % (nome, 'a' if nome not in a else 'b'))
          PY
          ls -l /tmp/apk/*.apk | while read -r l; do aviso "arquivo: $l"; done
