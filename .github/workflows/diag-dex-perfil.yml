name: Diag dex do perfil
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/diag-dex-perfil.yml']
jobs:
  ver:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: classes4.dex x bootstrap recompilado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          aviso() { printf '::notice::%s\n' "$(printf '%s' "$*" | tr '\r\n' '  ' | cut -c1-900)"; }
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          SDK_JAR=$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)
          mkdir -p /tmp/apk && cd /tmp/apk
          gh release download v1.0.141-universal -R msmacrosmart-cpu/KODE -p SMARTEDTV-universal.apk -O a.apk
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/apk/a.apk') as z:
              for nome in sorted(n for n in z.namelist() if n.endswith('.dex')):
                  d = z.read(nome)
                  print('::notice::%s %d bytes | bootstrap=%s | XBMCJsonRPC=%s | XBMCFileContentProvider=%s | ProfileSeed=%s'
                        % (nome, len(d), b'org/smartedtv/bootstrap' in d,
                           b'XBMCJsonRPC' in d, b'XBMCFileContentProvider' in d,
                           b'ProfileDirectorySeed' in d))
                  open('/tmp/%s' % nome, 'wb').write(d)
          PY
          echo '=== classes declaradas no classes4.dex (publicado)'
          { "$TOOLS/dexdump" /tmp/classes4.dex 2>/dev/null || true; } \
            | grep -oE "Class descriptor *: 'L[^']+;'" | sed "s/.*'L//;s/;'//" | sort -u > /tmp/classes_publicado.txt || true
          aviso "publicado: $(wc -l < /tmp/classes_publicado.txt) classes; primeiras: $(head -5 /tmp/classes_publicado.txt | tr '\n' ' ')"
          echo '=== recompilando o bootstrap do repositorio'
          mkdir -p /tmp/classes /tmp/dex
          javac -source 8 -target 8 -classpath "$SDK_JAR" -d /tmp/classes tools/android/src/org/smartedtv/bootstrap/*.java 2>&1 | tail -3 || true
          "$TOOLS/d8" --min-api 21 --lib "$SDK_JAR" --output /tmp/dex $(find /tmp/classes -name '*.class')
          { "$TOOLS/dexdump" /tmp/dex/classes.dex 2>/dev/null || true; } \
            | grep -oE "Class descriptor *: 'L[^']+;'" | sed "s/.*'L//;s/;'//" | sort -u > /tmp/classes_novo.txt || true
          aviso "recompilado: $(wc -l < /tmp/classes_novo.txt) classes; $(stat -c%s /tmp/dex/classes.dex) bytes"
          echo '=== so no publicado'
          comm -23 /tmp/classes_publicado.txt /tmp/classes_novo.txt | head -20 | while read -r l; do aviso "so publicado: $l"; done
          echo '=== so no recompilado'
          comm -13 /tmp/classes_publicado.txt /tmp/classes_novo.txt | head -20 | while read -r l; do aviso "so recompilado: $l"; done
          aviso "iguais: $(comm -12 /tmp/classes_publicado.txt /tmp/classes_novo.txt | wc -l)"
