name: diag-apk-info
# TEMPORARIO: le o APK publicado e grava em docs/apk-info-v15.txt
# minSdk/targetSdk, ABIs nativas e assinatura. Removido depois.
on:
  push:
    branches: [arena/39a14845-kode]
    paths: [.github/workflows/diag-apk-info.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  info:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/39a14845-kode
      - name: Baixar o APK v15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build
          gh release download v1.0.85-tela-inicial-v15 \
            --pattern 'SMARTEDTV-atual-com-tela-inicial-v15.apk' --dir build
          ls -l build
      - name: Ler manifesto e ABIs
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyaxmlparser==0.3.31
          APK=build/SMARTEDTV-atual-com-tela-inicial-v15.apk
          {
            echo "APK: $(basename "$APK")"
            echo "Tamanho: $(stat -c%s "$APK") bytes"
            echo "SHA-256: $(sha256sum "$APK" | cut -d' ' -f1)"
            echo
            python3 - "$APK" <<'PY'
          import sys
          from pyaxmlparser import APK
          a = APK(sys.argv[1])
          print('package:', a.package)
          print('versionName:', a.version_name)
          print('versionCode:', a.version_code)
          print('minSdk:', a.get_min_sdk_version())
          print('targetSdk:', a.get_target_sdk_version())
          for atributo in ('debuggable', 'testOnly'):
              try:
                  print('%s: %s' % (atributo, a.get_attribute_value('application', atributo)))
              except Exception as erro:
                  print('%s: ? (%s)' % (atributo, erro))
          try:
              print('features:', sorted(a.get_features()))
          except Exception as erro:
              print('features: ? (%s)' % erro)
          PY
            echo
            echo "ABIs nativas:"
            unzip -l "$APK" | awk '$4 ~ /^lib\// {print $4}' | cut -d/ -f2 | sort -u | sed 's/^/  /'
            echo
            echo "Segurança:"
            python3 - "$APK" <<'PY'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          nomes = z.namelist()
          print('META-INF:', [n for n in nomes if n.startswith('META-INF/')][:10])
          print('assinatura v2 presente:', any(n == 'META-INF/MANIFEST.MF' for n in nomes))
          PY
          } > docs/apk-info-v15.txt
          cat docs/apk-info-v15.txt
      - name: Commitar o relatorio
        run: |
          set -euo pipefail
          git config user.name 'diag-apk-info'
          git config user.email 'diag-apk-info@users.noreply.github.com'
          git add docs/apk-info-v15.txt
          git commit -m "diag: informacoes do APK v15 (minSdk, ABIs, assinatura)"
          git push origin HEAD:arena/39a14845-kode
