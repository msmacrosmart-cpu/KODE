name: Diagnostico 6 dos anuncios (codigo Java do APK base)

on:
  push:
    branches: [arena/5c219515-kode]
    paths: [.github/workflows/diag-anuncios6.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Baixar base v22
        run: |
          set -euo pipefail
          mkdir -p build/diag
          gh release download v1.0.87-universal-v22 -R "$GITHUB_REPOSITORY" \
            --pattern SMARTEDTV-universal.apk --dir build/diag --clobber
          mv build/diag/SMARTEDTV-universal.apk build/diag/base.apk
      - name: Baixar smali/baksmali para ler o codigo
        run: |
          set -euo pipefail
          cd build/diag
          curl -fsSL -o baksmali.jar https://github.com/baksmali/smali/releases/download/3.0.5/baksmali-3.0.5-fat.jar || \
          curl -fsSL -o baksmali.jar https://repo1.maven.org/maven2/org/smali/baksmali/2.5.2/baksmali-2.5.2.jar
          ls -l baksmali.jar
          unzip -o -q base.apk 'classes*.dex'
          ls -l classes*.dex
      - name: Desmontar apenas as classes de anuncio
        run: |
          set -euo pipefail
          cd build/diag
          unzip -p baksmali.jar META-INF/MANIFEST.MF | head -5 || true
          for dex in classes*.dex; do
            java -jar baksmali.jar d "$dex" -o "smali-$dex" >/dev/null 2>&1 || \
            java -jar baksmali.jar disassemble "$dex" -o "smali-$dex" >/dev/null 2>&1 || true
          done
          find . -path '*smali*' -name '*.smali' | grep -Ei "AdTela|PreRoll|AppOpen|SmartAds|Licenca" | head -20
      - name: Publicar o codigo das classes de anuncio
        run: |
          set -euo pipefail
          cd build/diag
          python3 - <<'PY'
          import glob, os, re
          alvos = ('AdTela', 'PreRollActivity', 'AppOpenActivity', 'SmartAds', 'Licenca')
          arquivos = []
          for raiz, _, nomes in os.walk('.'):
              for nome in nomes:
                  if nome.endswith('.smali') and any(a in nome for a in alvos):
                      arquivos.append(os.path.join(raiz, nome))
          arquivos.sort()
          print('::notice::SMALI arquivos: %d (%s)' % (len(arquivos), [os.path.basename(a) for a in arquivos][:12]))
          for caminho in arquivos[:8]:
              texto = open(caminho, errors='replace').read()
              # strings e chamadas relevantes
              chaves = [l.strip() for l in texto.splitlines()
                        if re.search(r'const-string|invoke-|sget-object|sput-object', l)]
              resumo = ' | '.join(chaves)[:3000]
              print('::notice::ARQUIVO %s' % os.path.basename(caminho))
              for i in range(0, len(resumo), 800):
                  print('::notice::%s [%d] %s' % (os.path.basename(caminho), i, resumo[i:i+800]))
          PY
      - name: Guardar smali das classes de anuncio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smali-ads-${{ github.run_id }}
          path: |
            build/diag/**/smali-*/**/Ad*.smali
            build/diag/**/smali-*/**/PreRoll*.smali
            build/diag/**/smali-*/smartedtv/full/*.smali
          if-no-files-found: warn
