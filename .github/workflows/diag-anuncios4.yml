name: Diagnostico 4 dos anuncios (manifesto real)

on:
  push:
    branches: [arena/5c219515-kode]
    paths: [.github/workflows/diag-anuncios4.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Baixar base v22
        run: |
          set -euo pipefail
          mkdir -p build/diag
          gh release download v1.0.87-universal-v22 -R "$GITHUB_REPOSITORY" \
            --pattern SMARTEDTV-universal.apk --dir build/diag --clobber
          mv build/diag/SMARTEDTV-universal.apk build/diag/base.apk
      - name: Manifesto em texto
        run: |
          set -euo pipefail
          cd build/diag
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print base.apk > manifest.xml
          wc -l manifest.xml
          echo "--- meta-data ---"
          grep -n "meta-data" manifest.xml | head -40
          echo "--- activities de anuncio ---"
          grep -n -i "AdTela\|PreRoll\|AppOpen\|AdBreak" manifest.xml | head -20
          echo "--- application id do admob ---"
          grep -n -i "APPLICATION_ID\|gms" manifest.xml | head -20
      - name: Anotacoes do manifesto
        run: |
          set +e
          cd build/diag
          python3 - <<'PY'
          import re
          txt = open('manifest.xml', errors='replace').read()
          linhas = [l.strip() for l in txt.splitlines()]
          metas = [l for l in linhas if 'meta-data' in l or 'ads' in l.lower()]
          for l in metas[:25]:
              print('::notice::MANIFESTO ' + re.sub(r'\s+', ' ', l)[:800])
          acts = [l for l in linhas if '<activity' in l or 'android:name="smartedtv' in l]
          for l in acts[:25]:
              print('::notice::ACT ' + re.sub(r'\s+', ' ', l)[:800])
          print('::notice::TEM-APPLICATION-ID ' + str('com.google.android.gms.ads.APPLICATION_ID' in txt))
          print('::notice::TEM-GMS ' + str(txt.count('com.google.android.gms')))
          PY
      - name: Guardar laudo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag4-${{ github.run_id }}
          path: build/diag/manifest.xml
          if-no-files-found: warn
