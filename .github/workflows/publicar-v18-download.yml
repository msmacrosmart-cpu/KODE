name: Publicar pacote de download v18

# Reempacota o APK já validado em um ZIP com CRC e publica uma release de
# download limpa. Não compila nem altera o APK; serve para o usuário baixar
# novamente e conferir a integridade antes de instalar.
on:
  push:
    branches: [arena/39a14845-kode]
    paths: [.github/workflows/publicar-v18-download.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGEM: v1.0.88-reabertura-v18
      APK: SMARTEDTV-atual-v18-reabertura-universal.apk
      DESTINO: v1.0.88-reabertura-v18-download
    steps:
      - uses: actions/checkout@v4
      - name: Baixar o APK validado
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$ORIGEM" --repo "$GITHUB_REPOSITORY" \
            --pattern "$APK" --dir dist --clobber
          echo 'b09cc6cfd7123a6a94163f92b1c85b0fb5907dce7bfbc486ed1ecb373014924e  dist/'"$APK" | sha256sum -c -
          test "$(stat -c %s "dist/$APK")" = 285488380
      - name: Criar ZIP com CRC e checksums
        run: |
          set -euo pipefail
          ( cd dist && zip -0 -q "$APK.zip" "$APK" )
          ( cd dist && sha256sum "$APK" > "$APK.sha256" )
          ( cd dist && sha256sum "$APK.zip" > "$APK.zip.sha256" )
          printf '%s\n' \
            'SMARTEDTV 1.0.88 (v18)' \
            '' \
            'APK: 285.488.380 bytes' \
            'SHA-256 do APK: b09cc6cfd7123a6a94163f92b1c85b0fb5907dce7bfbc486ed1ecb373014924e' \
            '' \
            'Baixe o APK ou o ZIP. Se baixar o ZIP, extraia o APK e instale.' \
            'Confira sempre o tamanho e o SHA-256 antes de instalar.' \
            'Nao desinstale nada: e uma atualizacao/primeira instalacao do pacote smartedtv.full.' \
            > dist/LEIA-ME.txt
          ls -lh dist
          cat dist/*.sha256
      - name: Publicar release de download
        run: |
          set -euo pipefail
          ASSETS=( "dist/$APK" "dist/$APK.sha256" "dist/$APK.zip" "dist/$APK.zip.sha256" dist/LEIA-ME.txt )
          if gh release view "$DESTINO" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$DESTINO" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$DESTINO" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'SMARTEDTV 1.0.88 (v18) - pacote de download' \
              --notes 'APK validado e ZIP com CRC para baixar novamente. Tamanho do APK: 285.488.380 bytes. SHA-256: b09cc6cfd7123a6a94163f92b1c85b0fb5907dce7bfbc486ed1ecb373014924e. O APK é o mesmo da release v1.0.88-reabertura-v18.'
          fi
