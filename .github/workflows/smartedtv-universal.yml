name: SMARTEDTV • APK universal Android 5.0+
on:
  push:
    branches: [arena/5c219515-kode]
    paths:
      - 'kodi/addons/service.smarted.bootstrap/smarted_release.py'
      # entradas da montagem: antes uma mudanca aqui nao gerava release
      - 'kodi/addons/service.smarted.bootstrap/vip.py'
      - 'kodi/addons/service.smarted.bootstrap/variante.py'
      - 'smartedtv/release/build.sh'
      - 'smartedtv/release/install-smoke.sh'
      - '.github/workflows/smartedtv-universal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartedtv-universal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/arena/5c219515-kode'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Preparar SDK, conferir backup do Dropbox e buscar base v22 assinada
        env:
          GH_TOKEN: ${{ github.token }}
        run: smartedtv/release/prepare.sh
      - name: Regressões de tela, controle remoto e overlays
        run: |
          python3 tools/kodi/static-check.py
          python3 -m unittest tests.test_release_universal tests.test_atualizar_apk tests.test_vip_botoes_android \
            tests.test_apk_nome_fixo tests.test_projetor_addons \
            tests.test_tela_entrada.TVBoxStickTest tests.test_tela_entrada.CicloDeVidaTest
      - name: Montar, alinhar, assinar e verificar o APK final
        shell: bash
        run: |
          if ! smartedtv/release/build.sh > "$RUNNER_TEMP/montagem.log" 2>&1; then
            tail -30 "$RUNNER_TEMP/montagem.log"
            echo "::error::$(tail -4 "$RUNNER_TEMP/montagem.log" | tr '\n' ' ')"
            exit 1
          fi
          tail -35 "$RUNNER_TEMP/montagem.log"
      - name: Auditoria do APK (laudo de evidências)
        run: |
          set -euo pipefail
          . kodi/addons/service.smarted.bootstrap/smarted_release.py
          bt="$ANDROID_HOME/build-tools/35.0.0"
          apk=build/universal/SMARTEDTV-universal.apk
          base=build/universal/base-v22.apk
          {
            echo "== APK final =="
            stat -c '%n %s bytes' "$apk"
            sha256sum "$apk"
            echo
            echo "== badging =="
            { "$bt/aapt" dump badging "$apk" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:|launchable-activity:|leanback-launchable-activity:|application-label:)" || true; }
            echo
            echo "== ABIs e libs nativas =="
            unzip -l "$apk" | awk '$4 ~ /^lib\// {n[$4]++} END {for (k in n) print k}' | sed 's|lib/\([^/]*\)/.*|\1|' | sort | uniq -c
            { unzip -l "$apk" | grep -c 'lib/.*\.so$' || true; } | sed 's/^/total de .so: /'
            echo
            echo
            echo "== zip: alinhamento e compressao =="
            # Instalar no Android exige recursos sem compressao e entradas
            # alinhadas (o zipalign que o build roda depois de assinar NAO
            # realinha: ele so confere). Este bloco prova os dois.
            "$bt/zipalign" -c -P 16 4 "$apk" && echo 'zipalign -c -P 16 4: OK' || echo 'zipalign: FALHOU'
            "$bt/zipalign" -c 4 "$apk" && echo 'zipalign -c 4: OK' || echo 'zipalign 4: FALHOU'
            unzip -v "$apk" | awk '$2=="Stored" {print $8}' | grep -E '^(resources\.arsc|AndroidManifest\.xml)$' || true
            echo
            echo "== assinatura =="
            { "$bt/apksigner" verify --min-sdk-version 21 --verbose --print-certs "$apk" | grep -E "Verified using|Number of signers|certificate SHA-256 digest|Signer #1 certificate DN" || true; }
            echo
            echo "== assinatura completa (codigo de saida) =="
            if "$bt/apksigner" verify --min-sdk-version 21 --print-certs "$apk" 2>&1; then
              echo 'apksigner verify: OK'
            else
              echo 'apksigner verify: FALHOU'
            fi
            echo
            echo "== providers e politica de arquivo (manifesto decodificado) =="
            grep -oE 'android:name="[^"]*FileProvider"' build/universal/manifest.xml | head -5 || true
            grep -oE 'android:authorities="[^"]*"' build/universal/manifest.xml | head -5 || true
            grep -oE 'requestLegacyExternalStorage="[^"]*"|usesCleartextTraffic="[^"]*"' build/universal/manifest.xml | head -3 || true
            echo
            echo "== identidade instalada (antes desta build) =="
            { grep -E "versionName|versionCode|primaryCpuAbi|codePath" build/universal/pacote-instalado.txt 2>/dev/null || echo "(sem dumpsys nesta etapa)"; } | head -8
          } | tee "$RUNNER_TEMP/laudo-apk.txt"
          # Regras objetivas: o laudo TEM de provar estas propriedades.
          # Em caso de falha, o laudo inteiro vai para a anotação do run
          # (o log do runner nem sempre fica acessível), e vira artefato.
          falhar() {
            echo "::error::$1"
            while IFS= read -r linha; do
              echo "::error::  $linha"
            done
            exit 1
          }
          grep -Fq "package: name='smartedtv.full' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" "$RUNNER_TEMP/laudo-apk.txt" \
            || falhar 'badging: pacote/versao/codigo nao conferem'
          grep -q "sdkVersion:'21'" "$RUNNER_TEMP/laudo-apk.txt" || falhar 'minSdkVersion nao e 21'
          grep -q "targetSdkVersion:'34'" "$RUNNER_TEMP/laudo-apk.txt" || falhar 'targetSdkVersion nao e 34'
          grep -q "native-code:.*'arm64-v8a'" "$RUNNER_TEMP/laudo-apk.txt" || falhar 'APK sem arm64-v8a'
          grep -q "native-code:.*'armeabi-v7a'" "$RUNNER_TEMP/laudo-apk.txt" || falhar 'APK sem armeabi-v7a'
          # v1 sai como "JAR signing"; v2/v3 como "APK Signature Scheme".
          grep -q 'Verified using v1 scheme (JAR signing): true' "$RUNNER_TEMP/laudo-apk.txt" || falhar 'assinatura v1 ausente'
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/laudo-apk.txt" || falhar 'assinatura v2 ausente'
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/laudo-apk.txt" || falhar 'assinatura v3 ausente'
          grep -Fq '855de171e5560d517db1a69f6aa55562b72c8b66f9cc29dfd55be0a8aa00951a' "$RUNNER_TEMP/laudo-apk.txt" \
            || falhar 'certificado diferente do historico (855de171...)'
          grep -q 'zipalign -c -P 16 4: OK' "$RUNNER_TEMP/laudo-apk.txt" || falhar 'APK nao esta alinhado a 16 KiB / 4 bytes'
          grep -q 'zipalign -c 4: OK' "$RUNNER_TEMP/laudo-apk.txt" || falhar 'APK nao esta alinhado a 4 bytes'
          grep -q '^resources\.arsc$' "$RUNNER_TEMP/laudo-apk.txt" || falhar 'resources.arsc nao esta sem compressao'
          grep -q '^apksigner verify: OK$' "$RUNNER_TEMP/laudo-apk.txt" || falhar 'apksigner nao reconheceu a assinatura completa'
          echo '::notice::Laudo do APK conferido: identidade, SDK 21, ABIs 32/64, assinatura v1/v2/v3 e certificado.'
          # Publicar as linhas do laudo como anotacao: o log do runner nao
          # fica sempre acessivel e a evidencia precisa ser legivel.
          while IFS= read -r linha; do
            [ -n "$linha" ] && echo "::notice::$linha"
          done < "$RUNNER_TEMP/laudo-apk.txt"
      - name: Guardar laudo do APK
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: laudo-apk-${{ github.run_id }}
          path: ${{ runner.temp }}/laudo-apk.txt
          if-no-files-found: warn
      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalar v22, atualizar sem desinstalar e abrir nos dois launchers
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disk-size: 4096M
          emulator-boot-timeout: 240
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: bash smartedtv/release/install-smoke.sh
      - name: Publicar somente SMARTEDTV-universal.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . kodi/addons/service.smarted.bootstrap/smarted_release.py
          tag="v${VERSION_NAME}-universal"
          apk=build/universal/SMARTEDTV-universal.apk
          # A v22 reutilizou o código da v17; 2103077 é o maior código prévio.
          # Depois da primeira publicação também conferimos o marcador desta linha.
          # Heredoc sem aspas: o shell expande $VERSION_* e $hash. A crase
          # PRECISA vir com escape de barra: sem ele o shell interpretaria o
          # trecho entre crases como comando e o texto publicado sairia vazio.
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .body > "$RUNNER_TEMP/anterior.md"
          anterior=$(sed -nE 's/.*<!-- smartedtv.full versionCode=([0-9]+) -->.*/\1/p' "$RUNNER_TEMP/anterior.md")
          (( VERSION_CODE > ${anterior:-2103077} )) || { echo '::error::versionCode não supera a última publicação'; exit 1; }
          hash=$(sha256sum "$apk" | cut -d' ' -f1)
          cat > "$RUNNER_TEMP/notas.md" <<NOTAS
          **Um unico APK universal**: \`SMARTEDTV-universal.apk\` roda em **celular/tablet** e em **Android TV, TV Box, TV Stick e projetor com Android TV**. Nao existe mais arquivo separado de TV.

          O mesmo aplicativo decide no aparelho o que fazer com anuncio, pela deteccao ja existente (\`variante.py\` / \`e_tv()\`):
          - **celular:** AdMob, como sempre foi;
          - **TV/box/stick/projetor:** anuncio de **video VAST** tocado pelo proprio player do Kodi (o AdMob nao tem formato suportado em Android TV, por declaracao do Google). Sem tag configurada nao ha anuncio e a reproducao nunca e bloqueada; a regra de frequencia (1 por conteudo por sessao, 2 min da conclusao/pulo, VIP nunca) continua valendo.
          - O APK vai **sem marcador de variante** de proposito: e esse marcador que forçaria a TV a se comportar como celular.

          - ABI: ARM 32 bits (\`armeabi-v7a\`) e 64 bits (\`arm64-v8a\`) no MESMO arquivo. Nao e XAPK e nao precisa de instalador de splits.
          - Android 5.0+ (API 21, target 34); celular e Android TV, box, projetor e Fire TV **com sistema Android compativel**. Nao inclui x86/Intel ou Vega OS.
          - Pacote Android: \`smartedtv.full\` (identificador historico, preservado). Versao **$VERSION_NAME** • codigo **$VERSION_CODE**. Mesmo perfil, layouts e bibliotecas do Kodi da v22.
          - Dropbox: este APK e publicado na pasta \`SMARTEDTV UNIVERSAL\` com o nome fixo \`SMARTEDTV.apk\`.
          - Assinatura v1/v2/v3: mesmo certificado de **teste** do historico, SHA-256 \`855de171e5560d517db1a69f6aa55562b72c8b66f9cc29dfd55be0a8aa00951a\`.
          - Validacao: manifesto, banner de TV, toque opcional, ELF/Dex, alinhamento, assinatura e boot simulado; no emulador API 30 com traducao ARM: instalacao limpa e atualizacao da v22 sem desinstalar, abertura por LAUNCHER e LEANBACK_LAUNCHER. Os dois caminhos de anuncio tem teste automatizado; **nao houve teste fisico em TV real** — a prova no aparelho e Ajustes > Testar anuncio.
          - **SHA-256:** \`$hash\` • $(stat -c %s "$apk") bytes.

          [Build e testes](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) • commit \`$GITHUB_SHA\`.
          <!-- smartedtv.full versionCode=$VERSION_CODE -->
          NOTAS
          # UM artefato, so. Nada de APK duplicado ou de arquivo de TV.
          rm -f build/universal/SMARTEDTV-tv.apk
          ls -l "$apk"
          gh release create "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "SMARTEDTV $VERSION_NAME — APK universal (celular + TV) ARM 32/64 • Android 5.0+" --notes-file "$RUNNER_TEMP/notas.md"
