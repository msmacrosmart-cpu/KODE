name: Enviar APK para release privado
on:
  push:
    branches: [arena/03cbbc5b-kode]
    paths: [.github/workflows/private-apk-release.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reconstituir APK e enviar somente ao release privado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY --jq .private)" = true
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          ids=json.loads(pathlib.Path('.github/private-apk-chunks.json').read_text())
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'SMARTED-TV-v1.0.19-arm64.apk'
          with output.open('wb') as out:
              for sha in ids:
                  p=subprocess.run(['gh','api','-H','Accept: application/vnd.github.raw+json',
                    'repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha],capture_output=True,check=True)
                  data=p.stdout
                  if hashlib.sha1(('blob %d\0' % len(data)).encode()+data).hexdigest() != sha:
                      raise SystemExit('Falha na integridade de um bloco')
                  out.write(data)
          if hashlib.sha256(output.read_bytes()).hexdigest() != '77817d863413c471cba38c71cdc4fc7ef5118583dafa09544593aca30407eeaf':
              raise SystemExit('Hash do APK não confere')
          print('Integridade do APK confirmada')
          PY
          gh release upload v1.0.19-smarted-arm64 "$RUNNER_TEMP/SMARTED-TV-v1.0.19-arm64.apk" --repo "$GITHUB_REPOSITORY"
          gh release view v1.0.19-smarted-arm64 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | {name,size,digest}'
          test "$(gh api repos/$GITHUB_REPOSITORY --jq .private)" = true
          gh release edit v1.0.19-smarted-arm64 --repo "$GITHUB_REPOSITORY" --draft=false
