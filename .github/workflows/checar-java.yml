name: Checar Java do app (javac rápido, sem compilar o Kodi)

# Compila só as classes Java que entram no APK (smartedtv/tools/ads-java/*.java.in)
# contra android.jar + play-services-ads. Serve para ver o erro REAL do javac em
# poucos minutos, sem esperar os ~25 min do build completo — e grava o resultado
# em docs/java-erros.txt (o log do Actions não é acessível por aqui).

on:
  workflow_dispatch:
  push:
    paths:
      - 'smartedtv/tools/ads-java/**'
      - '.github/workflows/checar-java.yml'

jobs:
  javac:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: android.jar (compileSdk 34)
        run: |
          set +e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK"
          if [ ! -f "$SDK/platforms/android-34/android.jar" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" >/dev/null 2>&1
          fi
          ls -la "$SDK/platforms/android-34/android.jar"

      - name: play-services-ads (AdMob)
        run: |
          set +e
          mkdir -p /tmp/j/ads
          # play-services-ads é só um "pom" que puxa a API: o código de verdade
          # (appopen, interstitial, AdRequest…) está em play-services-ads-api.
          for nome in play-services-ads play-services-ads-api; do
            curl -sSL -o "/tmp/j/$nome.aar" \
              "https://dl.google.com/dl/android/maven2/com/google/android/gms/$nome/23.2.0/$nome-23.2.0.aar"
            mkdir -p "/tmp/j/$nome" && ( cd "/tmp/j/$nome" && unzip -o -q "/tmp/j/$nome.aar" classes.jar || true )
            ls -la "/tmp/j/$nome/classes.jar" || true
          done
          cp -f /tmp/j/play-services-ads/classes.jar /tmp/j/ads/classes.jar || true
          unzip -l /tmp/j/ads/classes.jar | grep -c 'appopen\|interstitial' || true

      - name: javac das classes do app
        run: |
          set +e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AJAR="$SDK/platforms/android-34/android.jar"
          rm -rf /tmp/j/src /tmp/j/out
          mkdir -p /tmp/j/src/smartedtv/full /tmp/j/out
          for f in smartedtv/tools/ads-java/*.java.in; do
            n=$(basename "$f" .java.in)
            sed 's/@APP_PACKAGE@/smartedtv.full/g' "$f" > "/tmp/j/src/smartedtv/full/$n.java"
          done
          find /tmp/j/src -name '*.java' | sort > /tmp/j/files.txt
          wc -l /tmp/j/files.txt
          echo "::error title=diag::AJAR $(ls -la "$AJAR" 2>&1 | head -1 | tr '\n' ' ')"
          echo "::error title=diag::AAR $(ls -l /tmp/j/*.aar 2>&1 | tr '\n' '|')"
          echo "::error title=diag::API $(unzip -l /tmp/j/play-services-ads-api/classes.jar 2>&1 | head -6 | tr '\n' '|')"
          echo "::error title=diag::HTTP $(curl -s -o /dev/null -w '%{http_code}' https://dl.google.com/dl/android/maven2/com/google/android/gms/play-services-ads-api/23.2.0/play-services-ads-api-23.2.0.aar)"
          # JDK 17 não aceita mais -bootclasspath: android.jar vai no classpath
          javac -nowarn -source 8 -target 8 \
            -cp "$AJAR:/tmp/j/play-services-ads-api/classes.jar:/tmp/j/play-services-ads/classes.jar" \
            -d /tmp/j/out @/tmp/j/files.txt > /tmp/j/javac.txt 2>&1
          echo "javac exit=$?"
          # canal 1: anotações da checagem (o log do Actions não abre por aqui)
          tr -d '\r' < /tmp/j/javac.txt | grep -E 'error:|erro:' | head -12 | while IFS= read -r linha; do
            echo "::error title=javac::${linha//$'\n'/ }"
          done
          {
            echo "# javac das classes do app — $(date -u +%Y-%m-%dT%H:%MZ)"
            echo
            echo "run: $GITHUB_RUN_ID  commit: $(git rev-parse --short HEAD)"
            echo
            echo '```'
            grep -v '^warning:' /tmp/j/javac.txt | head -200
            echo '```'
          } > docs/java-erros.txt
          echo "arquivo com $(grep -c . docs/java-erros.txt) linha(s)"
          # canal 2: resumo do job
          head -40 docs/java-erros.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Guardar o resultado no repositório
        run: |
          set +e
          git config user.name "smarted-bot"
          git config user.email "smarted-bot@users.noreply.github.com"
          git add -f docs/java-erros.txt
          git commit -m "ci: javac das classes do app (run $GITHUB_RUN_ID)" || true
          git log --oneline -1 || true
          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}" || true
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "push ok"; break; fi
            git reset --hard "origin/${GITHUB_REF_NAME}" || true
            git commit --allow-empty -m "ci: javac das classes do app (run $GITHUB_RUN_ID) tentativa $i" || true
            sleep 10
          done
