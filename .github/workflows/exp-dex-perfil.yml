name: Experimento dex do perfil
# Isola a causa do NoClassDefFoundError visto no APK 1.0.143+:
#   A = perfil sem terceiros + pin trocado no dex (o que vai ao ar hoje)
#   B = perfil INTACTO, so o pin trocado no dex (mesmo pin? nao: pin novo)
#   C = perfil intacto e dex intacto (so reescreve o zip)
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/exp-dex-perfil.yml']
jobs:
  experimento:
    runs-on: macos-13
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Base v22
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/universal
          gh release download v1.0.87-universal-v22 -R msmacrosmart-cpu/KODE \
            --pattern SMARTEDTV-universal.apk --output build/universal/base-v22.apk
          printf '%s  %s\n' 18d95307a015d4e15d5d8b2c07d6f228a7a47c487b0c5891b9e55b4c5cccaaf0 build/universal/base-v22.apk | sha256sum -c -
      - name: Montar as tres variantes
        run: |
          set -euo pipefail
          aviso() { printf '::notice::%s\n' "$(printf '%s' "$*" | tr '\r\n' '  ' | cut -c1-900)"; }
          . smartedtv/tools/test-signing-env.sh
          bt="$ANDROID_HOME/build-tools/35.0.0"
          work=build/exp; mkdir -p "$work"
          cp build/universal/base-v22.apk "$work/base.apk"
          python3 - <<'PY'
          import importlib.util as u
          spec = u.spec_from_file_location('m', 'tools/kodi/sanear-perfil-embarcado.py')
          m = u.module_from_spec(spec); spec.loader.exec_module(m)
          m.executar('build/exp/base.apk', 'build/exp/A.apk', atualizar_origem=False)   # A
          # B: mesmo zip reescrito, arquivos todos mantidos, so o pin muda
          m.ADDONS_DE_TERCEIROS = ()
          m.executar('build/exp/base.apk', 'build/exp/B.apk', atualizar_origem=False)
          print('variantes geradas')
          PY
          cp "$work/base.apk" "$work/C.apk"
          for v in A B C; do
            "$bt/zipalign" -f -p 4 "$work/$v.apk" "$work/$v-a.apk" >/dev/null
            "$bt/apksigner" sign --ks "$KODI_ANDROID_STORE_FILE" --ks-key-alias "$KODI_ANDROID_KEY_ALIAS" \
              --ks-pass env:KODI_ANDROID_STORE_PASSWORD --key-pass env:KODI_ANDROID_KEY_PASSWORD \
              --out "$work/$v-s.apk" "$work/$v-a.apk"
            aviso "$v: $(stat -f%z "$work/$v-s.apk") bytes"
          done
      - name: Habilitar KVM
        run: |
          sudo chmod 666 /dev/kvm || true
      - name: Instalar cada variante e abrir
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
          disable-animations: true
          script: |
            set -uo pipefail
            aviso() { printf '::notice::%s\n' "$(printf '%s' "$*" | tr '\r\n' '  ' | cut -c1-700)"; }
            adb install build/exp/base-s.apk >/dev/null 2>&1 || aviso "base nao instalou (segue)"
            for v in A B C; do
              adb install -r "build/exp/$v-s.apk" >/dev/null 2>&1 || aviso "$v: instalacao falhou"
              adb shell am force-stop smartedtv.full
              adb logcat -c
              adb shell am start -W -n smartedtv.full/.Splash >/dev/null 2>&1
              sleep 12
              pid=$(adb shell pidof smartedtv.full | tr -d '\r')
              if [ -z "$pid" ]; then
                aviso "$v: MORREU -> $(adb logcat -b crash -d | grep -m1 -E 'NoClassDef|FATAL' | cut -c1-200)"
              else
                aviso "$v: vivo (pid $pid)"
              fi
            done
