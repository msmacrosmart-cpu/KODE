name: Experimento dex do perfil
# Isola a causa do NoClassDefFoundError visto no APK 1.0.143+:
#   A = perfil sem terceiros + pin trocado no dex (o que vai ao ar hoje)
#   B = perfil INTACTO, so o pin trocado no dex (mesmo pin? nao: pin novo)
#   C = perfil intacto e dex intacto (so reescreve o zip)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/exp-dex-perfil.yml'
      - 'tools/android/exp-dex.sh'
jobs:
  experimento:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Base v22
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/universal
          gh release download v1.0.87-universal-v22 -R msmacrosmart-cpu/KODE \
            --pattern SMARTEDTV-universal.apk --output build/universal/base-v22.apk
          printf '%s  %s\n' 18d95307a015d4e15d5d8b2c07d6f228a7a47c487b0c5891b9e55b4c5cccaaf0 build/universal/base-v22.apk | sha256sum -c -
      - name: Habilitar aceleracao
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalar cada variante e abrir
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: 10.1in WXGA (Tablet)
          disk-size: 4096M
          emulator-boot-timeout: 420
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
            -camera-back none -memory 3072
          disable-animations: true
          script: bash tools/android/exp-dex.sh
          # o script publica o crash como comentario do commit
        env:
          GH_TOKEN: ${{ github.token }}
