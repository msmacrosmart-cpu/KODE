name: diag-vip-api
# TEMPORARIO: descobre o contrato real da API de ativacao do site Lovable.
# Nao altera o APK nem o pipeline de build. Removido depois do diagnostico.
on:
  push:
    branches: [arena/39a14845-kode]
    paths: [.github/workflows/diag-vip-api.yml]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Investigar site, bundle e rotas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 - <<'PY' > /tmp/report.txt 2>&1
          import json, re, urllib.error, urllib.request
          BASE='https://smartedtv-vip.lovable.app'
          CLOUD='https://c--46253a5a-7cc0-450b-b632-d5ff956a7617-prod.lovable.cloud'
          KEY='sb_publishable_X7VUSJial2IQ7ctwI2-P9Q_cBs8-02e'
          out=[]
          def p(*a): out.append(' '.join(str(x) for x in a))
          def req(url, method='GET', data=None, headers=None, timeout=25):
              h={'User-Agent':'SMARTEDTV-diag','Accept':'application/json','Origin':BASE}
              h.update(headers or {})
              corpo=None
              if data is not None:
                  corpo=json.dumps(data).encode(); h['Content-Type']='application/json'
              try:
                  r=urllib.request.urlopen(urllib.request.Request(url,data=corpo,headers=h,method=method),timeout=timeout)
                  return r.status, dict(r.headers), r.read(500_000).decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read(100_000).decode('utf-8','replace')
              except Exception as e:
                  return 'ERR', {}, repr(e)
          def gerar():
              st,hd,txt=req(BASE+'/api/public/teste-vip',method='POST',data={})
              try: return json.loads(txt).get('code') or ''
              except Exception: return ''
          def val(codigo, cookie='', extra=None, rotulo=''):
              cab={'Accept':'application/json'}
              if cookie: cab['Cookie']=cookie
              corpo={'code':codigo}; corpo.update(extra or {})
              st,hd,txt=req(BASE+'/api/public/validar-codigo',method='POST',data=corpo,headers=cab)
              novo=hd.get('Set-Cookie','')
              m=re.search(r'smartedtv_device=([^;]+)',novo)
              p('')
              p('==',rotulo,'==')
              p('status',st,'json?',txt.lstrip().startswith(('{','[')),'body',txt[:400])
              p('cookie enviado?',bool(cookie),'novo cookie?',m.group(1) if m else '(nenhum)')
              return st,txt,(m.group(1) if m else '')
          p('== 1. REUTILIZAR CODIGO JA ATIVADO ==')
          c=gerar()
          if c:
              st,txt,cookie=val(c,'',{},'primeira ativacao')
              val(c,'smartedtv_device='+cookie,{},'segunda vez, MESMO cookie')
              val(c,'smartedtv_device=00000000-0000-0000-0000-000000000000',{},'terceira vez, cookie diferente')
          p('')
          p('== 2. CODIGO INVALIDO ==')
          val('CODIGO-INVALIDO-0000','',{},'invalido')
          val('','',{},'vazio')
          p('')
          p('== 3. SEGUNDO ENDPOINT NO HOST CLOUD ==')
          for rota in ('/api/public/validar-codigo','/functions/v1/validar-codigo','/rest/v1/rpc/validar_codigo'):
              for metodo,corpo in (('OPTIONS',None),('POST',{'code':'CODIGO-INVALIDO-0000'})):
                  st,hd,txt=req(CLOUD+rota,method=metodo,data=corpo,headers={'apikey':KEY,'Authorization':'Bearer '+KEY})
                  p(metodo,rota,'->',st,hd.get('content-type'),txt[:300].replace('\n',' '))
          p('')
          p('== 4. /public/api/cakto ==')
          for metodo,corpo,cab in (('POST',{'code':'CODIGO-INVALIDO-0000'},{'Accept':'application/json'}),('POST',{'code':'CODIGO-INVALIDO-0000'},{'Accept':'text/html'}),('GET',None,{'Accept':'text/html'})):
              st,hd,txt=req(BASE+'/public/api/cakto',method=metodo,data=corpo,headers=cab)
              p(metodo,'accept',cab.get('Accept'),'->',st,hd.get('content-type'),txt[:250].replace('\n',' '))
          p('')
          p('== 5. CABECALHOS DO SUCESSO ==')
          c2=gerar()
          if c2:
              st,hd,txt=req(BASE+'/api/public/validar-codigo',method='POST',data={'code':c2})
              p('status',st)
              for k,v in sorted(hd.items()):
                  if k.lower() in ('content-type','set-cookie','cache-control','vary','access-control-allow-origin','access-control-allow-credentials'):
                      p(k,'=',v)
              p('body',txt[:300])
          rel='\n'.join(out)
          open('/tmp/report.txt','w',encoding='utf-8').write(rel)
          PY
          gh release view diag-vip-api --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create diag-vip-api --repo "$GITHUB_REPOSITORY" \
                 --target "$GITHUB_SHA" --title 'Diagnostico API VIP' --notes 'iniciando'
          gh release edit diag-vip-api --repo "$GITHUB_REPOSITORY" --notes-file /tmp/report.txt
          echo "::notice::diagnostico publicado nas notas da release diag-vip-api"
