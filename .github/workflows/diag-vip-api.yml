name: diag-vip-api
# TEMPORARIO: descobre o contrato real da API de ativacao do site Lovable.
# Nao altera o APK nem o pipeline de build. Removido depois do diagnostico.
on:
  push:
    branches: [arena/39a14845-kode]
    paths: [.github/workflows/diag-vip-api.yml]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Investigar site, bundle e rotas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 - <<'PY' > /tmp/report.txt 2>&1
          import json, re, urllib.error, urllib.request
          from urllib.parse import urljoin
          BASE = 'https://smartedtv-vip.lovable.app'
          out=[]
          def p(*a):
              out.append(' '.join(str(x) for x in a))
          def req(url, method='GET', data=None, headers=None, timeout=25):
              h={'User-Agent':'SMARTEDTV-diag','Accept':'*/*'}; h.update(headers or {})
              corpo=None
              if data is not None:
                  corpo=json.dumps(data).encode(); h['Content-Type']='application/json'
              try:
                  r=urllib.request.urlopen(urllib.request.Request(url,data=corpo,headers=h,method=method),timeout=timeout)
                  return r.status, dict(r.headers), r.read(3_000_000).decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read(300_000).decode('utf-8','replace')
              except Exception as e:
                  return 'ERR', {}, repr(e)

          st,hd,html=req(BASE+'/')
          fila=[]; vistos=set()
          for u in re.findall(r'<script[^>]+src=["\']([^"\']+)',html): fila.append(u)
          for u in re.findall(r'<link[^>]+href=["\']([^"\']+)',html):
              if u.endswith('.js'): fila.append(u)
          chunks={}
          while fila and len(chunks)<50:
              u=urljoin(BASE+'/',fila.pop(0))
              if u in vistos or not u.startswith(BASE): continue
              vistos.add(u)
              st,hd,txt=req(u)
              if st!=200 or '.js' not in u: continue
              chunks[u]=txt
              for imp in re.findall(r'["\']((?:\.{0,2}/)?assets/[A-Za-z0-9_.-]+\.js)["\']',txt):
                  fila.append(imp)
              for imp in re.findall(r'import\(["\']([^"\']+\.js[^"\']*)["\']\)',txt):
                  fila.append(imp)
          p('CHUNKS', len(chunks))
          for u in sorted(chunks): p(' ', u.replace(BASE,''), len(chunks[u]))
          todo='\n'.join(chunks.values())
          p('')
          p('== ROTAS /api/ ==')
          for r in sorted(set(re.findall(r'["\'`](/api/[A-Za-z0-9_./-]+)["\'`]',todo))):
              p(' ', r)
          p('')
          p('== URLS lovable.cloud / supabase ==')
          for u in sorted(set(re.findall(r'https://[A-Za-z0-9._-]*(?:lovable\.cloud|supabase\.co)[A-Za-z0-9._/?=&%-]*',todo))):
              p(' ', u)
          p('')
          p('== CHAVES sb_publishable ==')
          for k in sorted(set(re.findall(r'sb_publishable_[A-Za-z0-9_-]+',todo))):
              p(' ', k[:16]+'...', 'len', len(k))
          p('')
          p('== CONTEXTO lovable.cloud ==')
          for t in sorted(set(re.findall(r'.{120}c--[A-Za-z0-9-]+\.lovable\.cloud.{200}',todo))):
              p(' ', re.sub(r'\s+',' ',t)[:500])
          p('')
          p('== MODULOS PEQUENOS (conteudo) ==')
          for u,t in sorted(chunks.items()):
              if len(t) < 22000 and any(x in u for x in ('admin','teste-vip','obrigado','checkout','_token')):
                  p('')
                  p('-----',u.replace(BASE,''),'-----')
                  p(t)
          p('')
          p('== CONTEXTOS fetch com URL ==')
          for t in sorted(set(re.findall(r'.{100}fetch\(.{250}',todo))):
              p(' ', re.sub(r'\s+',' ',t)[:450])
          p('')
          p('== PROBES ==')
          falso={'codigo':'DIAG-0000-XXXX','code':'DIAG-0000-XXXX','app':'smartedtv','device':'diag'}
          for rota in ('/api/public/teste-vip','/api/public/validar-codigo','/api/public/validar',
                       '/api/public/ativar','/api/validar-codigo','/api/ativar-codigo',
                       '/api/public/ativar-codigo','/api/public/status-codigo'):
              for metodo,corpo in (('OPTIONS',None),('POST',falso)):
                  st,hd,txt=req(BASE+rota,method=metodo,data=corpo)
                  p('%s %s -> %s %s' % (metodo,rota,st,hd.get('content-type')))
                  p('  ',txt[:400].replace('\n',' '))
          for rota in ('/api/admin/listar-codigos','/api/admin/gerar-codigo','/api/admin/criar-codigo'):
              st,hd,txt=req(BASE+rota,method='POST',data={'limit':1})
              p('POST',rota,'sem chave ->',st,txt[:300].replace('\n',' '))
          p('')
          p('== LOVABLE CLOUD ==')
          bases=sorted(set(re.findall(r'https://[A-Za-z0-9-]+\.lovable\.cloud',todo)))
          chaves=sorted(set(re.findall(r'sb_publishable_[A-Za-z0-9_-]+',todo)))
          p('bases',bases,'chaves',[(k[:12]+'...',len(k)) for k in chaves])
          for base in bases:
              for chave in chaves or ['']:
                  cab={'apikey':chave,'Authorization':'Bearer '+chave} if chave else {}
                  for caminho in ('/rest/v1/codigos?select=*&limit=1',
                                  '/rest/v1/codigos?codigo=eq.DIAG-0000-XXXX&select=*',
                                  '/rest/v1/codes?select=*&limit=1'):
                      st,hd,txt=req(base+caminho,headers=cab)
                      p('GET',caminho,'->',st)
                      try:
                          d=json.loads(txt)
                          if isinstance(d,list): p('  linhas',len(d),'chaves',sorted(d[0].keys()) if d else [])
                          else: p('  json',sorted(d.keys()) if isinstance(d,dict) else type(d).__name__)
                      except Exception: p('  ',txt[:300].replace('\n',' '))
          rel='\n'.join(out)
          if len(rel)>120000: rel=rel[:120000]+'\n[...truncado...]'
          open('/tmp/report.txt','w',encoding='utf-8').write(rel)
          PY
          gh release view diag-vip-api --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create diag-vip-api --repo "$GITHUB_REPOSITORY" \
                 --target "$GITHUB_SHA" --title 'Diagnostico API VIP' --notes 'iniciando'
          gh release edit diag-vip-api --repo "$GITHUB_REPOSITORY" --notes-file /tmp/report.txt
          echo "::notice::diagnostico publicado nas notas da release diag-vip-api"
