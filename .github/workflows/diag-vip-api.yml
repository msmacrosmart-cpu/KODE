name: diag-vip-api
# TEMPORARIO: descobre o contrato real da API de ativacao do site Lovable.
# Nao altera o APK nem o pipeline de build. Removido depois do diagnostico.
on:
  push:
    branches: [arena/39a14845-kode]
    paths: [.github/workflows/diag-vip-api.yml]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Investigar site, bundle e rotas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 - <<'PY' > /tmp/report.txt 2>&1
          import json, re, urllib.error, urllib.request
          BASE='https://smartedtv-vip.lovable.app'
          out=[]
          def p(*a): out.append(' '.join(str(x) for x in a))
          def req(url, method='GET', data=None, headers=None, timeout=25):
              h={'User-Agent':'SMARTEDTV-diag','Accept':'application/json','Origin':BASE}
              h.update(headers or {})
              corpo=None
              if data is not None:
                  corpo=json.dumps(data).encode(); h['Content-Type']='application/json'
              try:
                  r=urllib.request.urlopen(urllib.request.Request(url,data=corpo,headers=h,method=method),timeout=timeout)
                  return r.status, dict(r.headers), r.read(1_000_000).decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read(300_000).decode('utf-8','replace')
              except Exception as e:
                  return 'ERR', {}, repr(e)

          def gerar():
              st,hd,txt=req(BASE+'/api/public/teste-vip',method='POST',data={})
              p('GERAR ->',st,txt[:400])
              try:
                  d=json.loads(txt); return d.get('code') or ''
              except Exception: return ''

          def validar(codigo, corpo, rotulo):
              st,hd,txt=req(BASE+'/api/public/validar-codigo',method='POST',data=corpo)
              p('')
              p('== %s ==' % rotulo)
              p('codigo usado:', (codigo[:4]+'...'+codigo[-2:]) if codigo else '(vazio)')
              p('payload keys:', sorted(corpo.keys()))
              p('status:', st, 'content-type:', hd.get('content-type'))
              for k in ('access-control-allow-origin','set-cookie','www-authenticate','x-request-id'):
                  if k in hd: p('header',k,'=',hd[k])
              p('body:', txt[:800])
              try:
                  d=json.loads(txt)
                  p('json keys:', sorted(d.keys()) if isinstance(d,dict) else type(d).__name__)
                  for k in ('active','status','expiresAt','expires_at','expira','message','sessionId','device','devices','plan','type'):
                      if isinstance(d,dict) and k in d: p('  ',k,'=',repr(d[k])[:200])
              except Exception: p('(nao e json)')
              return st,txt

          c1=gerar()
          if c1:
              validar(c1, {'codigo':c1,'device':'diag-aparelho-A','app':'smartedtv','versao':'diag'}, 'teste 1: codigo+device+app')
              validar(c1, {'codigo':c1,'device':'diag-aparelho-A','app':'smartedtv'}, 'teste 2: MESMO codigo de novo (ja usado?)')
          c2=gerar()
          if c2:
              validar(c2, {'code':c2}, 'teste 3: campo code')
          c3=gerar()
          if c3:
              validar(c3, {'codigo':c3}, 'teste 4: so codigo, sem device')
          c4=gerar()
          if c4:
              validar(c4, {'device':'diag-aparelho-B'}, 'teste 5: sem codigo')
          p('')
          p('== /public/api/cakto com codigo de teste ==')
          if c4:
              st,hd,txt=req(BASE+'/public/api/cakto',method='POST',data={'codigo':c4})
              p('POST /public/api/cakto ->',st,hd.get('content-type'),'json?',txt.lstrip().startswith(('{','[')))
              p(txt[:300].replace('\n',' '))
          p('')
          p('== rotas publicas restantes ==')
          for rota in ('/api/public/entrega','/api/public/confirmar-email'):
              st,hd,txt=req(BASE+rota,method='OPTIONS')
              p('OPTIONS',rota,'->',st)
              st,hd,txt=req(BASE+rota,method='POST',data={})
              p('POST',rota,'->',st,hd.get('content-type'),txt[:300].replace('\n',' '))
          rel='\n'.join(out)
          if len(rel)>120000: rel=rel[:120000]+'\n[...truncado...]'
          open('/tmp/report.txt','w',encoding='utf-8').write(rel)
          PY
          gh release view diag-vip-api --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create diag-vip-api --repo "$GITHUB_REPOSITORY" \
                 --target "$GITHUB_SHA" --title 'Diagnostico API VIP' --notes 'iniciando'
          gh release edit diag-vip-api --repo "$GITHUB_REPOSITORY" --notes-file /tmp/report.txt
          echo "::notice::diagnostico publicado nas notas da release diag-vip-api"
