name: diag-vip-api
# TEMPORARIO: descobre o contrato real da API de ativacao do site Lovable.
# Nao altera o APK nem o pipeline de build. Removido depois do diagnostico.
on:
  push:
    branches: [arena/39a14845-kode]
    paths: [.github/workflows/diag-vip-api.yml]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Investigar site, bundle e rotas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 - <<'PY' > /tmp/report.txt 2>&1
          import json, re, urllib.error, urllib.request
          from urllib.parse import urljoin

          BASE = 'https://smartedtv-vip.lovable.app'
          UA = 'Mozilla/5.0 (Linux; Android 11) SMARTEDTV-diag'
          out = []
          def p(*a):
              linha = ' '.join(str(x) for x in a)
              out.append(linha)
              print(linha, flush=True)

          def req(url, method='GET', data=None, headers=None, timeout=25):
              h = {'User-Agent': UA, 'Accept': '*/*'}
              h.update(headers or {})
              corpo = None
              if data is not None:
                  corpo = json.dumps(data).encode()
                  h['Content-Type'] = 'application/json'
              pedido = urllib.request.Request(url, data=corpo, headers=h, method=method)
              try:
                  with urllib.request.urlopen(pedido, timeout=timeout) as r:
                      return r.status, dict(r.headers), r.read(4_000_000).decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read(400_000).decode('utf-8', 'replace')
              except Exception as e:
                  return 'ERR', {}, repr(e)

          st, hd, html = req(BASE + '/')
          p('HTML', st, 'len', len(html))
          for k in ('server','x-vercel-id','x-powered-by','cf-ray','x-lovable','x-deployment-id','cache-control'):
              if k in hd: p('header', k, '=', hd[k])
          p('scripts:', re.findall(r'<script[^>]+src=["\']([^"\']+)', html))
          p('links js:', sorted(set(re.findall(r'["\']([^"\']+\.js[^"\']*)["\']', html)))[:30])
          p('form action:', re.findall(r'<form[^>]*action=["\']([^"\']*)', html))

          vistos = set()
          fila = []
          def enfileirar(u):
              u = urljoin(BASE + '/', u).split('#')[0]
              if u not in vistos and u.startswith(BASE) and ('.js' in u or '/assets/' in u):
                  vistos.add(u); fila.append(u)
          for u in re.findall(r'<script[^>]+src=["\']([^"\']+)', html):
              enfileirar(u)
          textos = {'HTML': html}
          while fila and len(textos) < 40:
              u = fila.pop(0)
              st, hd, txt = req(u)
              p('CHUNK', u.replace(BASE,''), st, len(txt))
              if st != 200: continue
              textos[u] = txt
              for imp in re.findall(r'["\']((?:\.{0,2}/)?assets/[A-Za-z0-9_.-]+\.js)["\']', txt):
                  enfileirar(imp)
              for imp in re.findall(r'import\(["\']([^"\']+\.js[^"\']*)["\']\)', txt):
                  enfileirar(imp)

          urls = set()
          for nome, txt in textos.items():
              for u in re.findall(r'https?://[^"\'`\s<>\\)]+', txt):
                  u = u.rstrip('.,;:')
                  if any(x in u for x in ('w3.org','schema.org','fonts.googleapis','fonts.gstatic','lovable.dev','github.com','reactjs.org','mozilla.org','google.com','youtube.com','instagram.com')):
                      continue
                  urls.add(u)
          p('')
          p('== URLS EXTERNAS ==')
          for u in sorted(urls):
              p(' ', u[:300])

          def trechos(texto, padrao, largura=180, limite=25):
              vistos = []
              for m in re.finditer(padrao, texto, re.I):
                  ini = max(0, m.start() - largura // 2); fim = min(len(texto), m.end() + largura // 2)
                  t = texto[ini:fim].replace('\n',' ')
                  t = re.sub(r'eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}', '<CHAVE>', t)
                  if t not in vistos: vistos.append(t)
                  if len(vistos) >= limite: break
              return vistos

          todo = '\n'.join(textos.values())
          for rotulo, padrao in (
              ('fetch', r'fetch\s*\('),
              ('axios', r'axios'),
              ('api path', r'["\'][^"\']*/(?:api|functions|rest|rpc|public)/[^"\']*["\']'),
              ('supabase', r'supabase'),
              ('codigo/ativ', r'(?:codigo|código|ativar|validar|validate|activate|license|licen[cç]a)'),
              ('cakto', r'cakto'),
              ('webhook/payment', r'(?:webhook|payment|pagamento|checkout|pix|obrigado)'),
              ('function invoke', r'(?:\.functions|functions/v1|invoke\s*\()'),
          ):
              p('')
              p('== TRECHOS', rotulo, '==')
              for t in trechos(todo, padrao, limite=15):
                  p('  ', t[:420])

          p('')
          p('== ARQUIVOS DE ROTA ==')
          for rota in ('/ativar','/obrigado','/retorno','/api','/api/','/public/api/cakto'):
              st, hd, txt = req(BASE + rota)
              p(rota, '->', st, hd.get('content-type'), 'len', len(txt), 'json' if txt.lstrip().startswith(('{','[')) else 'html')

          relatorio = '\n'.join(out)
          if len(relatorio) > 120000:
              relatorio = relatorio[:120000] + '\n[...truncado...]'
          open('/tmp/report.txt','w',encoding='utf-8').write(relatorio)
          PY
          gh release view diag-vip-api --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create diag-vip-api --repo "$GITHUB_REPOSITORY" \
                 --target "$GITHUB_SHA" --title 'Diagnostico API VIP' --notes 'iniciando'
          gh release edit diag-vip-api --repo "$GITHUB_REPOSITORY" --notes-file /tmp/report.txt
          echo "::notice::diagnostico publicado nas notas da release diag-vip-api"
