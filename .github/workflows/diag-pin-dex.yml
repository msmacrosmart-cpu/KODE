name: Diag pin no dex
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/diag-pin-dex.yml']
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Procurar o pin do manifesto dentro do APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          aviso() { printf '::notice::%s\n' "$(printf '%s' "$*" | tr '\r\n' '  ' | cut -c1-900)"; }
          mkdir -p apk && gh release download v1.0.141-universal -R msmacrosmart-cpu/KODE -p SMARTEDTV-universal.apk -O apk/a.apk
          python3 - <<'PY'
          import zipfile
          pin = b'1447de816a44ecc11c42c2c315cf20e61c9baa037e914a13293711cf152d1ede'
          with zipfile.ZipFile('apk/a.apk') as z:
              for nome in z.namelist():
                  if not nome.endswith('.dex'):
                      continue
                  dados = z.read(nome)
                  n = dados.count(pin)
                  print('::notice::%s: %d ocorrencia(s) do pin, %d bytes' % (nome, n, len(dados)))
              perfil = [n for n in z.namelist() if n.startswith('assets/smarted/profile/addons/')]
              ids = sorted({n.split('/')[4] for n in perfil if len(n.split('/')) > 4})
              print('::notice::addons no perfil embarcado: %s' % ', '.join(ids))
          PY
