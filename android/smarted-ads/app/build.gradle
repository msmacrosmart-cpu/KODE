plugins {
    id 'com.android.application'
}

// Valores reais do AdMob. Ficam aqui (e nao espalhados no codigo) para o build
// conferir que o APK saiu com os IDs certos.
def admobAppId = 'ca-app-pub-2066014755407744~5076693043'
def adUnitAppOpen = 'ca-app-pub-2066014755407744/4214378379'
def adUnitPreRoll = 'ca-app-pub-2066014755407744/3572039686'

// PACKAGE do app de anuncios. Precisa ser UNICO no aparelho: o Kodi e
// org.xbmc.kodi e o Android nao aceita dois pacotes com o mesmo nome (instalar
// um sobrescreveria o outro). Por isso o padrao e org.smartedtv.ads.
// Fonte unica do pacote: android/smarted-ads/app-id.txt (uma linha).
// o arquivo fica na raiz do projeto Gradle (android/smarted-ads/app-id.txt)
def adsAppId = (project.findProperty('adsAppId')
        ?: rootProject.file('app-id.txt').text.trim()).toString()

// MODO DE TESTE do AdMob: com os blocos de teste oficiais do Google o anuncio
// SEMPRE aparece, o que separa "a ponte funciona?" de "a conta tem inventario?".
// Desligar: -PadsTeste=false
def adsTeste = (project.findProperty('adsTeste') ?: 'true').toString()
// hash do dispositivo de teste (opcional): -PadsTesteHash=ABCDEF123...
def adsTesteHash = (project.findProperty('adsTesteHash') ?: '').toString()

// APK PRINCIPAL que este app instala. Fonte unica: apk-url.txt (chave=valor),
// com sobrescrita pelo CI (-PapkUrl=... / -PapkCodigo=...).
def distribuicao = [:]
rootProject.file('apk-url.txt').eachLine { linha ->
    def texto = linha.trim()
    if (texto.isEmpty() || texto.startsWith('#')) {
        return
    }
    def corte = texto.indexOf('=')
    if (corte > 0) {
        distribuicao[texto.substring(0, corte).trim()] = texto.substring(corte + 1).trim()
    }
}
def apkUrl = (project.findProperty('apkUrl') ?: distribuicao['url'] ?: '').toString()
def apkCodigo = (project.findProperty('apkCodigo')
        ?: distribuicao['codigo'] ?: '0').toString().toInteger()

// versao vem do CI (-PadsVersionName / -PadsVersionCode) com padrao local
def adsVersionName = (project.findProperty('adsVersionName') ?: '1.0.0').toString()
def adsVersionCode = (project.findProperty('adsVersionCode') ?: '1').toString().toInteger()

android {
    namespace 'org.smartedtv.ads'
    compileSdk 34

    defaultConfig {
        applicationId adsAppId
        minSdk 21
        targetSdk 34
        versionCode adsVersionCode
        versionName adsVersionName

        buildConfigField "boolean", "ADS_TESTE", adsTeste
        buildConfigField "String", "ADS_TESTE_HASH", '\"' + adsTesteHash + '\"'
        buildConfigField "String", "APK_URL", '\"' + apkUrl + '\"'
        buildConfigField "int", "APK_CODIGO_MINIMO", apkCodigo.toString()
    }

    buildTypes {
        release {
            // assinado no CI com a mesma chave da linha SMARTED-TV
            // (apksigner + dropbox/smarted-tv-test.jks)
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Google Play Services Ads (AdMob): App Open + interstitial com criativo de video
    implementation 'com.google.android.gms:play-services-ads:23.2.0'
    // so o FileProvider (entrega o APK baixado ao instalador por content://)
    implementation 'androidx.core:core:1.12.0'
}

// Conferencia unica do app de anuncios (roda no CI: `gradle :app:checkAdMob`).
//
// 1. TRAVA DE PACOTE: o app de anuncios NUNCA pode usar o pacote do Kodi. Com a
//    mesma assinatura da linha, um APK com applicationId org.xbmc.kodi tentaria
//    SUBSTITUIR o Kodi instalado — o Android nao aceita dois apps com o mesmo
//    pacote (e a versao 1 vs 2103046 ainda faria o instalador recusar).
// 2. Os IDs REAIS do AdMob tem que estar no manifesto e no codigo.
def pacotesProibidos = ['org.xbmc.kodi']

tasks.register('checkAdMob') {
    doLast {
        if (pacotesProibidos.contains(adsAppId)) {
            throw new GradleException(
                "applicationId '${adsAppId}' e o pacote do Kodi: o Android nao permite " +
                "dois apps com o mesmo pacote. Instalar este APK tentaria substituir o " +
                "Kodi (falha por versao) ou remover o Kodi do aparelho. Use um pacote " +
                "proprio, ex.: org.smartedtv.ads")
        }
        def manifest = file('src/main/AndroidManifest.xml').text
        if (!manifest.contains(admobAppId)) {
            throw new GradleException("APPLICATION_ID do AdMob ausente no manifesto: ${admobAppId}")
        }
        def ads = file('src/main/java/org/smartedtv/ads/Ads.java').text
        if (!ads.contains(adUnitAppOpen) || !ads.contains(adUnitPreRoll)) {
            throw new GradleException('IDs de bloco de anuncio ausentes em Ads.java')
        }
        // 3. INSTALADOR: o APK principal tem que ter um endereco https valido e a
        //    tela de boas-vindas / FileProvider tem que estar no manifesto.
        if (!apkUrl.startsWith('https://') || !apkUrl.endsWith('.apk')) {
            throw new GradleException("apk-url.txt sem um link https de .apk valido: '${apkUrl}'")
        }
        if (apkCodigo <= 0) {
            throw new GradleException("apk-url.txt sem 'codigo=' (versionCode minimo do Kodi)")
        }
        ['android.permission.REQUEST_INSTALL_PACKAGES',
         'org.smartedtv.ads.BoasVindasActivity',
         'androidx.core.content.FileProvider',
         '@xml/file_paths'].each { item ->
            if (!manifest.contains(item)) {
                throw new GradleException("manifesto sem '${item}' (instalador incompleto)")
            }
        }
        println "Pacote do app de anuncios: ${adsAppId}"
        println "AdMob conferido: app ${admobAppId}, abertura ${adUnitAppOpen}, video ${adUnitPreRoll}"
        println "APK principal: ${apkUrl} (versionCode minimo ${apkCodigo})"
    }
}
